                    sub={`spread · ${g.spread_source}`} />
        </div>

        <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>Market Sentiment</div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
          <StatTile label="Advance / Decline"
                    value={ad.available ? `▲${ad.advances} / ▼${ad.declines}` : null}
                    sub={ad.available ? `Unchanged ${ad.unchanged} · ${ad.source}` : "unavailable"}
                    tone={ad.available ? (ad.advances > ad.declines ? "bullish" : "bearish") : "neutral"} />
          <StatTile label="India VIX" value={data.india_vix === null ? null : fmtNum(data.india_vix)}
                    sub={data.india_vix === null ? "requires Angel connection"
                         : data.india_vix > 20 ? "High fear" : data.india_vix < 14 ? "Low vol" : "Normal"}
                    tone={data.india_vix === null ? "neutral" : data.india_vix > 20 ? "bearish" : data.india_vix < 14 ? "bullish" : "warn"} />
          <StatTile label="PCR (OI)" value={fmtNum(data.pcr)}
                    sub={data.pcr === null ? "chain unavailable" : (data.pcr > 1 ? "Bullish" : "Bearish")}
                    tone={data.pcr === null ? "neutral" : (data.pcr > 1 ? "bullish" : "bearish")} />
        </div>

        <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>FII / DII Participant Flow</div>
        {fd.available ? (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
            <StatTile label="FII Net (latest)" value={`₹${fmtNum(fd.latest_fii_net)} Cr`} tone={flowTone(fd.latest_fii_net)} />
            <StatTile label="DII Net (latest)" value={`₹${fmtNum(fd.latest_dii_net)} Cr`} tone={flowTone(fd.latest_dii_net)} />
            <StatTile label="FII 30d" value={`₹${fmtNum(fd.cumulative_fii_30d)} Cr`} tone={flowTone(fd.cumulative_fii_30d)} />
            <StatTile label="DII 30d" value={`₹${fmtNum(fd.cumulative_dii_30d)} Cr`} sub={`sentiment ${fd.sentiment}`} tone={flowTone(fd.cumulative_dii_30d)} />
          </div>
        ) : (
          <div className="mb-4 text-[11px]" style={{ color: "var(--text-dim)" }}>
            FII/DII data unavailable{fd.source ? ` — ${fd.source}` : ""}.
          </div>
        )}

        <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>
          Technical Indicator Matrix
          <span className="ml-2 font-normal normal-case" style={{ color: "var(--text-dim)" }}>
            consensus: {data.trend_consensus || "—"}
          </span>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3 mb-4">
          {Object.entries(metrics).map(([group, vals]) => (
            <div key={group} className="rounded-lg border p-2.5" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
              <div className="text-[10px] font-bold uppercase tracking-wide mb-1.5" style={{ color: "var(--text-mid)" }}>{group}</div>
              {Object.entries(vals || {}).map(([k, v]) => (
                <div key={k} className="flex justify-between text-[10px] py-0.5">
                  <span style={{ color: "var(--text-dim)" }}>{k}</span>
                  <span style={{ color: v === null ? "var(--text-dim)" : "var(--text-bright)" }}>
                    {v === null ? "n/a" : (typeof v === "number" ? fmtNum(v, 3) : String(v))}
                  </span>
                </div>
              ))}
            </div>
          ))}
        </div>

        {signals.length > 0 && (
          <>
            <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>Signal Matrix</div>
            <div className="rounded-lg border overflow-x-auto" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
              <table className="w-full text-[11px]" data-testid="derivatives-signals">
                <thead><tr style={{ color: "var(--text-dim)" }}>
                  {sigCols.map(c => <th key={c} className="px-2 py-1.5 text-left font-semibold">{c}</th>)}
                </tr></thead>
                <tbody>
                  {signals.map((row, i) => (
                    <tr key={i}>
                      {sigCols.map(c => (
                        <td key={c} className="px-2 py-1" style={{ color: row[c] === null ? "var(--text-dim)" : "var(--text-mid)" }}>
                          {row[c] === null || row[c] === undefined ? "—" : String(row[c])}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── F&O Command section (Sprint DD-8) ────────────────────────────────────
// Twin of Streamlit's ☢️ F&O Command tab. Numbers come from /fno; the six
// charts come from the EXISTING /charts?type=derivatives|fno (DD-1 builders via
// DD-2), deliberately not duplicated into the /fno payload.

function StatTile({ label, value, sub, tone }) {
  const missing = value === null || value === undefined || value === "";
  return (
    <div className="rounded-lg border p-2.5" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
      <div className="text-[10px] uppercase tracking-wide" style={{ color: "var(--text-dim)" }}>{label}</div>
      <div className="text-[15px] font-bold"
           style={{ color: missing ? "var(--text-dim)" : (DECK_TONE_COLOR[tone] || "var(--text-bright)") }}>
        {missing ? "n/a" : value}
      </div>
      {sub && <div className="text-[10px] mt-0.5" style={{ color: "var(--text-dim)" }}>{sub}</div>}
    </div>
  );
}

function FnoCommandSection({ ticker }) {
  const { data, error, loading, reload, source, sourceDetail, asOf } =
    useTickerFetch("fno", null, ticker);
  // The charts are a separate, already-existing endpoint. Fetched here so the
  // tab shows structure + chain + charts together the way Streamlit does.
  const charts = useTickerFetch("charts?type=derivatives", null, ticker);
  const fnoCharts = useTickerFetch("charts?type=fno", null, ticker);

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Loading F&O command…</div>;
  if (error) return <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>Could not load F&O data: {error}</div>;
  if (!data) return null;

  const f = data.futures || {};
  const s = data.structure || {};
  const g = data.atm_greeks || {};
  const chain = data.chain || [];
  const cols = data.chain_columns || [];

  const chartBlocks = []
    .concat(Object.entries((charts.data && charts.data.charts) || {}))
    .concat(Object.entries((fnoCharts.data && fnoCharts.data.charts) || {}));

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <SourceBadge source={source} detail={sourceDetail} />
        <AsOfBadge asOf={asOf} />
        {/* Streamlit shows a green "LIVE F&O FEED CONNECTED" / amber
            "SIMULATION MODE" banner. Same meaning, existing tokens, no new
            colours (DD-8 §Frontend). */}
        <span className="px-2 py-0.5 rounded text-[10px] font-bold border"
              style={data.is_live && source === "LIVE"
                ? { color: "var(--accent-green)", borderColor: "var(--accent-green)", background: tint("--accent-green", 12) }
                : { color: "var(--accent-amber)", borderColor: "var(--accent-amber)", background: tint("--accent-amber", 12) }}>
          {data.is_live && source === "LIVE" ? "F&O FEED (SNAPSHOT)" : "SIMULATION MODE"}
        </span>
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          Spot ₹{fmtNum(data.spot)} · ATM {data.atm_strike} · {s.days_to_expiry} DTE
        </span>
        <button onClick={() => { reload(); charts.reload(); fnoCharts.reload(); }}
                className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3">
        <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-2 mb-4">
          <StatTile label="PCR (OI)" value={fmtNum(s.pcr_oi)} sub={s.pcr_label} />
          <StatTile label="Max Pain" value={s.max_pain} sub={`${fmtNum(s.max_pain_distance_pct)}% away`} />
          <StatTile label="Net GEX" value={s.net_gex === null ? null : Number(s.net_gex).toExponential(2)} sub={s.dealer_mode} />
          <StatTile label="Pin Strike" value={s.pin_strike} />
          <StatTile label="Basis" value={fmtNum(f.basis)} sub={f.interpretation} />
          <StatTile label="Cost of Carry" value={f.cost_of_carry_pct === null ? null : fmtNum(f.cost_of_carry_pct) + "%"} />
          <StatTile label="Futures LTP" value={fmtNum(f.ltp)} sub={f.source} />
          <StatTile label="Futures OI" value={f.oi} />
          <StatTile label="Rollover" value={f.rollover_pct === null ? null : fmtNum(f.rollover_pct) + "%"} />
          <StatTile label="ATM IV" value={g.iv === null ? null : fmtNum(g.iv) + "%"} sub={`skew ${fmtNum(g.iv_skew)}`} />
          <StatTile label="ATM Delta" value={fmtNum(g.delta, 3)} />
          <StatTile label="ATM Theta" value={fmtNum(g.theta, 3)} />
        </div>

        <div className="rounded-lg border mb-4" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
          <div className="px-3 py-2 text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-bright)" }}>
            Option Chain
            <span className="ml-2 font-normal normal-case" style={{ color: "var(--text-dim)" }}>
              OI in '000s · highlighted = ATM ({data.atm_strike}) · {sourceDetail}
            </span>
          </div>
          {/* Wide table scrolls inside its own container so the page body never
              scrolls horizontally. */}
          <div className="overflow-x-auto" style={{ maxHeight: 420 }}>
            {/* data-testid: the visual harness must be able to scope to THIS
                table. Every top-level tab stays mounted (DD-6), so a global
                'table tbody tr' query also counts SENTINEL's and PAPER's rows
                and silently measures the wrong thing. */}
            <table className="w-full text-[11px]" data-testid="fno-chain">
              <thead className="sticky top-0" style={{ background: "var(--bg-secondary)" }}>
                <tr style={{ color: "var(--text-dim)" }}>
                  {cols.map(c => <th key={c} className="px-2 py-1.5 text-right font-semibold">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {chain.map((row, i) => {
                  const isAtm = row.Strike === data.atm_strike;
                  return (
                    <tr key={i} data-atm={isAtm ? "1" : undefined}
                        style={{ background: isAtm ? tint("--accent-green", 14) : "transparent" }}>
                      {cols.map(c => (
                        <td key={c} className="px-2 py-1 text-right"
                            style={{ color: row[c] === null || row[c] === undefined ? "var(--text-dim)" : "var(--text-mid)" }}>
                          {row[c] === null || row[c] === undefined ? "—" : row[c]}
                        </td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {chain.length === 0 && (
            <div className="px-3 py-4 text-[11px]" style={{ color: "var(--text-dim)" }}>
              No chain data available for {ticker}.
            </div>
          )}
        </div>

        {chartBlocks.map(([name, fig]) => (
          <div key={name} data-testid="fno-chart"
               className="mb-4 rounded-lg border p-2" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[10px] uppercase tracking-wide px-2 pt-1" style={{ color: "var(--text-mid)" }}>
              {CHART_LABELS[name] || name}
            </div>
            <PlotlyChart fig={fig} />
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Decision Trail section (Sprint DD-4) ─────────────────────────────────
// Consumes /api/v1/stock/{ticker}/decision-trail — the "why was this trade
// EXECUTED (or rejected)" answer, assembled server-side from the most recent
// TRADE_ATTEMPT record in agent_journal.jsonl for this ticker. A trade_attempt
// only exists once a ticker reached COMMITTEE (top-10 by net_bias that day) —
// most shortlisted tickers never get one, so a 404 here is normal, not a bug.

const COMPUTE_TAG_STYLE = {
  PYTHON: { label: "🔒 PYTHON", color: "var(--accent-blue)" },
  LLM:    { label: "🧠 LLM",    color: "var(--accent-amber)" },
  MIXED:  { label: "🔒🧠 MIXED", color: "var(--text-mid)" },
};

function ComputeTag({ tag }) {
  const s = COMPUTE_TAG_STYLE[tag] || COMPUTE_TAG_STYLE.PYTHON;
  return (
    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold border shrink-0"
          style={{ color: s.color, borderColor: s.color, background: tint("--accent-blue", 8) }}>
      {s.label}
    </span>
  );
}

// Generic key:value line for the heterogeneous per-check objects inside
// risk.all_checks (capital/portfolio/sector/correlation/liquidity/volatility/
// execution each carry different numeric fields) — rather than hardcode
// seven different renderers, flatten whatever the server actually returned.
function KVLine({ obj, omit }) {
  const skip = new Set(["approved", "reason_code", ...(omit || [])]);
  const entries = Object.entries(obj || {}).filter(([k]) => !skip.has(k));
  if (entries.length === 0) return null;
  return (
    <div className="text-[10px] flex flex-wrap gap-x-3 gap-y-0.5" style={{ color: "var(--text-dim)" }}>
      {entries.map(([k, v]) => (
        <span key={k}>{k}: <span style={{ color: "var(--text-mid)" }}>{
          typeof v === "object" ? JSON.stringify(v) : String(v)
        }</span></span>
      ))}
    </div>
  );
}

function CheckRow({ name, check }) {
  const passed = !!(check && check.approved);
  return (
    <div className="px-2 py-1.5 rounded border" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
      <div className="flex items-center justify-between">
        <span className="text-[10px] font-semibold uppercase" style={{ color: passed ? "var(--text-bright)" : "var(--accent-red)" }}>
          {passed ? "✓" : "✗"} {name}
        </span>
      </div>
      {check && check.reason && (
        <div className="text-[10px] mt-0.5" style={{ color: "var(--accent-red)" }}>{check.reason}</div>
      )}
      <KVLine obj={check} />
    </div>
  );
}

// One card in the vertical chain. Renders greyed "not reached" (with the
// rejection reason, if the caller has one) when `reached` is false — a
// ticker that never got past Committee legitimately has no Risk/Portfolio
// card content, and that's the point of the trail, not a loading failure.
function StageCard({ title, tag, subTags, reached, notReachedReason, isFirst, children }) {
  return (
    <div className="flex flex-col">
      {!isFirst && <div className="w-px h-4 ml-4" style={{ background: "var(--border)" }} />}
      <div className="rounded-lg border p-3"
           style={{
             background: reached ? "var(--bg-secondary)" : "var(--bg-primary)",
             borderColor: "var(--border)",
             opacity: reached ? 1 : 0.55,
           }}>
        <div className="flex items-center gap-2 mb-2">
          <span className="text-[12px] font-bold uppercase tracking-wide" style={{ color: "var(--text-bright)" }}>{title}</span>
          {tag && <ComputeTag tag={tag} />}
          {subTags && subTags.map(t => <ComputeTag key={t} tag={t} />)}
        </div>
        {reached ? children : (
          <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>
            Not reached{notReachedReason ? ` — ${notReachedReason}` : ""}
          </div>
        )}
      </div>
    </div>
  );
}

const OUTCOME_STYLE = {
  EXECUTED: { color: "var(--accent-green)", tintVar: "--accent-green" },
  REJECTED: { color: "var(--accent-red)",   tintVar: "--accent-red" },
};

function DecisionTrailSection({ ticker }) {
  const { data, error, loading, reload } = useOneShotFetch(
    ticker ? `${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/decision-trail` : null
  );

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Loading decision trail…</div>;
  if (error) {
    const is404 = error.includes("404");
    return (
      <div className="p-4 text-[11px]" style={{ color: is404 ? "var(--text-dim)" : "var(--accent-red)" }}>
        {is404
          ? `No trade attempt on record for ${ticker} — it either wasn't in the top-10 evaluated by Committee that day, or hasn't been evaluated yet.`
          : `Could not load decision trail: ${error}`}
        <button onClick={reload} className="ml-2 underline" style={{ color: "var(--accent-blue)" }}>retry</button>
      </div>
    );
  }
  if (!data) return null;

  const s = data.stages;
  const r = data.reached;
  const sentinel  = s.sentinel  || {};
  const research  = s.research  || {};
  const committee = s.committee || {};
  const bull      = committee.bull      || {};
  const bear      = committee.bear      || {};
  const moderator = committee.moderator || {};
  const risk      = s.risk      || {};
  const portfolio = s.portfolio || {};
  const execution = s.execution || {};
  const cv        = research.category_verdicts || {};
  const setup     = s.setup      || {};
  const posture   = s.posture    || {};
  const sim       = s.simulation || {};
  const levels    = s.levels     || {};
  const result    = data.result  || {};
  const ruleBased = data.decision_source === "INTRADAY_ALPHA";
  const outcome   = data.outcome || {};
  const oStyle    = OUTCOME_STYLE[outcome.status] || { color: "var(--text-mid)", tintVar: "--border" };

  return (
    <div className="p-4 flex flex-col gap-0">
      <div className="flex items-center gap-2 mb-3">
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          trade_attempt_id {data.trade_attempt_id} — {data.timestamp || "no timestamp"}
        </span>
        <button onClick={reload} className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      {/* WHY THIS STOCK. Two different answers depending on which engine
          chose it — a rule-based setup, or the daily confluence score. Only
          the applicable one renders; showing an empty version of the other
          would imply it was consulted and had nothing to say. */}
      {ruleBased ? (
        <StageCard title="1. Setup — why this stock" tag="PYTHON" reached={r.setup} isFirst
                   notReachedReason={r.setup ? null : "no setup record captured"}>
          <div className="grid grid-cols-4 gap-3 mb-2">
            <Stat label="SETUP" value={setup.name} />
            <Stat label="DIRECTION" value={setup.direction}
                  color={setup.direction === "LONG" ? "var(--accent-green)" : "var(--accent-red)"} />
            <Stat label="RVOL" value={setup.rvol != null ? fmtNum(setup.rvol) : "n/a"} />
            <Stat label="STOP BASIS" value={setup.stop_basis} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Stat label="DAILY ATR" value={fmtNum(setup.daily_atr)} />
            <Stat label="TARGET / ATR" value={setup.atr_multiple != null ? fmtNum(setup.atr_multiple, 3) : "—"} />
          </div>
          <div className="text-[10px] mt-2" style={{ color: "var(--text-dim)" }}>
            Rule-based entry: price crossed a structural level this bar. No committee
            debate — this lane runs on a 5-minute cadence an LLM cannot fit inside.
          </div>
        </StageCard>
      ) : (
        <StageCard title="1. Sentinel — why this stock" tag={data.stage_tags.sentinel} reached={r.sentinel} isFirst>
          <div className="grid grid-cols-4 gap-3">
            <Stat label="NET BIAS" value={sentinel.net_bias} color={sentinel.net_bias >= 0 ? "var(--accent-green)" : "var(--accent-red)"} />
            <Stat label="TIER" value={sentinel.tier} />
            <Stat label="ELIGIBLE CONDITIONS" value={sentinel.eligible_conditions} />
            <Stat label="SIGNAL SCORE" value={sentinel.signal_score} />
          </div>
          {(sentinel.long_score != null || sentinel.short_score != null) && (
            <div className="grid grid-cols-3 gap-3 mt-2">
              <Stat label="LONG CONDITIONS" value={sentinel.long_score} color="var(--accent-green)" />
              <Stat label="SHORT CONDITIONS" value={sentinel.short_score} color="var(--accent-red)" />
              <Stat label="DOMINANT" value={sentinel.dominant_direction} />
            </div>
          )}
        </StageCard>
      )}

      {/* The day-level LLM read. On the intraday lane this is the ONLY LLM
          judgement, and it gates direction for every candidate in the pass. */}
      {ruleBased && (
        <StageCard title="2. Market posture — the LLM read" tag="LLM" reached={r.posture}
                   notReachedReason={r.posture ? null : "no posture recorded — the lane authorises nothing without one"}>
          <div className="grid grid-cols-4 gap-3 mb-2">
            <Stat label="DAY TYPE" value={posture.day_type} />
            <Stat label="PERMITTED" value={posture.permitted_direction}
                  color={posture.permitted_direction === "NONE" ? "var(--accent-red)" : "var(--accent-green)"} />
            <Stat label="PROBABILITY" value={posture.probability != null ? posture.probability + "%" : "not stated"} />
            <Stat label="VALID UNTIL" value={(posture.valid_until || "—").toString().slice(11, 19)} />
          </div>
          {posture.reasoning && (
            <div className="text-[11px] italic" style={{ color: "var(--text-mid)" }}>"{posture.reasoning}"</div>
          )}
          <div className="text-[10px] mt-1.5" style={{ color: "var(--text-dim)" }}>
            Day-level, not per-stock: every trade in this session shares this probability.
            A per-stock number would imply knowledge the model does not have.
          </div>
        </StageCard>
      )}

      <StageCard title="2. Research" tag={data.stage_tags.research} reached={r.research}
                 notReachedReason={r.research ? null : "no research record captured for this trade attempt"}>
        <div className="grid grid-cols-3 gap-3 mb-2">
          <Stat label="OVERALL SIGNAL" value={research.overall_signal} />
          <Stat label="EVENT RISK" value={research.event_risk} />
          <Stat label="CONFLICTS" value={research.conflict_count} />
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-1.5 mb-2">
          {Object.entries(cv).map(([k, v]) => (
            <div key={k} className="px-2 py-1 rounded border text-[10px]" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
              <span style={{ color: "var(--text-dim)" }}>{k}: </span>
              <span style={{ color: "var(--text-bright)" }}>{v}</span>
            </div>
          ))}
        </div>
        <div className="text-[11px] italic" style={{ color: "var(--text-mid)" }}>
          "{research.llm_analyst_verdict}" <span style={{ color: "var(--text-dim)" }}>
            ({research.llm_setup_type}, confidence {research.llm_confidence}, via {research.llm_provider_used})
          </span>
        </div>
      </StageCard>

      <StageCard title="3. Committee" tag={null} subTags={["LLM", "PYTHON"]} reached={r.committee}>
        <div className="grid grid-cols-2 gap-3 mb-2">
          <div className="p-2 rounded border" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
            <Stat label="BULL CONFIDENCE" value={bull.confidence != null ? bull.confidence + "%" : "—"} color="var(--accent-green)" />
            <div className="text-[10px] mt-1" style={{ color: "var(--text-mid)" }}>{bull.thesis_summary || "—"}</div>
          </div>
          <div className="p-2 rounded border" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
            <Stat label="BEAR CONFIDENCE" value={bear.confidence != null ? bear.confidence + "%" : "—"} color="var(--accent-red)" />
            <div className="text-[10px] mt-1" style={{ color: "var(--text-mid)" }}>{bear.thesis_summary || "—"}</div>
          </div>
        </div>
        <div className="p-2 rounded border" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
          <div className="text-[9px] uppercase tracking-wide mb-1" style={{ color: "var(--text-dim)" }}>Moderator — EV calculation (Python, hard-overrides LLM)</div>
          <div className="grid grid-cols-4 gap-3">
            <Stat label="WIN PROB" value={moderator.probability_of_success != null ? moderator.probability_of_success + "%" : "—"} />
            <Stat label="WIN R / LOSS R" value={`${fmtNum(moderator.expected_win_r)} / ${fmtNum(moderator.expected_loss_r)}`} />
            <Stat label="EV" value={fmtNum(moderator.ev, 2)} color={moderator.ev >= 0 ? "var(--accent-green)" : "var(--accent-red)"} />
            <Stat label="VERDICT" value={moderator.recommendation}
                  color={moderator.recommendation === "PROCEED" ? "var(--accent-green)" : "var(--text-mid)"} />
          </div>
          {moderator.reason_detail && (
            <div className="text-[10px] mt-1.5" style={{ color: "var(--text-dim)" }}>{moderator.reason_detail}</div>
          )}
        </div>
      </StageCard>

      {/* MONTE CARLO — the independent base rate on this exact geometry.
          Sampled from the stock's own history with NO edge assumed, so it
          answers "what does this setup earn on timing alone" — the number the
          asserted probability has to beat. */}
      <StageCard title={ruleBased ? "3. Monte Carlo simulation" : "4. Monte Carlo simulation"}
                 tag="PYTHON" reached={r.simulation}
                 notReachedReason={r.simulation ? null : "no simulation recorded for this attempt"}>
        {sim.sim_available === false ? (
          <div className="text-[11px]" style={{ color: "var(--accent-amber)" }}>
            Simulation unavailable — {sim.sim_reason || "reason not recorded"}.
            The trade was NOT refused on this basis; a simulation that cannot run is not a veto.
          </div>
        ) : (
          <>
            <div className="grid grid-cols-4 gap-3 mb-2">
              <Stat label="P(TARGET FIRST)" value={sim.sim_p_target != null ? (sim.sim_p_target * 100).toFixed(1) + "%" : "—"}
                    color="var(--accent-green)" />
              <Stat label="P(STOP FIRST)" value={sim.sim_p_stop != null ? (sim.sim_p_stop * 100).toFixed(1) + "%" : "—"}
                    color="var(--accent-red)" />
              <Stat label="P(NEITHER)" value={sim.sim_p_timeout != null ? (sim.sim_p_timeout * 100).toFixed(1) + "%" : "—"} />
              <Stat label="BREAK-EVEN P" value={sim.sim_breakeven_p != null ? (sim.sim_breakeven_p * 100).toFixed(1) + "%" : "—"} />
            </div>
            <div className="grid grid-cols-4 gap-3 mb-2">
              <Stat label="SIM EV (no edge)" value={fmtNum(sim.sim_ev, 3)}
                    color={sim.sim_ev >= 0 ? "var(--accent-green)" : "var(--accent-red)"} />
              <Stat label="EDGE REQUIRED" value={sim.sim_required_edge_pp != null ? "+" + fmtNum(sim.sim_required_edge_pp, 1) + "pp" : "—"}
                    color="var(--accent-amber)" />
              <Stat label="MODEL RISK" value={sim.sim_model_risk}
                    color={sim.sim_model_risk === "HIGH" ? "var(--accent-amber)" : "var(--text-bright)"} />
              <Stat label="VERDICT" value={sim.sim_verdict}
                    color={sim.sim_verdict === "OK" ? "var(--accent-green)" : "var(--accent-red)"} />
            </div>
            <div className="text-[10px] p-2 rounded border"
                 style={{ background: tint("--accent-amber", 7), borderColor: tint("--accent-amber", 30), color: "var(--text-mid)" }}>
              <b>How to read this:</b> these are NO-EDGE base rates — what this geometry
              earns if entry timing carries no information at all. A negative EV here does
              not mean "bad trade"; it means the setup must supply at least
              {sim.sim_required_edge_pp != null ? " +" + fmtNum(sim.sim_required_edge_pp, 1) + "pp " : " the stated edge "}
              of real skill above chance to break even. That is the claim to judge later.
              {sim.sim_disagreement_pp != null && (
                <> Methods disagree by {fmtNum(sim.sim_disagreement_pp, 1)}pp
                (drift sensitivity {fmtNum(sim.sim_drift_sensitivity_pp, 2)}pp) — the higher these are,
                the more the answer depends on modelling assumptions rather than the data.</>
              )}
            </div>
          </>
        )}
      </StageCard>

      {/* THE STRATEGY — the levels the trade actually lives or dies by. */}
      {(levels.entry != null || result.sl != null) && (
        <StageCard title={ruleBased ? "4. Strategy — levels traded" : "5. Strategy — levels traded"}
                   tag="PYTHON" reached={true}>
          <div className="grid grid-cols-4 gap-3 mb-2">
            <Stat label="ENTRY" value={fmtNum(levels.entry != null ? levels.entry : result.entry_effective)} />
            <Stat label="STOP" value={fmtNum(levels.stop != null ? levels.stop : result.sl)} color="var(--accent-red)" />
            <Stat label="TARGET" value={fmtNum(levels.target != null ? levels.target : result.target)} color="var(--accent-green)" />
            <Stat label="R:R" value={levels.rr != null ? fmtNum(levels.rr, 2)
              : (levels.reward_per_unit && levels.risk_per_unit
                 ? fmtNum(levels.reward_per_unit / levels.risk_per_unit, 2) : "—")} />
          </div>
          <div className="grid grid-cols-3 gap-3">
            <Stat label="RISK / UNIT" value={fmtNum(levels.risk_per_unit)} />
            <Stat label="REWARD / UNIT" value={fmtNum(levels.reward_per_unit)} />
            <Stat label="ATR" value={fmtNum(levels.atr != null ? levels.atr : setup.daily_atr)} />
          </div>
        </StageCard>
      )}

      <StageCard title="6. Risk" tag={data.stage_tags.risk} reached={r.risk}
                 notReachedReason={r.risk ? null : (moderator.reason_code || "Committee did not recommend PROCEED")}>
        <div className="grid grid-cols-2 gap-3 mb-2">
          <Stat label="APPROVED" value={risk.approved ? "YES" : "NO"} color={risk.approved ? "var(--accent-green)" : "var(--accent-red)"} />
          <Stat label="FINAL POSITION SIZE" value={risk.position_size ?? "—"} />
        </div>
        {risk.sizing && (
          <div className="text-[10px] mb-2 px-2 py-1 rounded border"
               style={{ background: "var(--bg-primary)", borderColor: "var(--border)", color: "var(--text-mid)" }}>
            Sizing: {risk.sizing.risk_guardian_size} (RiskGuardian)
            {" × "}{risk.sizing.event_risk_multiplier} (event risk)
            {" × "}{risk.sizing.reduce_size_multiplier} (reduce-size)
            {" = "}<span style={{ color: "var(--text-bright)" }}>{risk.sizing.final_size}</span>
          </div>
        )}
        {risk.all_checks && (
          <div className="grid grid-cols-2 md:grid-cols-3 gap-1.5">
            {Object.entries(risk.all_checks).map(([name, check]) => <CheckRow key={name} name={name} check={check} />)}
          </div>
        )}
        {!risk.all_checks && risk.reason_detail && (
          <div className="text-[10px]" style={{ color: "var(--accent-red)" }}>{risk.reason_detail}</div>
        )}
      </StageCard>

      <StageCard title="7. Portfolio" tag={data.stage_tags.portfolio} reached={r.portfolio}
                 notReachedReason={r.portfolio ? null : (moderator.reason_code || "Committee did not recommend PROCEED")}>
        <div className="grid grid-cols-4 gap-3 mb-2">
          <Stat label="APPROVED" value={portfolio.approved ? "YES" : "NO"} color={portfolio.approved ? "var(--accent-green)" : "var(--accent-red)"} />
          <Stat label="DIVERSIFICATION" value={portfolio.diversification_score} />
          <Stat label="SECTOR %" value={portfolio.sector_pct != null ? portfolio.sector_pct + "%" : "—"} />
          <Stat label="HEAT %" value={portfolio.heat_pct != null ? portfolio.heat_pct + "%" : "—"} />
        </div>
        {portfolio.direction_balance && (
          <div className="text-[10px] mb-1" style={{ color: "var(--text-mid)" }}>
            Direction balance: {portfolio.direction_balance.long_count} LONG ({portfolio.direction_balance.long_pct}%) /
            {" "}{portfolio.direction_balance.short_count} SHORT ({portfolio.direction_balance.short_pct}%)
          </div>
        )}
        {portfolio.correlations && Object.keys(portfolio.correlations).length > 0 && (
          <div className="text-[10px] mb-1" style={{ color: "var(--text-mid)" }}>
            Correlations: {Object.entries(portfolio.correlations).map(([k, v]) => `${k}=${v}`).join(", ")}
          </div>
        )}
        {portfolio.capital_efficiency_note && (
          <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>{portfolio.capital_efficiency_note}</div>
        )}
        {!portfolio.approved && portfolio.reason_detail && (
          <div className="text-[10px] mt-1" style={{ color: "var(--accent-red)" }}>{portfolio.reason_detail}</div>
        )}
      </StageCard>

      <StageCard title="8. Execution" tag={data.stage_tags.execution} reached>
        {execution.filled ? (
          <div className="grid grid-cols-3 gap-3">
            <Stat label="ENTRY (EFFECTIVE)" value={"₹" + fmtNum(execution.entry_effective)} color="var(--accent-green)" />
            <Stat label="SLIPPAGE" value={"₹" + fmtNum(execution.slippage)} />
            <Stat label="INSTRUMENT" value={execution.instrument_type} />
          </div>
        ) : (
          <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>{execution.reason_detail}</div>
        )}
      </StageCard>

      {/* WHAT ACTUALLY HAPPENED — the half that makes this a review rather
          than a record. The trail used to stop at the fill, so "was this
          decision right?" had no answer anywhere in the product. */}
      {result.status && (
        <StageCard title="Result — what actually happened" tag="PYTHON" reached={true}>
          <div className="grid grid-cols-4 gap-3 mb-2">
            <Stat label="STATUS" value={result.status}
                  color={result.status === "OPEN" ? "var(--accent-blue)" : "var(--text-bright)"} />
            <Stat label="EXIT PRICE" value={result.close_price != null ? fmtNum(result.close_price) : "still open"} />
            <Stat label="P&L" value={result.pnl_inr != null ? "₹" + fmtNum(result.pnl_inr)
                    : (result.pnl_unresolved ? "unresolved" : "—")}
                  color={pnlColor(result.pnl_inr)} />
            <Stat label="P&L %" value={result.pnl_pct != null ? fmtNum(result.pnl_pct, 2) + "%" : "—"}
                  color={pnlColor(result.pnl_pct)} />
          </div>
          <div className="grid grid-cols-3 gap-3 mb-2">
            <Stat label="CLASS" value={result.trade_class} />
            <Stat label="SELECTION" value={result.selection_mode} />
            <Stat label="DAYS HELD" value={result.days_held} />
          </div>
          {result.close_reason && (
            <div className="text-[11px]" style={{ color: "var(--text-mid)" }}>
              <span style={{ color: "var(--text-dim)" }}>Exit reason: </span>{result.close_reason}
            </div>
          )}
          {/* An unresolved P&L is STATED, never rendered as zero — a missing
              number and a break-even trade are opposite claims. */}
          {result.pnl_unresolved && (
            <div className="text-[10px] mt-1.5 px-2 py-1 rounded"
                 style={{ background: tint("--accent-amber", 10), color: "var(--accent-amber)" }}>
              P&L withheld — {result.pnl_unresolved}. The exit is real; the number is not
              known, and is excluded from performance rather than counted as zero.
            </div>
          )}
          {result.selection_mode === "EXPLORATION" && (
            <div className="text-[10px] mt-1.5" style={{ color: "var(--accent-orange)" }}>
              EXPLORATION: the EV gate rejected this trade and the quota engine forced it
              to map the boundary. Excluded from calibration by design — judge it separately
              from policy trades.
            </div>
          )}
        </StageCard>
      )}

      <div className="mt-4 px-3 py-2.5 rounded-lg border text-[12px] font-semibold text-center"
           style={{ background: tint(oStyle.tintVar, 12), borderColor: oStyle.color, color: oStyle.color }}>
        {outcome.label}
      </div>
    </div>
  );
}

function LiveTickerBar({ ticker }) {
  const { data, consecutiveFailures } = usePolling(
    ticker ? `${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/live` : null, 2000
  );
  if (!data) return <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>—</div>;
  const chg = data.change_pct;
  const chgColor = chg == null ? "var(--text-dim)" : chg >= 0 ? "var(--accent-green)" : "var(--accent-red)";
  return (
    <div className="flex items-center gap-3 flex-wrap">
      <span className="text-[18px] font-bold" style={{ color: "var(--text-bright)" }}>₹{fmtNum(data.ltp)}</span>
      {chg != null && (
        <span className="text-[12px] font-semibold" style={{ color: chgColor }}>
          {chg >= 0 ? "+" : ""}{fmtNum(data.change)} ({chg >= 0 ? "+" : ""}{fmtNum(chg, 2)}%)
        </span>
      )}
      <SourceBadge source={data.is_live ? "LIVE" : "CACHED"} />
      {data.depth && (
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          Bid {fmtNum(data.depth.bid)} / Ask {fmtNum(data.depth.ask)}
        </span>
      )}
      {data.india_vix != null && (
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>VIX {fmtNum(data.india_vix)}</span>
      )}
      {consecutiveFailures >= 3 && (
        <span className="text-[10px]" style={{ color: "var(--accent-red)" }}>stale — {consecutiveFailures} failed polls</span>
      )}
    </div>
  );
}

// ── Stock workspace (DD-6 §1) ─────────────────────────────────────────────
// THE single-ticker view. Both the drill-down modal and the WORKSPACE tab
// render this exact component — DD-6 §1 is explicit that the modal "becomes a
// thin wrapper around the workspace, not a parallel implementation", so there
// is one definition of the sub-tab bar and one call site per section. DD-7..

// ── Kronos forecast (EA-5) ────────────────────────────────────────────────
// A DISTRIBUTION, badged MODEL, carrying weight 0.00.
//
// Three things this panel refuses to do, each a safety control rather than a
// styling choice — the DD-13b precedent, where model commentary renders behind
// an amber rule labelled "NOT A COMPUTED VALUE":
//
//   1. It never draws a single forecast LINE. The p10-p90 band is the honest
//      object; a line is a point estimate dressed as knowledge, which is
//      exactly what made "Moirai Target Rs 0.00" dishonest for months.
//   2. It never fires on tab open. One forecast is ~34 s of CPU, so it is a
//      button, like DD-13b's AI Analysis and DD-14's news brief.
//   3. It never hides the era caveat. Kronos was pre-trained on a K-line
//      corpus with no published cutoff, so backtest accuracy before ~mid-2025
//      may be in-sample and is labelled as such wherever it appears.
function KronosSection({ ticker }) {
  const [job, setJob] = useState(null);
  const [res, setRes] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [cached, setCached] = useState(false);
  const status = useOneShotFetch(`${API_BASE}/api/v1/forecast/kronos/status`);
  const bt = useOneShotFetch(`${API_BASE}/api/v1/forecast/kronos/backtest/report`);
  const timer = useRef(null);

  useEffect(() => () => { if (timer.current) clearInterval(timer.current); }, []);
  useEffect(() => { setRes(null); setErr(null); setJob(null); setCached(false); }, [ticker]);

  const run = () => {
    setBusy(true); setErr(null); setRes(null);
    fetch(`${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/forecast/kronos`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ horizon: 10, samples: 20, context: 512 }),
    })
      .then(r => r.json())
      .then(j => {
        if (j.status === "done" && j.result) {   // day cache
          setRes(j.result); setCached(!!j.cached); setBusy(false); return;
        }
        setJob(j.job_id);
        timer.current = setInterval(() => {
          fetch(`${API_BASE}/api/v1/forecast/kronos/${j.job_id}`)
            .then(r => r.json())
            .then(p => {
              if (p.status === "done") {
                clearInterval(timer.current); setRes(p.result); setBusy(false);
              } else if (p.status === "error") {
                clearInterval(timer.current); setErr(p.error); setBusy(false);
              }
            })
            .catch(e => { clearInterval(timer.current); setErr(String(e)); setBusy(false); });
        }, 3000);
      })
      .catch(e => { setErr(String(e)); setBusy(false); });
  };

  const Row = ({ label, value, note }) => (
    <div className="flex justify-between items-baseline text-[11px] py-1 border-b"
         style={{ borderColor: tint("--border", 60) }}>
      <span style={{ color: "var(--text-dim)" }}>{label}</span>
      <span className="text-right">
        <span style={{ color: value == null ? "var(--text-dim)" : "var(--text-bright)" }}>
          {value == null ? "n/a" : value}
        </span>
        {note && <span className="ml-2 text-[9px]" style={{ color: "var(--text-dim)" }}>{note}</span>}
      </span>
    </div>
  );

  const st = status.data || {};
  const band = res && res.kronos_band;
  const hist = res && res.kronos_history;

  // The band, drawn as a band. No line, deliberately.
  const chart = (() => {
    if (!band || !hist) return null;
    const all = hist.close.concat(band.q10, band.q90);
    const lo = Math.min(...all), hi = Math.max(...all), span = (hi - lo) || 1;
    const W = 640, H = 200, nH = hist.close.length, nF = band.q50.length;
    const total = nH + nF;
    const x = i => (i / (total - 1)) * W;
    const y = v => H - ((v - lo) / span) * H;
    const histPath = hist.close.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join("");
    const j0 = nH - 1;
    const up = band.q90.map((v, i) => `${i ? "L" : "M"}${x(j0 + 1 + i)},${y(v)}`).join("");
    const dn = band.q10.map((v, i) => `L${x(j0 + nF - i)},${y(band.q10[nF - 1 - i])}`).join("");
    return (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 200 }}
           data-testid="kronos-band">
        <path d={`${up} ${dn} Z`} fill="var(--accent-amber, #ffb74d)" opacity="0.18" />
        <path d={band.q50.map((v, i) => `${i ? "L" : "M"}${x(j0 + 1 + i)},${y(v)}`).join("")}
              stroke="var(--accent-amber, #ffb74d)" strokeWidth="1" fill="none"
              strokeDasharray="3 3" opacity="0.75" />
        <path d={histPath} stroke="var(--text-bright)" strokeWidth="1.4" fill="none" />
        <line x1={x(j0)} y1="0" x2={x(j0)} y2={H} stroke="var(--border)" strokeDasharray="2 2" />
      </svg>
    );
  })();

  const era = bt.data && bt.data.eras && bt.data.eras.OUT_ERA;

  return (
    <div className="px-4 py-3 space-y-3" data-testid="kronos">
      {/* The badge is the first thing on the panel, on purpose. */}
      <div className="rounded-lg border p-3"
           style={{ borderColor: "var(--accent-amber, #ffb74d)",
                    background: tint("--accent-amber", 8) }}>
        <div className="text-[10px] font-bold uppercase tracking-wider"
             style={{ color: "var(--accent-amber, #ffb74d)" }}>
          MODEL FORECAST — NOT A COMPUTED VALUE — WEIGHT 0.00
        </div>
        <div className="text-[11px] mt-1" style={{ color: "var(--text-mid)" }}>
          Kronos is a pre-trained candlestick model running in <b>shadow mode</b>.
          It moves no trade and enters no indicator. Everything below is a
          distribution over possible futures, not a prediction of one.
        </div>
        {st.caveat && (
          <div className="text-[10px] mt-2" style={{ color: "var(--text-dim)" }}>
            ⚠ {st.caveat}
          </div>
        )}
      </div>

      {!st.available && status.data && (
        <div className="text-[11px]" style={{ color: "var(--accent-red)" }}>
          Model not available: {st.reason}
        </div>
      )}

      <div className="flex items-center gap-3">
        <button onClick={run} disabled={busy || !st.available}
                className="text-[10px] font-semibold uppercase tracking-wider px-3 py-1 rounded border"
                style={{ borderColor: "var(--accent-amber, #ffb74d)",
                         color: "var(--accent-amber, #ffb74d)",
                         opacity: (busy || !st.available) ? 0.5 : 1 }}>
          {busy ? "Sampling 20 futures…" : "Run forecast"}
        </button>
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          ~34 s on CPU · user-triggered · cached per trading day
        </span>
        {cached && (
          <span className="text-[9px] px-1.5 py-0.5 rounded border"
                style={{ borderColor: "var(--border)", color: "var(--text-dim)" }}>
            served from today&apos;s cache
          </span>
        )}
      </div>

      {err && <div className="text-[11px]" style={{ color: "var(--accent-red)" }}>{err}</div>}

      {res && res.kronos_available === false && (
        <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>
          No forecast: {res.kronos_reason}
        </div>
      )}

      {res && res.kronos_available && (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
          <div className="rounded-lg border p-3"
               style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
                 style={{ color: "var(--text-bright)" }}>
              Distribution over {res.kronos_horizon} sessions
            </div>
            {chart}
            <div className="text-[9px] mt-1" style={{ color: "var(--text-dim)" }}>
              Solid = real closes. Shaded = p10–p90 across {res.kronos_n_samples} sampled
              futures. The dashed median is the middle of that band, <b>not</b> a target.
            </div>
          </div>

          <div className="rounded-lg border p-3"
               style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
                 style={{ color: "var(--text-bright)" }}>
              What the paths say
            </div>
            <Row label="Last real close" value={fmtNum(res.kronos_last_close)} />
            <Row label="P(up) at horizon"
                 value={res.kronos_p_up == null ? null : `${(res.kronos_p_up * 100).toFixed(0)}%`}
                 note={`${res.kronos_n_samples} paths`} />
            <Row label="p10 / p50 / p90"
                 value={band ? `${fmtNum(res.kronos_q10)} / ${fmtNum(res.kronos_q50)} / ${fmtNum(res.kronos_q90)}` : null} />
            <Row label="Dispersion (p90−p10)"
                 value={res.kronos_dispersion_pct == null ? null
                        : `${res.kronos_dispersion_pct.toFixed(2)}%`}
                 note="wide = low confidence" />
            <Row label="Median excursion up / down"
                 value={res.kronos_mfe_pct == null ? null
                        : `+${res.kronos_mfe_pct.toFixed(2)}% / ${res.kronos_mae_pct.toFixed(2)}%`}
                 note="sanity only, never a level" />
            <Row label="Seed" value={res.kronos_seed} note="same day → same answer" />
            <Row label="Model" value={res.kronos_model_id} />
          </div>
        </div>
      )}

      {/* The evidence, or the honest absence of it. */}
      <div className="rounded-lg border p-3"
           style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
        <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
             style={{ color: "var(--text-bright)" }}>
          Has it earned any weight? — pre-registered backtest
        </div>
        {!bt.data || bt.data.available === false ? (
          <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>
            {(bt.data && bt.data.reason) || "loading…"}
          </div>
        ) : !era || !era.available ? (
          <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>
            Post-cutoff sample too small to decide: {era && era.reason}
          </div>
        ) : (
          <div>
            <div className="text-[10px] mb-2" style={{ color: "var(--text-dim)" }}>
              Scored on <b>{era.n}</b> out-of-sample origins (after {bt.data.cutoff}).
              Pre-cutoff results are excluded because they may be in the model&apos;s
              training corpus.
            </div>
            {[["1 Direction", era.direction.PASS,
               `${(era.direction.kronos_hit_rate * 100).toFixed(1)}% vs drift ${(era.direction.drift_hit_rate * 100).toFixed(1)}% (${era.direction.edge_pp >= 0 ? "+" : ""}${era.direction.edge_pp}pp)`],
              ["2 Magnitude", era.magnitude.PASS,
               `MASE ${era.magnitude.mase_vs_persistence} vs persistence`],
              ["3 Calibration", era.calibration.PASS,
               `80% band covers ${(era.calibration.coverage_80_band * 100).toFixed(1)}% — ${era.calibration.reading}`],
              ["4 Decision", era.decision.PASS,
               `Brier ${era.decision.kronos_brier} vs bootstrap ${era.decision.bootstrap_brier}`],
             ].map(([label, pass, detail]) => (
              <div key={label} className="flex justify-between items-baseline text-[11px] py-1 border-b"
                   style={{ borderColor: tint("--border", 60) }}>
                <span style={{ color: "var(--text-dim)" }}>{label}</span>
                <span className="text-right">
                  <span style={{ color: "var(--text-mid)" }}>{detail}</span>
                  <span className="ml-2 font-bold"
                        style={{ color: pass ? "var(--accent-green)" : "var(--accent-red)" }}>
                    {pass ? "PASS" : "FAIL"}
                  </span>
                </span>
              </div>
            ))}
            {bt.data.contamination_estimate && (
              <div className="text-[10px] mt-2" style={{ color: "var(--text-dim)" }}>
                Contamination estimate (in-era minus out-of-era):
                <b> {bt.data.contamination_estimate.direction_pp >= 0 ? "+" : ""}
                {bt.data.contamination_estimate.direction_pp}pp</b> on direction.
                A model with real skill scores similarly in both eras.
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// Candles + the forecast band. Hand-rolled SVG, matching the existing Kronos
// panel rather than introducing a second charting path on this page.
//
// 🔴 The BAND is the object. p50 renders as a thin dashed line INSIDE it and
//    is labelled as one percentile among five — never as "the forecast". A
//    lone confident line is what made "Moirai Target ₹0.00" dishonest for
//    months, and the fix was to stop drawing one.
function ExplorerChart({ history, band, label, candles, candlesNote }) {
  if (!history || !history.length || !band || !band.length) return null;
  const H = 260, W = 900, PAD = 6;
  // History window scales with the horizon so the BAND is legible. A fixed
  // 90-bar tail squeezed a 7-step forecast into ~7% of the chart width, which
  // makes the one object this tab exists to show the hardest thing to see.
  // ~4x the horizon keeps the band around a fifth of the canvas at both T+7
  // and T+15, with enough real context to read the trend into it.
  const hs = history.slice(-Math.max(36, band.length * 4));
  const nH = hs.length, nF = band.length, total = nH + nF;

  const vals = [];
  hs.forEach(c => { if (c.h != null) vals.push(c.h); if (c.l != null) vals.push(c.l); });
  band.forEach(b => { if (b.p90 != null) vals.push(b.p90); if (b.p10 != null) vals.push(b.p10); });
  if (!vals.length) return null;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const x = i => PAD + (i / (total - 1)) * (W - 2 * PAD);
  const y = v => H - PAD - ((v - lo) / span) * (H - 2 * PAD);
  const bw = Math.max(1.2, ((W - 2 * PAD) / total) * 0.6);

  const j0 = nH - 1;
  const poly = (upKey, dnKey) => {
    const up = band.map((b, i) => `${i ? "L" : "M"}${x(j0 + 1 + i)},${y(b[upKey])}`).join("");
    const dn = band.map((_, i) => `L${x(j0 + nF - i)},${y(band[nF - 1 - i][dnKey])}`).join("");
    return `${up} ${dn} Z`;
  };

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full"
           style={{ height: 260 }} data-testid="kx-chart">
        {/* p10-p90 first (widest, faintest), then p25-p75 over it */}
        <path d={poly("p90", "p10")} fill="var(--accent-amber, #ffb74d)" opacity="0.14" />
        <path d={poly("p75", "p25")} fill="var(--accent-amber, #ffb74d)" opacity="0.24" />
        {/* 🔴 SIMULATED candles — the median of N sampled paths per step, drawn
            hatched and semi-transparent BEHIND the p50 line so they read as
            possibilities, never as one predicted future. Real candles below are
            solid and opaque; the visual difference is the honesty control. */}
        <defs>
          <pattern id="kxHatch" width="3" height="3" patternUnits="userSpaceOnUse"
                   patternTransform="rotate(45)">
            <rect width="3" height="3" fill="none" />
            <line x1="0" y1="0" x2="0" y2="3" stroke="var(--accent-amber, #ffb74d)"
                  strokeWidth="1.1" opacity="0.55" />
          </pattern>
        </defs>
        {(candles || []).map((fc, i) => {
          if (fc.o == null || fc.c == null) return null;
          const yo = y(fc.o), yc = y(fc.c), cx = x(j0 + 1 + i);
          return (
            <g key={`fc${i}`} opacity="0.72">
              <line x1={cx} y1={y(fc.h)} x2={cx} y2={y(fc.l)}
                    stroke="var(--accent-amber, #ffb74d)" strokeWidth="0.9"
                    strokeDasharray="2 1.5" opacity="0.85" />
              <rect x={cx - bw / 2} y={Math.min(yo, yc)} width={bw}
                    height={Math.max(Math.abs(yc - yo), 0.8)}
                    fill="url(#kxHatch)" stroke="var(--accent-amber, #ffb74d)"
                    strokeWidth="0.7" strokeDasharray="2 1.5" />
            </g>
          );
        })}
        <path d={band.map((b, i) => `${i ? "L" : "M"}${x(j0 + 1 + i)},${y(b.p50)}`).join("")}
              stroke="var(--accent-amber, #ffb74d)" strokeWidth="1" fill="none"
              strokeDasharray="3 3" opacity="0.8" />
        {/* real candles — solid, opaque, visually the dominant object */}
        {hs.map((c, i) => {
          if (c.o == null || c.c == null) return null;
          const up = c.c >= c.o;
          const col = up ? "var(--accent-green)" : "var(--accent-red)";
          const yo = y(c.o), yc = y(c.c);
          return (
            <g key={i}>
              <line x1={x(i)} y1={y(c.h)} x2={x(i)} y2={y(c.l)}
                    stroke={col} strokeWidth="0.8" opacity="0.9" />
              <rect x={x(i) - bw / 2} y={Math.min(yo, yc)} width={bw}
                    height={Math.max(Math.abs(yc - yo), 0.8)} fill={col} opacity="0.9" />
            </g>
          );
        })}
        <line x1={x(j0)} y1="0" x2={x(j0)} y2={H}
              stroke="var(--border)" strokeDasharray="2 2" />
      </svg>
      <div className="flex flex-wrap items-center gap-4 text-[10px] mt-1"
           style={{ color: "var(--text-dim)" }}>
        <span>◼ real candles (what happened)</span>
        <span style={{ color: "var(--accent-amber, #ffb74d)" }}>
          ▨ Kronos p10–p90 · p25–p75 — {label}
        </span>
        <span>┄ p50 (one percentile of {band.length ? "the sampled paths" : "—"}, not "the forecast")</span>
        {candles && candles.length > 0 && (
          <span style={{ color: "var(--accent-amber, #ffb74d)" }}>
            ▨ hatched = simulated candles ({candlesNote || "median of the sampled paths"})
          </span>
        )}
      </div>
    </div>
  );
}

function MethodTable({ sim }) {
  const pm = (sim && sim.per_method) || {};
  const names = Object.keys(pm);
  if (!names.length) return null;
  const pct = v => (v == null ? "n/a" : (v * 100).toFixed(1) + "%");
  const nice = n => n === "kronos_paths" ? "Kronos (sampled paths)"
    : n === "block_bootstrap" ? "Block bootstrap"
    : n === "garch_t" ? "GARCH(1,1)-t" : n;
  return (
    <table className="w-full text-[11px]" data-testid="kx-methods">
      <thead>
        <tr style={{ color: "var(--text-dim)" }}>
          <th className="text-left font-normal py-1">method</th>
          <th className="text-right font-normal">P(target)</th>
          <th className="text-right font-normal">P(stop)</th>
          <th className="text-right font-normal">P(neither)</th>
          <th className="text-right font-normal">EV</th>
          <th className="text-right font-normal">paths</th>
          <th className="text-right font-normal">± MC noise</th>
        </tr>
      </thead>
      <tbody>
        {names.map(n => {
          const m = pm[n];
          const isK = n === "kronos_paths";
          return (
            <tr key={n} style={{ color: isK ? "var(--accent-amber, #ffb74d)" : "var(--text-bright)" }}>
              <td className="py-1">{nice(n)}</td>
              <td className="text-right font-mono">{pct(m.p_target)}</td>
              <td className="text-right font-mono">{pct(m.p_stop)}</td>
              <td className="text-right font-mono">{pct(m.p_timeout)}</td>
              <td className="text-right font-mono">{m.ev == null ? "n/a" : m.ev.toFixed(3)}</td>
              <td className="text-right font-mono">{m.paths == null ? "n/a" : m.paths.toLocaleString()}</td>
              {/* 🔴 Shown per method on purpose. Kronos contributes ~30 paths
                  against the bootstrap's 5,000, so its Monte-Carlo error is an
                  order of magnitude larger. Without this column a spread that
                  is pure sampling noise reads as a finding. */}
              <td className="text-right font-mono"
                  style={{ color: m.p_target_se_pp != null && m.p_target_se_pp > 5
                    ? "var(--accent-red)" : "var(--text-dim)" }}>
                {m.p_target_se_pp == null ? "n/a" : "±" + m.p_target_se_pp + "pp"}
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

              <div><div style={{ color: "var(--text-dim)" }}>drift sensitivity</div>
                <div className="font-mono">{sim.drift_sensitivity_pp == null ? "n/a" : sim.drift_sensitivity_pp + "pp"}</div></div>

              required edge {sim.required_edge_pp == null ? "n/a" : sim.required_edge_pp + "pp"}.

function KronosExplorerTab() {
  const [input, setInput] = useState("");
  const [ticker, setTicker] = useState(null);
  const [job, setJob] = useState(null);
  const [res, setRes] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const timer = useRef(null);
  const tick = useRef(null);

  const stop = () => {
    if (timer.current) { clearInterval(timer.current); timer.current = null; }
    if (tick.current) { clearInterval(tick.current); tick.current = null; }
  };
  useEffect(() => () => stop(), []);

  const run = async () => {
    const tk = (input || "").trim().toUpperCase();
    if (!tk || busy) return;
    stop();
    setTicker(tk); setRes(null); setErr(null); setBusy(true); setElapsed(0);
    tick.current = setInterval(() => setElapsed(e => e + 1), 1000);
    try {
      const r = await fetch(`${API_BASE}/api/v1/research/kronos-explorer/${encodeURIComponent(tk)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ horizons: [7, 15], samples: 30, direction: "LONG" }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      setJob(j);
      timer.current = setInterval(async () => {
        try {
          const p = await fetch(`${API_BASE}/api/v1/research/kronos-explorer/job/${j.job_id}`);
          if (!p.ok) throw new Error(`HTTP ${p.status}`);
          const s = await p.json();
          if (s.status === "done") { stop(); setBusy(false); setRes(s.result); }
          else if (s.status === "error") { stop(); setBusy(false); setErr(s.error); }
        } catch (e) { stop(); setBusy(false); setErr(String(e.message || e)); }
      }, 2000);
    } catch (e) {
      stop(); setBusy(false); setErr(String(e.message || e));
    }
  };

  // Attach the shared history to each horizon so the chart is self-contained.
  const horizons = (res && res.horizons || []).map(h => ({ ...h, __history: res.history }));

  return (
    <div className="h-full overflow-auto px-4 py-3 space-y-3" data-testid="kronos-explorer">
      <ExplorerBanner />

      <div className="flex flex-wrap items-center gap-2">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") run(); }}
          placeholder="ticker, e.g. RELIANCE"
          className="px-3 py-1.5 rounded text-[12px] font-mono outline-none border"
          style={{ background: "var(--bg-secondary, #12161c)", borderColor: "var(--border)",
                   color: "var(--text-bright)", minWidth: 220 }}
          data-testid="kx-input"
        />
        <button onClick={run} disabled={busy || !input.trim()}
                className="px-3 py-1.5 rounded text-[11px] font-bold uppercase tracking-wider"
                style={{
                  background: busy ? "var(--border)" : tint("--accent-amber", 22),
                  color: busy ? "var(--text-dim)" : "var(--accent-amber, #ffb74d)",
                  cursor: busy || !input.trim() ? "not-allowed" : "pointer",
                }}
                data-testid="kx-run">
          {busy ? `running… ${elapsed}s` : "Run Kronos"}
        </button>
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          T+7 and T+15, 30 sampled paths each. Minutes on CPU — user-triggered
          only, never on tab open.
        </span>
      </div>

      {err && (
        <div className="text-[11px] p-2 rounded"
             style={{ color: "var(--accent-red)", background: tint("--accent-red", 10) }}>
          Failed: {err}
        </div>
      )}

      {busy && (
        <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>
          {ticker}: fetching bars, then {`${2}`} forecasts… {job && job.note ? `(${job.note})` : ""}
        </div>
      )}

      {res && (
        <>
          <div className="rounded-lg border p-3" style={{ borderColor: "var(--border)" }}>
            <div className="flex flex-wrap items-baseline gap-3">
              <span className="text-[16px] font-bold">{res.ticker}</span>
              <span className="text-[13px] font-mono">₹{res.spot}</span>
              <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
                {res.data && res.data.bars} bars · {res.data && res.data.first_bar} → {res.data && res.data.last_bar}
                {res.elapsed_s ? ` · ${res.elapsed_s}s total` : ""}
              </span>
            </div>
            <div className="mt-2">
              <div className="text-[10px] font-semibold uppercase tracking-wider mb-0.5"
                   style={{ color: "var(--text-dim)" }}>
                data source — ANGEL → BHAVCOPY → YFINANCE
              </div>
              {/* Every tier reports what it did. "Angel skipped" and "Angel
                  failed" are different facts and must not look identical. */}
              {(res.data && res.data.tiers || []).map((t, i) => <TierRow key={i} t={t} />)}
            </div>
            {res.geometry ? (
              <div className="text-[10px] mt-2" style={{ color: "var(--text-dim)" }}>
                geometry (LIVE swing config): entry ₹{res.geometry.entry} · stop ₹{res.geometry.stop} ·
                target ₹{res.geometry.target} · ATR {res.geometry.atr} ·
                {" "}{res.geometry.stop_atr_multiple}×ATR stop, {res.geometry.target_rr}R target
              </div>
            ) : (
              <div className="text-[10px] mt-2" style={{ color: "var(--accent-red)" }}>
                ⚠ {res.geometry_reason}
              </div>
            )}
          </div>

          {horizons.map(h => <HorizonPanel key={h.horizon} h={h} />)}
        </>
      )}

      {!res && !busy && !err && (
        <div className="text-[11px] py-6 text-center" style={{ color: "var(--text-dim)" }}>
          Type a ticker and run. Nothing fires on tab open — one exploration is
          minutes of CPU.
        </div>
      )}
    </div>
  );
}

// ── RESEARCH BOARD (2026-10-02) ───────────────────────────────────────────────
// WS-8.8 specified a top-level MODEL tab; WS-8 was cancelled when WS-4's gate
// failed, which would have taken the DISPLAY of the evidence down with the
// PROMOTION of a model. Repointed at the pre-model evidence instead.
//
// 🔴 RENDER-ONLY. Every number comes from /api/v1/research/board as-is. No
// financial or statistical value is derived here — the file's standing rule, and
// doubly so on a surface whose whole subject is whether a number is trustworthy.
// Compose a bar label ONLY when the threshold exists. `">= " + undefined` is
// the string ">= undefined": non-empty, so it slips past every null check
// downstream and renders as though it were a real threshold.
function barOf(prefix, v) {
  return (v === null || v === undefined || Number.isNaN(v)) ? null : prefix + v;
}

function RBar({ label, value, bar, unit, pass, hint }) {
  const ok = pass === undefined ? null : pass;
  const col = ok === null ? "var(--text-dim)" : ok ? "var(--accent-green)" : "var(--accent-red)";
  return (
    <div className="flex items-baseline gap-2 text-xs">
      <span style={{ color: "var(--text-dim)" }}>{label}</span>
      <span className="font-mono" style={{ color: col }}>
        {value === null || value === undefined ? "n/a" : value}{unit || ""}
      </span>
      {bar !== undefined && bar !== null && (
        <span style={{ color: "var(--text-dim)" }}>/ bar {bar}{unit || ""}</span>
      )}
      {hint && <span style={{ color: "var(--text-dim)" }}>· {hint}</span>}
    </div>
  );
}

// Theme. The dark ink scale stays the default; light is an override applied on
// <html>, so every token below it re-resolves with no component changes.
function useTheme() {
  const read = () => {
    try { return localStorage.getItem("qn-theme") === "light" ? "light" : "dark"; }
    catch (e) { return "dark"; }
  };
  const [theme, setTheme] = useState(read);
  useEffect(() => {
    if (theme === "light") document.documentElement.dataset.theme = "light";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("qn-theme", theme); } catch (e) { /* non-fatal */ }
  }, [theme]);
  return { theme, toggle: () => setTheme(t => (t === "light" ? "dark" : "light")) };
}

function ThemeToggle() {
  const { theme, toggle } = useTheme();
  return (
    <button onClick={toggle} data-testid="theme-toggle"
            title={theme === "light" ? "Switch to the dark theme" : "Switch to the light theme"}
            aria-label={theme === "light" ? "Switch to the dark theme" : "Switch to the light theme"}
            className="px-2 py-[3px] rounded shrink-0"
            style={{ fontSize: "var(--t-micro)", fontWeight: 600,
                     background: "var(--ink-850)", color: "var(--text-mid)",
                     border: "1px solid var(--hair)" }}>
      {theme === "light" ? "Dark" : "Light"}
    </button>
  );
}

function ResearchBoard() {

  if (error) return <div className="p-4 text-xs" style={{ color: "var(--accent-red)" }}>research board unavailable: {String(error)}</div>;
  if (!data) return null;
  const h = data.headline || {}, bars = data.bars || {}, md = data.model_diagnostics || {};
  const gate = h.gate || {}, nc = h.negative_controls || {}, fr = h.friction || {};
  const audit = fr.provenance_audit || {};
  const vcol = v => v === "PASS" ? "var(--accent-green)"
    : v === "FAIL" ? "var(--accent-red)"
    : (v === "CANNOT_RUN" || v === "HARNESS_INVALID") ? "var(--accent-amber)" : "var(--text-dim)";

  // The three programme verdicts, in one line. They were discoverable only by

                      fontSize: "var(--t-small)" }}>
          <b style={{ color: "var(--accent-amber)" }}>RESEARCH ONLY — nothing here is wired to the fill path.</b>{" "}
          <span style={{ color: "var(--text-mid)" }}>{data.execution_note}</span>
        </div>

        <div className="flex items-stretch flex-wrap">
          {verdicts.map(x => (
            <div key={x.k} className="px-3 py-2" data-testid={"verdict-" + x.k.split(" ")[0]}
                 style={{ borderRight: "1px solid var(--hair-soft)", minWidth: "9.5rem" }}>
              <div style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>{x.k}</div>
