             bar={barOf(">= ", bars.planted_control_ic_min)} pass={nc.planted_detected} />
        <RBar label="random factor" value={nc.random_factor && nc.random_factor.ic_mean}
             bar={barOf("|IC| < ", bars.null_control_ic_max)} pass={nc.nulls_behave} />
        <RBar label="labels shuffled within date" value={nc.shuffled_label && nc.shuffled_label.ic_mean}
             bar={barOf("|IC| < ", bars.null_control_ic_max)} pass={nc.nulls_behave} />
        {h.placebo_controls && Object.entries(h.placebo_controls.placebos || {}).map(([k, v]) => (
          <RBar key={k} label={"placebo · " + k.replace("_placebo", "")} value={v.ic_mean}
               bar={barOf("|IC| < ", bars.placebo_ic_max)}
               pass={Math.abs(v.ic_mean) < bars.placebo_ic_max} />
        ))}
        <div className="mt-1 text-xs font-mono" style={{ color: nc.harness_valid ? "var(--accent-green)" : "var(--accent-red)" }}>
          {/* String(undefined) is the word "undefined" — an unreported flag must
              read as unreported, not as a value. */}
          harness_valid = {nc.harness_valid === undefined || nc.harness_valid === null
                            ? "not reported" : String(nc.harness_valid)}
        </div>
      </div>

      {h.barrier && (
        <div className="research-panel">
          <div id="research-barrier" className="panel-name">Barrier space — the units the book trades</div>
          <table className="w-full text-xs font-mono">
            <thead><tr style={{ color: "var(--text-dim)" }}>
              <th className="text-left">family</th><th className="text-right">top-20% hit</th>
              <th className="text-right">vs in-fold null</th><th className="text-right">vs frictionless</th>
              <th className="text-right">n</th>
            </tr></thead>
            <tbody>{Object.entries(h.barrier).map(([f, b]) => (
              <tr key={f}><td>{f}</td>
                <td className="text-right">{b.hit_rate_pct}%</td>
                <td className="text-right" style={{ color: (b.vs_in_fold_baseline_pp || 0) > 0 ? "var(--accent-green)" : "var(--accent-red)" }}>
                  {(b.vs_in_fold_baseline_pp || 0) > 0 ? "+" : ""}{b.vs_in_fold_baseline_pp} pp</td>
                <td className="text-right" style={{ color: "var(--text-dim)" }}>{b.vs_frictionless_breakeven_pp} pp</td>
                <td className="text-right" style={{ color: "var(--text-dim)" }}>{b.top_n_target + b.top_n_stop}</td>
              </tr>))}</tbody>
          </table>
          <div className="mt-2 text-xs" style={{ color: "var(--text-dim)" }}>
            ⚠️ Every family clears the {bars.frictionless_breakeven_pct}% frictionless break-even —
            and so does the equal-weight null ({bars.in_fold_baseline_pct}%). That is a property of a
            strong 7-year period, not an edge. The column that matters is "vs in-fold null".
          </div>
        </div>
      )}

      <div className="research-panel">
        <div className="flex items-center justify-between mb-2">
          <div id="research-friction" className="panel-name">WS-6a · friction estimator</div>
          <div className="text-xs font-mono px-2 py-0.5 rounded"
               style={{ color: vcol((fr.gate || {}).verdict), border: "1px solid " + vcol((fr.gate || {}).verdict) }}>
            {(fr.gate || {}).verdict || "not run"}
          </div>
        </div>
        {audit.inputs && (
          <table className="w-full text-xs font-mono mb-2">
            <thead><tr style={{ color: "var(--text-dim)" }}>
              <th className="text-left">input</th><th className="text-right">producers</th>
              <th className="text-right">readers</th><th className="text-right">read defaults</th>
            </tr></thead>
            <tbody>{Object.entries(audit.inputs).map(([k, v]) => (
              <tr key={k}><td>{k}</td>
                <td className="text-right" style={{ color: v.writes > 0 ? "var(--accent-green)" : "var(--accent-red)" }}>{v.writes}</td>
                <td className="text-right">{v.reads}</td>
                <td className="text-right" style={{ color: "var(--text-dim)" }}>
                  {(v.read_defaults || []).filter((x, i, a) => a.indexOf(x) === i).join(", ") || "—"}</td>
              </tr>))}</tbody>
          </table>
        )}
        {((fr.gate || {}).blockers || []).map((b, i) => (
          <div key={i} className="text-xs" style={{ color: "var(--accent-amber)" }}>· {b}</div>
        ))}
        {fr.ledger && (
          <div className="mt-2 text-xs" style={{ color: "var(--text-dim)" }}>
            ledger {fr.ledger.rows_seen} rows · {fr.ledger.n} usable ·{" "}
            <b style={{ color: fr.ledger.n_with_estimate > 0 ? "var(--accent-green)" : "var(--accent-amber)" }}>
              {fr.ledger.n_with_estimate}</b> carrying a persisted estimate (needs ~100)
          </div>
        )}
        {fr.realised_profile && fr.realised_profile.ok && (
          <div className="text-xs" style={{ color: "var(--text-dim)" }}>
            realised friction median {fr.realised_profile.median}% of entry ·{" "}
            {(100 * fr.realised_profile.share_inside_rng_band).toFixed(1)}% inside the simulated
            draw's own band — ⚠️ the fill is paper, so this is a simulation, not an observation
          </div>
        )}
      </div>

      {/* WS-5 model diagnostics. Render-only: every number is read from
          ws5_diagnostic_report.json. Shows the four PRE-REGISTERED criteria beside what
          was measured, so a cleared criterion can never be mistaken for a cleared gate. */}
      <div className="research-panel">
        <div className="flex items-baseline gap-2 mb-1">
          <div id="research-model" className="panel-name">Model diagnostics</div>
          {md.available
            ? <>
                <span className="text-xs font-mono px-1 rounded" style={{ background: "var(--accent-amber)", color: "#000" }}>{md.status || "DIAGNOSTIC"}</span>
                <span className="text-xs font-mono" style={{ color: md.verdict === "PASS" ? "var(--accent-green)" : "var(--accent-amber)" }}>{md.verdict}</span>
                <span className="text-xs" style={{ color: "var(--text-dim)" }}>promoted {String(md.promoted)}</span>
              </>
            : <span className="text-xs font-mono" style={{ color: "var(--accent-amber)" }}>NOT APPLICABLE</span>}
        </div>

        {!md.available && <>
          <div className="text-xs font-mono mb-1" style={{ color: "var(--text-dim)" }}>{(md.metrics || []).join(" · ")}</div>
          <div className="text-xs" style={{ color: "var(--accent-amber)" }}>{md.reason}</div>
        </>}

        {md.available && <>
          <div className="text-xs font-mono mb-2" style={{ color: "var(--text-dim)" }}>
            BAR (all four required): hit20 &ge; 54.51% · AUC &ge; 0.55 · |rankIC| &ge; 0.02 at NW p &lt; 0.01 · sign stable &ge; 4/5
          </div>
          <table className="w-full text-xs font-mono" style={{ borderCollapse: "collapse" }}>
            <thead><tr style={{ color: "var(--text-dim)" }}>
              <th className="text-left pr-2">model</th><th className="text-right pr-2">hit20%</th>
              <th className="text-right pr-2">AUC</th><th className="text-right pr-2">rankIC</th>
              <th className="text-right pr-2">p_NW</th><th className="text-right pr-2">F1</th>
              <th className="text-right pr-2">R2</th><th className="text-right">AIC/BIC (eff n)</th>
            </tr></thead>
            <tbody>
              {(md.models || []).map(m => {
                const ic = m.rank_ic, icOk = ic != null && Math.abs(ic) >= 0.02 && m.rank_ic_p_nw < 0.01;
                const eff = (m.information_criteria || {}).on_effective_n || {};
                return (
                  <tr key={m.model}>
                    <td className="pr-2">{m.model}</td>
                    <td className="text-right pr-2" style={{ color: "var(--accent-red)" }}>{m.top20_hit_pct != null ? m.top20_hit_pct.toFixed(2) : "—"}</td>
                    <td className="text-right pr-2" style={{ color: "var(--accent-red)" }}>{m.auc_oos != null ? m.auc_oos.toFixed(4) : "—"}</td>
                    <td className="text-right pr-2" style={{ color: icOk ? "var(--accent-green)" : "var(--accent-red)" }}>{ic != null ? (ic >= 0 ? "+" : "") + ic.toFixed(5) : "—"}</td>
                    <td className="text-right pr-2" style={{ color: "var(--text-dim)" }}>{m.rank_ic_p_nw != null ? m.rank_ic_p_nw.toExponential(1) : "—"}</td>
                    <td className="text-right pr-2">{m.f1_oos != null ? m.f1_oos.toFixed(4) : "—"}</td>
                    <td className="text-right pr-2" style={{ color: "var(--text-dim)" }}>{m.r2_oos != null ? m.r2_oos.toFixed(5) : "—"}</td>
                    <td className="text-right" style={{ color: "var(--text-dim)" }}>{eff.aic != null ? Math.round(eff.aic) + " / " + Math.round(eff.bic) : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          {/* THE CRUX, stated on the surface: criterion 3 clears and 1-2 fail because
              they score DIFFERENT labels. rankIC is on the neutralized RELATIVE rank; the
              hit rate is on an absolute-price barrier touch, which cannot be neutralized. */}
          <div className="text-xs mt-2 p-2 rounded" style={{ background: tint("--accent-amber", 0.08), color: "var(--text)" }}>
            <b>Read this before the numbers.</b> rankIC is measured on the market- and
            size-neutral <i>relative</i> rank — the label the model was trained on. hit20%
            and AUC are measured on an <i>absolute-price</i> triple-barrier touch, which
            cannot be neutralized. So a model can rank peers well (IC +0.038) and still not
            move the barrier outcome (51.5% against a 51.51% do-nothing null). That gap is
            the measurement, not a contradiction — and it says the matching expression is
            relative-value, not a directional barrier trade.
          </div>

          {(md.models || [])[0] && (md.models || [])[0].family_share_pct && (
            <div className="mt-2">
              <div className="text-xs font-semibold">Where the model put its weight <span style={{ color: "var(--text-dim)" }}>— NOT where the edge is</span></div>
              {Object.entries((md.models || [])[0].family_share_pct).sort((a, b) => b[1] - a[1]).map(([fam, pct]) => (
                <div key={fam} className="flex items-center gap-2 text-xs font-mono">
                  <span style={{ width: "9rem", color: "var(--text-dim)" }}>{fam}</span>
                  <div style={{ flex: 1, height: 6, background: "var(--bg-deep)", borderRadius: 3 }}>
                    <div style={{ width: pct + "%", height: 6, background: tint("--accent-blue", 0.7), borderRadius: 3 }} />
                  </div>
                  <span style={{ width: "3.5rem", textAlign: "right" }}>{pct.toFixed(1)}%</span>
                </div>
              ))}
              <div className="text-xs mt-1" style={{ color: "var(--accent-amber)" }}>
                In a ridge over correlated features a large coefficient can be a hedge against
                a collinear neighbour, not a claim. Signs flip between this and the univariate
                table below — read the table below for "does this indicator predict".
              </div>
            </div>
          )}

          {(h.fit || {}).member_ic && (
            <div className="mt-3">
              <div className="text-xs font-semibold mb-1">Per-indicator rank IC, out of sample — mapped to the live Sentinel conditions</div>
              <table className="w-full text-xs font-mono" style={{ borderCollapse: "collapse" }}>
                <thead><tr style={{ color: "var(--text-dim)" }}>
                  <th className="text-left pr-2">member</th><th className="text-right pr-2">IC</th>
                  <th className="text-right pr-2">IR</th><th className="text-right pr-2">days+</th>
                  <th className="text-right pr-2">p_NW</th><th className="text-left pl-2">live condition</th>
                </tr></thead>
                <tbody>
                  {[...(h.fit.member_ic || [])].sort((a, b) => Math.abs(b.ic_mean) - Math.abs(a.ic_mean)).map(m => {
                    const ok = m.clears_ic_bar && m.clears_nw_p;
                    return (
                      <tr key={m.member} style={{ opacity: ok ? 1 : 0.68 }}>
                        <td className="pr-2">{m.member}</td>
                        <td className="text-right pr-2" style={{ color: ok ? "var(--accent-green)" : "var(--text-dim)" }}>{(m.ic_mean >= 0 ? "+" : "") + m.ic_mean.toFixed(5)}</td>
                        <td className="text-right pr-2" style={{ color: "var(--text-dim)" }}>{m.ic_ir != null ? m.ic_ir.toFixed(3) : "—"}</td>
                        <td className="text-right pr-2" style={{ color: "var(--text-dim)" }}>{(100 * m.pct_days_positive).toFixed(1)}%</td>
                        <td className="text-right pr-2" style={{ color: m.clears_nw_p ? "var(--text-dim)" : "var(--accent-red)" }}>{m.p_newey_west != null ? m.p_newey_west.toExponential(1) : "—"}</td>
                        <td className="pl-2" style={{ color: "var(--text-dim)" }}>{(m.sentinel_conditions || []).join(" · ") || "—"}{ok ? " ✓" : ""}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              <div className="text-xs mt-1" style={{ color: "var(--text-dim)" }}>
                ✓ = clears |IC| &ge; 0.02 at NW p &lt; 0.01 on its own. Greyed rows do not.
              </div>
            </div>
          )}

          {(md.models || [])[0] && ((md.models || [])[0].per_fold || []).length > 0 && (
            <div className="mt-3">
              <div className="text-xs font-semibold mb-1">Learning curve <span style={{ color: "var(--text-dim)" }}>— OOS R2 by expanding fold ({md.cv && md.cv.scheme})</span></div>
              <div className="flex items-end gap-2">
                {((md.models || [])[0].per_fold || []).map((f, i) => (
                  <div key={i} className="text-xs font-mono text-center" style={{ flex: 1 }}>
                    <div style={{ height: 34, display: "flex", alignItems: "flex-end" }}>
                      <div style={{ width: "100%", height: Math.max(2, Math.abs((f.r2_oos || 0) * 12000)), background: (f.r2_oos || 0) >= 0 ? tint("--accent-green", 0.6) : tint("--accent-red", 0.6) }} />
                    </div>
                    <div style={{ color: "var(--text-dim)" }}>f{i + 1}</div>
                    <div style={{ color: (f.r2_oos || 0) >= 0 ? "var(--accent-green)" : "var(--accent-red)" }}>{f.r2_oos != null ? f.r2_oos.toFixed(5) : "—"}</div>
                    <div style={{ color: "var(--text-dim)" }}>n {f.n_train != null ? (f.n_train / 1000).toFixed(0) + "k" : "—"}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>}

        {md.caveat && <div className="text-xs mt-2" style={{ color: "var(--text-dim)" }}>{md.caveat}</div>}
        {md.pre_registration && <div className="text-xs mt-1 font-mono" style={{ color: "var(--text-dim)" }}>bar pre-registered in {md.pre_registration}</div>}
      </div>

      <div className="research-panel">
        <div id="research-reports" className="panel-name">Reports on this machine</div>
        {(data.reports || []).map(r => (
          <div key={r.file} className="flex items-baseline gap-2 text-xs">
            <span className="font-mono" style={{ width: "4rem", color: "var(--text-dim)" }}>{r.sprint}</span>
            <span style={{ flex: 1 }}>{r.what}</span>
            {r.available
              ? <span className="font-mono" style={{ color: "var(--accent-green)" }}>{r.as_of}</span>
              : <span style={{ color: "var(--accent-amber)" }}>absent — {r.reason}</span>}
          </div>
        ))}
      </div>
      </div>
    </div>
  );
}

const TABS = [
  { id: "agent",     label: "AGENT" },
  { id: "sentinel",  label: "SENTINEL" },
  { id: "paper",     label: "PAPER TRADING" },
  { id: "workspace", label: "▸ WORKSPACE" },
  { id: "news",      label: "NEWS" },
  { id: "analytics", label: "ANALYTICS" },
  // 🔮 RESEARCH ONLY. Sits at top level because it owns its own ticker search
  // rather than following TickerContext, and because it is explicitly not part
  // of the trading workflow the other tabs describe.
  { id: "kronos-explorer", label: "🔮 KRONOS" },
  // 🔴 RESEARCH ONLY, same reasoning as KRONOS above: it reports what the
  // measurement programme found, INCLUDING that WS-4's gate FAILED. Render-only.
  { id: "research",  label: "📐 RESEARCH" },
  { id: "academy",   label: "ACADEMY" },
  { id: "admin",     label: "ADMIN" },
];

function App() {
  const [activeTab, setActiveTab] = useState("agent");
  const { status, events, hydrationSeq } = useWebSocket(WS_URL);

  return (
    <div className="h-screen flex flex-col" style={{ background: "var(--bg-primary)", color: "var(--text-bright)" }}>
      <header className="flex items-center justify-between px-4 py-2 border-b" style={{ borderColor: "var(--border)", background: "var(--bg-primary)" }}>
        <div className="flex items-center gap-6 min-w-0 overflow-x-auto nav-scroll">
          <span className="text-[14px] font-extrabold tracking-wide shrink-0" style={{ color: "var(--accent-blue)" }}>QUANTNEXUS</span>
          <ThemeToggle />
          <nav className="flex gap-5">
            {TABS.map(t => (
              <button
                key={t.id}
                onClick={() => setActiveTab(t.id)}
                className="text-[11px] font-semibold tracking-widest uppercase pb-1 border-b-2 transition-colors"
                style={{
                  borderColor: activeTab === t.id ? "var(--accent-blue)" : "transparent",
                  color: activeTab === t.id ? "var(--text-bright)" : "var(--text-mid)",
                }}
              >
                {t.label}
              </button>
            ))}
          </nav>
        </div>
        <StatusPill status={status} />
      </header>
      <main className="flex-1 min-h-0">
        {/* Tabs are kept MOUNTED rather than swapped, so switching to
            WORKSPACE and back does not tear down the AGENT event timeline or
            restart SENTINEL's scan polling. Only visibility changes. */}
        <div className="h-full" style={{ display: activeTab === "agent" ? "block" : "none" }}>
          <AgentTab events={events} hydrationSeq={hydrationSeq} />
        </div>
        <div className="h-full" style={{ display: activeTab === "sentinel" ? "block" : "none" }}>
          <SentinelTab />
        </div>
        <div className="h-full" style={{ display: activeTab === "paper" ? "block" : "none" }}>
          <PaperTradingTab />
        </div>
        <div className="h-full" style={{ display: activeTab === "workspace" ? "block" : "none" }}>
          <WorkspaceTab />
        </div>
        {/* Macro news sits at top level precisely because it is NOT
            ticker-scoped — it must render with no ticker selected. */}
        <div className="h-full" style={{ display: activeTab === "news" ? "block" : "none" }}>
          <MacroNewsSection />
        </div>
        {/* Neither is ticker-scoped, so both sit at top level. */}
        {/* EA-7 measurement chain — read-only, ticker-independent. */}
        <div className="h-full flex flex-col" style={{ display: activeTab === "analytics" ? "flex" : "none" }}>
          <AnalyticsSection />
        </div>
        {/* Research tooling — weight 0.00, never on a trade path. */}
        <div className="h-full" style={{ display: activeTab === "kronos-explorer" ? "block" : "none" }}>
          <KronosExplorerTab />
        </div>
        <div className="h-full flex flex-col" style={{ display: activeTab === "academy" ? "flex" : "none" }}>
          <AcademySection />
        </div>
        <div className="h-full" style={{ display: activeTab === "research" ? "block" : "none" }}>
          <ResearchBoard />
        </div>
        <div className="h-full" style={{ display: activeTab === "admin" ? "block" : "none" }}>
          <AdminSection />
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <TickerProvider><App /></TickerProvider>
);
</script>
</body>
</html>
