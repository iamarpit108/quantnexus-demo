      <td className="px-2 py-[7px] text-right" style={{ color: pnlColor(r.unrealised_pnl) }}>
        {r.unrealised_pnl != null ? "₹" + fmtNum(r.unrealised_pnl) : "—"}
      </td>
      <td className="pr-3 pl-2 py-[7px] text-right" style={{ color: "var(--text-dim)" }}>
        {r.days_held != null ? r.days_held + "d" : "—"}
      </td>
    </tr>
  );
}

function PaperTradingTab() {
  const { data, consecutiveFailures, lastSuccessAt } = usePolling(API_BASE + "/api/v1/positions", 1000);
  const { data: ledger } = usePolling(API_BASE + "/api/v1/analytics/pnl?limit=200", 8000);
  const { data: ptrader } = usePolling(API_BASE + "/api/v1/paper/analytics", 30000);
  const [selectedTicker, setSelectedTicker] = useState(null);
  const [classFilter, setClassFilter] = useState("ALL");
  const { setTicker } = useTicker();
  const openTicker = useCallback((t) => { setSelectedTicker(t); setTicker(t); }, [setTicker]);

  const positions = (data && data.positions) || [];
  const byClass = (data && data.by_class) || {};
  const marks = (data && data.live_marks) || {};
  const day = data && data.day_realized_detail;
  const sum = (ledger && ledger.summary) || {};
  const stale = consecutiveFailures >= 3;

  const classes = useMemo(() => {
    const order = ["INTRADAY", "FNO", "DELIVERY"];
    return Object.keys(byClass).sort(
      (a, b) => (order.indexOf(a) < 0 ? 9 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 9 : order.indexOf(b)));
  }, [byClass]);

  const shown = classFilter === "ALL" ? positions
    : positions.filter(p => p.trade_class === classFilter);

  const money = v => (v === null || v === undefined) ? "—" : "₹" + fmtNum(v);

  return (
    <div className="flex flex-col h-full overflow-hidden" style={{ background: "var(--ink-900)" }}>

      {/* ── the rail: the whole book in one line ─────────────────────────── */}
      <div className="flex items-start gap-6 px-3 py-2.5 flex-wrap" data-testid="paper-rail"
           style={{ background: "var(--ink-800)", borderBottom: "1px solid var(--hair)" }}>
        <Metric label="Open" value={data ? data.count : "—"}
                sub={sum.open_unmarked ? sum.open_unmarked + " unmarked" : null} />
        <Metric label="Unrealised" wide
                value={<Tick value={data && data.aggregate_unrealized_pnl}
                             render={money(data && data.aggregate_unrealized_pnl)} />}
                tone={pnlColor(data && data.aggregate_unrealized_pnl)} />
        <Metric label="Realised today" wide
                value={money(day && day.value)}
                tone={day && day.value ? pnlColor(day.value) : undefined}
                sub={day ? (day.closed_today === 0 ? "no closes" : day.closed_today + " closed") : null} />
        <Metric label="Realised, all time" wide
                value={money(sum.realised_pnl)}
                tone={sum.realised_pnl ? pnlColor(sum.realised_pnl) : undefined}
                sub={sum.closed_scored != null ? sum.closed_scored + " scored" : null} />
        <Metric label="Win rate"
                value={sum.win_rate_pct != null ? fmtNum(sum.win_rate_pct, 1) + "%" : "—"}
                sub={sum.win_rate_pct != null ? sum.wins + "W / " + sum.losses + "L"
                                              : (sum.win_rate_reason || null)} />
        <Metric label="Entry slippage" wide value={money(sum.total_slippage)}
                tone={sum.total_slippage ? "var(--accent-orange)" : undefined}
                sub="entry only — exit not modelled" />

        <span className="ml-auto text-right" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
          {/* 🔴 `undefined + " live mark"` is the string "undefined live marks" —
              the same composed-string defect as `">= " + undefined` on the Research
              board. An absent count must read as absent, not as a word. */}
          <div>{marks.market_open === false ? "marks held, market closed"
                 : !Number.isFinite(marks.symbols_cached) ? "mark count not reported"
                 : marks.symbols_cached + " live mark" + (marks.symbols_cached === 1 ? "" : "s")}</div>
          {marks.age_s != null && <div className="num">{fmtNum(marks.age_s, 0)}s ago</div>}
        </span>
      </div>

      {/* 🔴 Exclusions are stated, never absorbed. */}
      {(sum.unresolved_note || stale) && (
        <div className="px-3 py-1.5" data-testid="paper-exclusions"
             style={{ background: tint("--accent-amber", 8), borderBottom: "1px solid var(--hair)",
                      fontSize: "var(--t-small)", color: "var(--accent-amber)" }}>
          {stale && <div>Positions may be stale — last good poll{" "}
            {lastSuccessAt ? lastSuccessAt.toLocaleTimeString() : "never"} ({consecutiveFailures} failed)</div>}
          {sum.unresolved_note && <div>{sum.unresolved_note}</div>}
        </div>
      )}

      {/* ── class strip, doubling as the blotter's filter ────────────────── */}
      {classes.length > 0 && (
        <div className="flex gap-0 px-0" data-testid="paper-classes"
             style={{ borderBottom: "1px solid var(--hair)", background: "var(--ink-800)" }}>
          {["ALL"].concat(classes).map(k => {
            const b = k === "ALL" ? null : (byClass[k] || {});
            const on = classFilter === k;
            return (
              <button key={k} onClick={() => setClassFilter(k)}
                className="px-3 py-2 text-left"
                style={{ background: on ? "var(--ink-700)" : "transparent",
                         borderBottom: "2px solid " + (on ? "var(--accent-blue)" : "transparent"),
                         minWidth: k === "ALL" ? "4.5rem" : "9rem" }}>
                <div className="flex items-baseline gap-1.5">
                  <span style={{ fontSize: "var(--t-small)", fontWeight: on ? 600 : 400,
                                 color: on ? "var(--text-bright)" : "var(--text-mid)" }}>
                    {k === "ALL" ? "All" : k}
                  </span>
                  <span className="num" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
                    {k === "ALL" ? positions.length : b.count}
                  </span>
                </div>
                {b && (
                  <div className="num" style={{ fontSize: "var(--t-small)", color: pnlColor(b.unrealized_pnl) }}>
                    {b.unrealized_pnl != null ? "₹" + fmtNum(b.unrealized_pnl) : "—"}
                    {b.unresolved > 0 && (
                      <span style={{ fontSize: "var(--t-micro)", color: "var(--accent-orange)" }}>
                        {" "}{b.unresolved} n/a
                      </span>
                    )}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      )}

      {/* ── the blotter ──────────────────────────────────────────────────── */}
      <div className="flex-1 min-h-0 overflow-auto zone" data-testid="paper-blotter">
        {shown.length === 0 ? (
          <div className="h-full flex items-center justify-center px-6">
            <div style={{ maxWidth: "26rem" }}>
              <div style={{ fontSize: "var(--t-lead)", fontWeight: 600, color: "var(--text-bright)" }}>
                {positions.length === 0 ? "Nothing open." : "No " + classFilter + " positions."}
              </div>
              <div className="mt-1.5" style={{ fontSize: "var(--t-body)", color: "var(--text-mid)", lineHeight: 1.6 }}>
                {positions.length === 0
                  ? "Fills appear here the moment the agent opens a position. Everything it has already closed is counted in the rail above."
                  : "The other classes still hold " + positions.length + " position" + (positions.length === 1 ? "" : "s") + "."}
              </div>
            </div>
          </div>
        ) : (
          <table className="num" style={{ fontSize: "var(--t-small)", tableLayout: "fixed",
                                            width: "min(1080px, 100%)" }}>
            <colgroup>
              <col style={{ width: "9rem" }} /><col style={{ width: "4rem" }} />
              <col style={{ width: "7rem" }} /><col style={{ width: "4rem" }} />
              <col style={{ width: "6rem" }} /><col style={{ width: "8rem" }} />
              <col style={{ width: "11rem" }} /><col style={{ width: "7rem" }} />
              <col style={{ width: "4rem" }} />
            </colgroup>
            <thead>
              <tr style={{ color: "var(--text-dim)", fontSize: "var(--t-micro)" }}>
                <th className="text-left pl-3 pr-2 py-1.5">Symbol</th>
                <th className="text-left px-2 py-1.5">Side</th>
                <th className="text-left px-2 py-1.5">Class</th>
                <th className="text-right px-2 py-1.5">Qty</th>
                <th className="text-right px-2 py-1.5">Entry</th>
                <th className="text-right px-2 py-1.5">Mark</th>
                <th className="text-left px-2 py-1.5">Stop &rarr; target</th>
                <th className="text-right px-2 py-1.5">Unrealised</th>
                <th className="text-right pr-3 pl-2 py-1.5">Held</th>
              </tr>
            </thead>
            <tbody>
              {shown.map((r, i) => (
                <BlotterRow key={r.trade_id || i} r={r} onSelect={openTicker} />
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* ── provenance: WHICH book each number came from ──────────────────── */}
      <div className="px-3 py-1.5 flex items-center gap-4 flex-wrap" data-testid="paper-provenance"
           style={{ background: "var(--ink-800)", borderTop: "1px solid var(--hair)",
                    fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
        <span>
          Positions and totals: <span style={{ color: "var(--text-mid)" }}>agent ledger</span>
          {sum.trades_total != null && <span className="num"> ({sum.trades_total} trades)</span>}
        </span>
        {/* 🔴 The second book, NAMED. It is trading_engine's own PaperTrader file and
            it is usually empty; shown unlabelled above the agent's positions it read
            as "the agent has closed nothing", which was never what it meant. */}
        <span>
          Manual paper book: <span style={{ color: "var(--text-mid)" }}>
            {ptrader && ptrader.trade_count != null ? ptrader.trade_count + " trades" : "empty"}
          </span>{" "}
          <span style={{ color: "var(--text-dim)" }}>— separate from the agent's</span>
        </span>
        {ptrader && ptrader.broker_source && ptrader.broker_source.broker && (
          <span>Marks via <span style={{ color: "var(--text-mid)" }}>
            {ptrader.broker_source.broker}{ptrader.broker_source.tier ? " · " + ptrader.broker_source.tier : ""}
          </span></span>
        )}
        <span className="ml-auto">Paper only — no live order path exists.</span>
      </div>

      <StockDrilldownModal ticker={selectedTicker} onClose={() => setSelectedTicker(null)} />
    </div>
  );
}

// ── News: the wire ──────────────────────────────────────────────────────────
//
// ~80 headlines were ~80 bordered cards stacked vertically. At that count every
// item carries the same weight and the eye has nowhere to land, which is the
// opposite of what a news surface is for.
//
// Now a wire: one dense line each, time first, source coded, headline carrying the
// width. What QUALIFIES the feed — which sources answered, and which API keys are
// absent — sits in a side column instead of a grey line above the fold.
//
// 🔴 A thin feed must read as a CONFIGURATION GAP, never as a quiet news day.
// Without finnhub/marketaux the count simply drops, and nothing about a shorter
// list says why. DD-14 recorded that rule; this makes it unmissable.

function NewsWireRow({ n, onPick, picked }) {
  const t = String(n.published || "");
  // Presentational only: show the clock part when the server sent a timestamp it
  // can be read out of, otherwise show what it sent. No date maths here.
  const clock = (t.match(/\d{2}:\d{2}/) || [])[0] || t.slice(0, 16);
  return (
    <div onClick={() => onPick(picked ? null : n)}
         className="flex items-baseline gap-3 px-3 py-[5px] cursor-pointer"
         style={{ background: picked ? "var(--ink-700)" : "transparent",
                  borderLeft: "2px solid " + (picked ? "var(--accent-blue)" : "transparent") }}
         onMouseEnter={e => { if (!picked) e.currentTarget.style.background = "var(--ink-850)"; }}
         onMouseLeave={e => { if (!picked) e.currentTarget.style.background = "transparent"; }}
         title="Click for the summary">
      <span className="num shrink-0" style={{ width: "3.4rem", fontSize: "var(--t-micro)",
                                              color: "var(--text-dim)" }}>{clock}</span>
      <span className="shrink-0 truncate" style={{ width: "7rem", fontSize: "var(--t-micro)",
                                                   color: "var(--accent-blue)" }}>
        {n.source || "—"}
      </span>
      <span className="flex-1 min-w-0 truncate"
            style={{ fontSize: "var(--t-body)", color: "var(--text-bright)" }}>
        {n.title || "(untitled)"}
      </span>
      {n.tickers && n.tickers.length > 0 && (
        <span className="num shrink-0" style={{ fontSize: "var(--t-micro)", color: "var(--accent-green)" }}>
          {[].concat(n.tickers).slice(0, 2).join(" ")}
        </span>
      )}
    </div>
  );
}

function MacroNewsSection() {
  const { data, error, loading, reload } = useOneShotFetch(`${API_BASE}/api/v1/news/macro`);
  const [job, setJob] = useState(null);      // {status, brief, provider, elapsed, ...}
  const [busy, setBusy] = useState(false);
  const [provider, setProvider] = useState("qwen");
  const [picked, setPicked] = useState(null);
  const [srcFilter, setSrcFilter] = useState(null);
  const pollRef = useRef(null);

  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const runBrief = () => {
    setBusy(true); setJob({ status: "queued" });
    fetch(`${API_BASE}/api/v1/news/brief`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider, limit: 80 }),
    })
      .then(r => r.json())
      .then(j => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(() => {
          fetch(`${API_BASE}/api/v1/news/brief/${j.job_id}`)
            .then(r => r.json())
            .then(res => {
              setJob(res);
              if (res.status === "done" || res.status === "error") {
                setBusy(false); clearInterval(pollRef.current); pollRef.current = null;
              }
            }).catch(() => {});
        }, 2000);
      })
      .catch(e => { setJob({ status: "error", error: String(e) }); setBusy(false); });
  };

  const items = (data && data.items) || [];
  const srcs = (data && data.sources) || [];
  const keys = (data && data.keys_configured) || {};
  const offKeys = Object.entries(keys).filter(([, v]) => !v).map(([k]) => k);
  const shown = srcFilter ? items.filter(n => n.source === srcFilter) : items;

  const STATUS_TEXT = { queued: "Queued…", fetching: "Fetching headlines…",
                        generating: "Reading the news…", done: "", error: "" };

  return (
    <div className="flex flex-col h-full min-h-0" style={{ background: "var(--ink-900)" }}>

      <div className="flex items-center gap-3 px-3 py-2 flex-wrap" data-testid="news-rail"
           style={{ background: "var(--ink-800)", borderBottom: "1px solid var(--hair)" }}>
        <span className="num" style={{ fontSize: "var(--t-lead)", fontWeight: 700, color: "var(--text-bright)" }}>
          {data ? data.count : "—"}
        </span>
        <span style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>
          headlines from {srcs.length} source{srcs.length === 1 ? "" : "s"}
        </span>
        <SourceBadge source={data && data.source} detail={data && data.source_detail} />
        <AsOfBadge asOf={data ? data.as_of : undefined} />
        {srcFilter && (
          <button onClick={() => setSrcFilter(null)} className="px-2 py-[2px] rounded"
                  style={{ fontSize: "var(--t-micro)", background: tint("--accent-blue", 16),
                           color: "var(--accent-blue)" }}>
            {srcFilter} only — clear

        )}
        <span className="ml-auto flex items-center gap-2">
          <select value={provider} onChange={e => setProvider(e.target.value)}
                  className="mono" style={{ background: "var(--ink-850)", color: "var(--text-bright)",
                           border: "1px solid var(--hair)", borderRadius: 3,
                           fontSize: "var(--t-small)", padding: "3px 6px" }}>
            <option value="qwen">qwen (local)</option>
            <option value="groq">groq</option>
            <option value="gemini">gemini</option>
            <option value="nvidia">nvidia</option>
          </select>
          {/* User-triggered on purpose: 30-90s on local Qwen, and an auto-running
              brief on every tab open is a real bill. */}
          <button onClick={runBrief} disabled={busy || !data}
            className="px-3 py-1.5 rounded disabled:opacity-50"
            style={{ background: "var(--accent-amber)", color: "var(--ink-900)",
                     fontSize: "var(--t-small)", fontWeight: 600 }}>
            {busy ? "Reading…" : "Read the news"}
          </button>
          <button onClick={reload} className="underline"
                  style={{ fontSize: "var(--t-small)", color: "var(--accent-blue)" }}>refresh</button>
        </span>
      </div>

      <div className="news-grid flex-1 min-h-0">

        <div className="flex flex-col min-h-0 zone" data-testid="news-wire">
          {loading && !data && (
            <div className="px-3 py-3" style={{ fontSize: "var(--t-body)", color: "var(--text-dim)" }}>
              Fetching headlines from every configured source…
            </div>
          )}
          {error && (
            <div className="px-3 py-3" style={{ fontSize: "var(--t-small)", color: "var(--accent-red)" }}>
              Could not load news: {error}
            </div>
          )}
          {data && !data.available && (
            <div className="px-3 py-3" style={{ fontSize: "var(--t-body)", color: "var(--text-dim)" }}>
              No headlines available{data.reason ? " — " + data.reason : ""}.
            </div>

          <div className="flex-1 min-h-0 overflow-auto" data-testid="macro-news">
            {shown.map((n, i) => (
              <NewsWireRow key={i} n={n} picked={picked === n} onPick={setPicked} />
            ))}
          </div>

          {/* The picked story expands HERE rather than inline, so the wire never
              reflows under the cursor while you are reading down it. */}
          {picked && (
            <div className="px-3 py-2.5" data-testid="news-detail"
                 style={{ borderTop: "1px solid var(--hair)", background: "var(--ink-850)" }}>
              <div style={{ fontSize: "var(--t-body)", fontWeight: 600, color: "var(--text-bright)" }}>
                {picked.title || "(untitled)"}

              {picked.summary && (
                <div className="mt-1" style={{ fontSize: "var(--t-small)", color: "var(--text-mid)", lineHeight: 1.55 }}>
                  {String(picked.summary).slice(0, 600)}

                  <span style={{ color: "var(--accent-green)" }}>{[].concat(picked.tickers).join(" ")}</span>
                )}
                {picked.url && (
                  <a href={picked.url} target="_blank" rel="noreferrer"
                     style={{ color: "var(--accent-blue)" }}>open the story</a>

                        style={{ color: "var(--text-dim)" }}>close</button>
              </div>
            </div>
          )}
        </div>

        <div className="flex flex-col min-h-0 overflow-auto zone" data-testid="news-side"
             style={{ borderLeft: "1px solid var(--hair)" }}>

          {job && (
            <div className="px-3 pt-2.5 pb-3" data-testid="news-brief"
                 style={{ borderBottom: "1px solid var(--hair)" }}>
              <div className="flex items-baseline gap-2">
                <span className="panel-name" style={{ color: "var(--accent-amber)" }}>Morning brief</span>
                {job.provider && (
                  <span className="num" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
                    {job.provider}{job.elapsed ? " · " + job.elapsed + "s" : ""}
                  </span>
                )}
              </div>
              {/* 🔴 Model prose, marked as model prose. Nothing it says is parsed back
                  into a number, and it is visually distinct from every measured value
                  on this page — that separation is a control, not styling. */}
              {job.status === "error" ? (
                <div className="mt-1" style={{ fontSize: "var(--t-small)", color: "var(--accent-red)" }}>
                  The brief failed: {job.error}
                </div>
              ) : job.status === "done" ? (
                <div className="mt-1.5 whitespace-pre-wrap"
                     style={{ fontSize: "var(--t-small)", color: "var(--text-bright)",
                              lineHeight: 1.6, borderLeft: "2px solid var(--accent-amber)",
                              paddingLeft: "0.6rem", fontStyle: "italic" }}>
                  {job.brief}

              ) : (
                <div className="mt-1" style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>

                <div className="mt-1.5" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
                  Model commentary — not a computed value.

          {/* 🔴 THE HONEST PANEL. A missing key makes the feed SHORTER and nothing
              else; without naming it, a configuration gap reads as a quiet day. */}
          {offKeys.length > 0 && (
            <div className="px-3 py-2.5" data-testid="news-keys-off"
                 style={{ borderBottom: "1px solid var(--hair)", background: tint("--accent-amber", 8) }}>
              <div className="panel-name" style={{ color: "var(--accent-amber)" }}>Not configured</div>
              <div className="num mt-1" style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>

          <div className="px-3 py-2.5">
            <div className="panel-name mb-1.5">Sources answering</div>
            {srcs.length === 0 ? (
              <div style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>None yet.</div>
            ) : srcs.map(([name, n]) => {
              const on = srcFilter === name;

              return (

                                   borderRadius: 2 }} />
                  </span>
                  <span className="num" style={{ width: "1.8rem", textAlign: "right",
                        fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>{n}</span>

          <div className="px-3 pb-3 mt-auto" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
            Macro feed — not ticker-scoped.
          </div>
        </div>
      </div>
    </div>
  );
}

function useOneShotFetch(url, intervalMs) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    if (!url) { setData(null); setError(null); return; }
    let cancelled = false;
    setLoading(true);
    setError(null);
    fetch(url)
      .then(res => {
        if (!res.ok) return res.json().catch(() => ({})).then(j => { throw new Error(j.detail || ("HTTP " + res.status)); });
        return res.json();
      })
      .then(json => { if (!cancelled) { setData(json); setLoading(false); } })
      .catch(e => { if (!cancelled) { setError(String(e && e.message ? e.message : e)); setData(null); setLoading(false); } });
    return () => { cancelled = true; };
  }, [url, reloadKey]);

  useEffect(() => {
    if (!url || !intervalMs) return;
    const id = setInterval(() => setReloadKey(k => k + 1), intervalMs);
    return () => clearInterval(id);
  }, [url, intervalMs]);

  return { data, error, loading, reload: () => setReloadKey(k => k + 1) };
}

// Same LIVE/CACHED/SYNTHETIC classification as data.py's render_source_badge
// and api_server.py's _classify_data_source — mapped onto this file's
// existing design tokens rather than the badge's own hex literals.
const SOURCE_BADGE_STYLE = {
  LIVE:      { color: "var(--accent-green)", label: "🟢 SNAPSHOT" },
  CACHED:    { color: "var(--accent-blue)",  label: "🔵 CACHED" },
  SYNTHETIC: { color: "var(--accent-red)",   label: "🔴 SYNTHETIC" },
};

function SourceBadge({ source, detail }) {
  if (!source) return null;
  const key = String(source).toUpperCase();
  const s = SOURCE_BADGE_STYLE[key] || { color: "var(--text-mid)", label: source };
  return (
    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold border shrink-0"
          title={detail || undefined}
          style={{ color: s.color, borderColor: s.color, background: tint(
            key === "LIVE" ? "--accent-green" : key === "SYNTHETIC" ? "--accent-red" : "--accent-blue", 12) }}>
      {s.label}
    </span>
  );
}

/* ── AsOfBadge (DD-6 §2 / DATA-INTEGRITY §3) ─────────────────────────────
 * "A price from 15:30 displayed at 23:00 with no age indicator is a lie by
 * omission." Every ticker-scoped payload now carries `as_of`; this is where
 * the UI actually says it out loud, instead of letting a stale number pass
 * as current.
 *
 * The age arithmetic here is PRESENTATIONAL — it is (now - as_of), a display
 * property of a server-supplied timestamp, not a financial computation. It
 * does not touch any traded value, so it does not violate this file's
 * "no financial values computed client-side" rule (same class as the existing
 * DistanceBar clamp). Thresholds reuse STALE_WARN_S / STALE_CRITICAL_S so the
 * page has one definition of "stale", not two.
 *
 * `as_of === null` is a legitimate, meaningful state — /live reports it when
 * the price is a previous close rather than a tick — and renders as "age
 * unknown", never as a fabricated zero (DATA-INTEGRITY §4). */
function AsOfBadge({ asOf, label }) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 5000);
    return () => clearInterval(id);
  }, []);

  if (asOf === undefined) return null;
  if (asOf === null) {
    return (
      <span className="text-[9px] px-1.5 py-0.5 rounded border shrink-0"
            title="The server did not claim a timestamp for this data."
            style={{ color: "var(--text-dim)", borderColor: "var(--border)" }}>
        age unknown
      </span>
    );
  }

  const t = Date.parse(asOf);
  if (isNaN(t)) return null;
  const ageS = Math.max(0, (now - t) / 1000);
  const color = ageS > STALE_CRITICAL_S ? "var(--accent-red)"
              : ageS > STALE_WARN_S     ? "var(--accent-amber)"
              : "var(--text-dim)";
  return (
    <span className="text-[9px] px-1.5 py-0.5 rounded border shrink-0"
          title={`as_of ${asOf}`}
          style={{ color, borderColor: color }}>
      {label ? label + " " : ""}{fmtAge(ageS)}
    </span>
  );
}

/* ── Ticker context (DD-6 §1) ────────────────────────────────────────────
 * Streamlit is a single-ticker workspace: pick a ticker in the sidebar and all
 * 14 tabs render THAT ticker, with the choice held server-side in
 * st.session_state. This page was fleet-shaped (AGENT / SENTINEL / PAPER),
 * with a ticker only ever a DD-3 modal. Porting 11 per-ticker tabs onto a
 * fleet-shaped shell would mean fighting the shape in every later sprint, so
 * the active ticker becomes app-level state here — this context is the twin of
 * that sidebar selection. */
const TickerContext = createContext({ ticker: null, setTicker: () => {} });

function TickerProvider({ children }) {
  const [ticker, setTickerRaw] = useState(null);
  // Normalise once, centrally: the API is inconsistent about the .NS suffix
  // (shortlist-params and decision-trail REQUIRE it — inherited from
  // load_cached_payload's bare yfinance call — while charts strips it itself),
  // so every consumer gets the suffixed form and no caller has to remember.
  const setTicker = useCallback((t) => {
    if (!t) { setTickerRaw(null); return; }
    const s = String(t).trim().toUpperCase();
    if (!s) { setTickerRaw(null); return; }
    setTickerRaw(/\.(NS|BO)$/.test(s) ? s : s + ".NS");
  }, []);
  const value = useMemo(() => ({ ticker, setTicker }), [ticker, setTicker]);
  return <TickerContext.Provider value={value}>{children}</TickerContext.Provider>;
}

function useTicker() { return useContext(TickerContext); }

/** useTickerFetch — the client half of DD-6 §2's envelope. Any ticker-scoped
 * endpoint can be consumed as `useTickerFetch("charts?type=fno")` and the
 * caller gets provenance without having to know the key names. Built on
 * useOneShotFetch so the existing polling/reload semantics are unchanged. */
function useTickerFetch(path, intervalMs, tickerOverride) {
  const ctx = useTicker();
  const ticker = tickerOverride || ctx.ticker;
  const url = (ticker && path)
    ? `${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/${path}`
    : null;
  const r = useOneShotFetch(url, intervalMs);
  return {
    ...r,
    ticker,
    source:       r.data ? r.data.source : null,
    sourceDetail: r.data ? r.data.source_detail : null,
    asOf:         r.data ? r.data.as_of : undefined,
  };
}

/* ── Chart template cache (DD-6 §4) ──────────────────────────────────────
 * Every plotly.py figure embeds a full `layout.template`. Measured on this
 * app: 7,525 chars on the candlestick figure and 3,665 on each build_* figure
 * — 17.4% of the combined payload, and 75% of a single derivatives figure.
 * ChartsSection re-polls every 12s, so that was re-sent continuously while
 * never changing.
 *
 * api_server.py's `_fig_json` now lifts the template out and leaves a
 * `layout.template_id`; we fetch each distinct template ONCE and re-attach it
 * here. Visual output must be — and is, proven by tests/visual/chart_parity.py
 * — pixel-identical, because the object re-attached is the same object that
 * was removed.
 *
 * This is a protocol pair: server strip and client re-attach must ship and
 * revert together, or charts render unthemed. */
const _chartTemplates = new Map();
let _chartTemplatesFetch = null;

function loadChartTemplates(force) {
  if (force) _chartTemplatesFetch = null;
  if (_chartTemplatesFetch) return _chartTemplatesFetch;
  _chartTemplatesFetch = fetch(`${API_BASE}/api/v1/chart-templates`)
    .then(r => r.ok ? r.json() : { templates: {} })
    .then(j => {
      Object.entries(j.templates || {}).forEach(([k, v]) => _chartTemplates.set(k, v));
      return _chartTemplates;
    })
    .catch(() => _chartTemplates);
  return _chartTemplatesFetch;
}

/** Exactly the layout preparation PlotlyChart performs before Plotly.react.
 * Exposed on `window` so tests/visual/chart_parity.py exercises the REAL code
 * path rather than a copy of it that could silently drift. */
async function __qnPrepareFigure(fig) {
  const layout = Object.assign({}, (fig && fig.layout) || {}, { autosize: true });
  const tid = layout.template_id;
  if (tid) {
    if (!_chartTemplates.has(tid)) await loadChartTemplates(false);
    // A miss can only mean the server restarted between serving the figure and
    // this lookup (an id reaches us only inside a figure that registered it).
    // One forced re-fetch resolves it; anything beyond that we render untemplated
    // rather than not at all.
    if (!_chartTemplates.has(tid)) await loadChartTemplates(true);
    const tpl = _chartTemplates.get(tid);
    if (tpl) layout.template = tpl;
    delete layout.template_id;
  }
  return layout;
}
window.__qnPrepareFigure = __qnPrepareFigure;

/** PlotlyChart — renders one `fig.to_json()`-shaped object (as returned by
 * /api/v1/stock/{ticker}/charts) via Plotly.react. Server-side layout
 * (paper_bgcolor transparent, light font) already matches this page's dark
 * theme, so only autosize/responsive and the template re-attach happen
 * client-side — no financial values are touched. */
function PlotlyChart({ fig, minHeight }) {
  const divRef = useRef(null);

  useEffect(() => {
    if (!divRef.current || !fig || !fig.data) return;
    let cancelled = false;
    __qnPrepareFigure(fig).then(layout => {
      if (cancelled || !divRef.current) return;
      Plotly.react(divRef.current, fig.data, layout, { responsive: true, displaylogo: false });
    });
    return () => { cancelled = true; };
  }, [fig]);

  useEffect(() => () => {
    if (divRef.current) { try { Plotly.purge(divRef.current); } catch (e) {} }
  }, []);

  return <div ref={divRef} className="w-full" style={{ minHeight: minHeight || 220 }} />;
}

                 : cond.direction === "bear" ? "var(--accent-red)" : "var(--text-mid)";
  return (
    <div className="flex items-center justify-between px-2 py-1 rounded border text-[10px]"
         style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
      <span style={{ color: cond.passed ? "var(--text-bright)" : "var(--text-dim)" }}>
        {cond.passed ? "✓" : "✗"} {name}
      </span>
      <span style={{ color: dirColor }}>{cond.value || ""}</span>
    </div>
  );
}

function ShortlistParamsSection({ ticker }) {
  const { data, error, loading, reload } = useOneShotFetch(
    ticker ? `${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/shortlist-params` : null
  );
  const p = (data && data.params) || null;

  if (loading && !p) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Loading shortlist params…</div>;
  if (error) {
    return (
      <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>
        Could not load shortlist params: {error}
        {error.includes("404") && (
          <div className="mt-1" style={{ color: "var(--text-dim)" }}>
            (this endpoint needs the full ".NS"/".BO" suffix — expected if `ticker` is bare)
          </div>
        )}
        <button onClick={reload} className="ml-2 underline" style={{ color: "var(--accent-blue)" }}>retry</button>
      </div>
    );
  }
  // Not loading, no error, and still no params: the endpoint answered with nothing
  // this section can use. Returning null drew a BLANK PANEL, which reads as "this
  // feature is broken" rather than "there is no scan for this ticker". Absence is
  // represented, like everywhere else here.
  if (!p) {
    return (
      <div className="p-4" data-testid="shortlist-params-empty">
        <div style={{ fontSize: "var(--t-body)", fontWeight: 600, color: "var(--text-bright)" }}>
          No scan on record for {ticker}.
        </div>
        <div className="mt-1.5" style={{ fontSize: "var(--t-small)", color: "var(--text-mid)", lineHeight: 1.6 }}>
          Scores appear once this symbol has been through a Sentinel scan. Run one from
          the SENTINEL tab, or pick a ticker that is already on the shortlist.
        </div>
        <button onClick={reload} className="mt-2 underline"
                style={{ fontSize: "var(--t-small)", color: "var(--accent-blue)" }}>check again</button>
      </div>
    );
  }

  const conditions = Object.entries(p.conditions_fired || {});

  return (
    <div className="p-4 flex flex-col gap-4">
      <div className="flex items-center gap-2">
        <SourceBadge source={data.source} />
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>as of {data.as_of || "—"}</span>
        <button onClick={reload} className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="grid grid-cols-4 gap-3">
        <Stat label="LONG SCORE" value={p.long_score} color="var(--accent-green)" />
        <Stat label="SHORT SCORE" value={p.short_score} color="var(--accent-red)" />
        <Stat label="NET BIAS" value={p.net_bias} color={p.net_bias >= 0 ? "var(--accent-green)" : "var(--accent-red)"} />
        <Stat label="DIRECTION" value={p.dominant_direction} />
        <Stat label="TIER" value={p.tier} />
        <Stat label="TRADEABLE" value={p.tradeable ? "YES" : "NO"} color={p.tradeable ? "var(--accent-green)" : "var(--text-dim)"} />
        <Stat label="ENTRY" value={p.entry != null ? fmtNum(p.entry) : "—"} />
        <Stat label="SL / TARGET" value={`${fmtNum(p.sl)} / ${fmtNum(p.target)}`} />
      </div>

      {conditions.length > 0 && (
        <div>
          <div className="text-[10px] uppercase tracking-wide mb-2" style={{ color: "var(--text-mid)" }}>
            Conditions ({conditions.filter(([, c]) => c.passed).length}/{conditions.length} passed)
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-1.5">
            {conditions.map(([name, cond]) => <ConditionChip key={name} name={name} cond={cond} />)}
          </div>
        </div>
      )}
    </div>
  );
}

// compute_quant_deck() needs no change here (DD-7's stated design goal).
//
// Every displayed string is the server's `display` field — the exact text
// Streamlit's card() produced. This file must never re-format a number
// (its own header rule), and `tone` is likewise decided server-side from the
// hex the original renderer hardcoded, so no bullish/bearish judgement is made
// in JavaScript.

const DECK_TONE_COLOR = {
  bullish: "var(--accent-green)",
  bearish: "var(--accent-red)",
  info:    "var(--accent-blue)",
  warn:    "var(--accent-amber)",
  neutral: "var(--text-bright)",
};

function DeckMetric({ metric }) {
  // A null value means the server had nothing — render an explicit n/a rather
  // than 0 or a blank (DATA-INTEGRITY §4: never fabricate to fill a gap).
  const missing = metric.value === null || metric.value === undefined;
  return (
    <div className="rounded px-2 py-1.5 mb-1.5"
         style={{ background: tint("--text-bright", 5), borderLeft: "2px solid var(--border)" }}>
      <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>{metric.label}</div>
      <div className="text-[13px] font-bold"
           style={{ color: missing ? "var(--text-dim)" : (DECK_TONE_COLOR[metric.tone] || "var(--text-bright)") }}>
        {missing ? "n/a" : metric.display}
      </div>
    </div>
  );
}

                style={{ color: "var(--accent-blue)" }}>refresh</button>

                   style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
                <div className="text-[11px] font-bold uppercase tracking-wide mb-2"

/** Admin. 🔴 READ-ONLY on credentials by design.
 *
 * Shows only whether each key is CONFIGURED and a coarse length band. The API
 * never returns a secret in any form — not even masked, since a mask still
 * leaks entropy across rotations.
 *
 * Credential ENTRY deliberately stays in the Streamlit sidebar, which is
 * already password-gated. Building a second entry surface would double the
 * places a secret can leak for no benefit. */
/** Admin password gate (DD-16 §2).
 *
 * The token lives in React state ONLY — deliberately not localStorage or a
 * cookie. localStorage would persist an admin token across restarts and expose
 * it to any script on the origin; the server's TTL would still hold, but the
 * blast radius of an XSS would include it. Closing the tab re-locks.
 *
 * The password is sent in a POST body, never a query string. */
function useAdminGate() {
  const [gate, setGate] = useState(null);
  const [token, setToken] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);

  const refresh = useCallback(() => {
    fetch(`${API_BASE}/api/v1/admin/gate`).then(r => r.json())
      .then(setGate).catch(() => setGate(null));
  }, []);
  useEffect(refresh, [refresh]);

  const unlock = useCallback((password) => {
    setBusy(true); setErr(null);
    return fetch(`${API_BASE}/api/v1/admin/unlock`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      setToken(j.token); refresh(); return j;
    }).catch(e => { setErr(e.message); throw e; })
      .finally(() => setBusy(false));
  }, [refresh]);

  const lock = useCallback(() => {
    if (token) fetch(`${API_BASE}/api/v1/admin/lock`, {
      method: "POST", headers: { "x-admin-token": token },
    }).catch(() => {});
    setToken(null); refresh();
  }, [token, refresh]);

  return { gate, token, err, busy, unlock, lock, refresh };
}

      <form onSubmit={e => { e.preventDefault(); onUnlock(pw).then(() => setPw("")).catch(() => {}); }}>

/** Kill switch — the stop button, at the top of Session because the only time
 * it matters is when you need it in a hurry.
 *
 * ⚠️ It blocks OPENS, not EXITS. Blocking exits would trap you in open positions
 * during exactly the event that made you hit it. `block_exits` is a separate,
 * deliberate choice for freeze-for-forensics.
 *
 * Status polls unauthenticated (it carries no secret and a stop button whose
 * state you cannot see is not usable); engaging/releasing needs the admin token. */
function KillSwitchPanel({ token }) {
  const { data, reload } = useOneShotFetch(`${API_BASE}/api/v1/admin/kill-switch`, 5000);
  const [reason, setReason] = useState("");
  const [freezeExits, setFreezeExits] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const send = (halt) => {
    if (halt && !reason.trim()) { setMsg({ ok: false, text: "A reason is required." }); return; }
    setBusy(true); setMsg(null);
    fetch(`${API_BASE}/api/v1/admin/kill-switch`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": token },
      body: JSON.stringify({ halt, reason, block_exits: freezeExits, set_by: "react-admin" }),
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      setMsg({ ok: true, text: halt ? "Execution HALTED." : "Execution resumed." });
      setReason(""); setFreezeExits(false); reload();
    }).catch(e => setMsg({ ok: false, text: e.message }))
      .finally(() => setBusy(false));
  };

  const halted = data && data.halted;
  return (
    <div className="rounded-lg border p-3 mb-3" data-testid="kill-switch"
         style={{ background: halted ? tint("--accent-red", 10) : "var(--bg-secondary)",
                  borderColor: halted ? "var(--accent-red)" : "var(--border)" }}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-[11px] font-bold uppercase tracking-wide"
              style={{ color: halted ? "var(--accent-red)" : "var(--text-bright)" }}>
          {halted ? "🛑 EXECUTION HALTED" : "🟢 Execution armed"}
        </span>
        {halted
          ? <button disabled={busy} onClick={() => send(false)} data-testid="ks-release"
                    className="px-2.5 py-1 rounded border text-[10px] font-bold uppercase tracking-wider"
                    style={{ borderColor: "var(--accent-green)", color: "var(--accent-green)" }}>
              Resume
            </button>
          : <button disabled={busy} onClick={() => send(true)} data-testid="ks-engage"
                    className="px-2.5 py-1 rounded border text-[10px] font-bold uppercase tracking-wider"
                    style={{ background: tint("--accent-red", 14),
                             borderColor: "var(--accent-red)", color: "var(--accent-red)" }}>
              Halt execution
            </button>}
      </div>

      {halted && data && (
        <div className="text-[10px] mb-2" style={{ color: "var(--accent-red)" }}>
          {data.reason || "no reason recorded"}
          <span style={{ color: "var(--text-dim)" }}>
            {" "}— set {data.set_at ? new Date(data.set_at).toLocaleString() : "?"} by {data.set_by || "?"}
          </span>
          <div style={{ color: "var(--text-dim)" }}>
            {data.block_exits
              ? "⚠️ Exits are ALSO frozen — open positions cannot be closed."
              : "Exits remain allowed — open positions can still be closed."}
          </div>
        </div>
      )}

      {!halted && (
        <>
          <input value={reason} onChange={e => setReason(e.target.value)}
                 aria-label="halt reason" placeholder="Reason (required) — e.g. broker feed looked wrong"
                 className="w-full px-2 py-1 rounded border text-[10px] outline-none mb-1"
                 style={{ background: "var(--bg-primary)", borderColor: "var(--border)",
                          color: "var(--text-bright)" }} />
          <label className="flex items-center gap-1 text-[9px]" style={{ color: "var(--text-dim)" }}>
            <input type="checkbox" checked={freezeExits}
                   onChange={e => setFreezeExits(e.target.checked)} />
            Also freeze EXITS (forensics only — this traps open positions)
          </label>
        </>
      )}

      <div className="text-[9px] mt-2" style={{ color: "var(--text-dim)" }}>
        Enforced at the execution boundary, so it holds for the agent loop, the
        monitor thread and any other process. Survives a restart.
      </div>
      {msg && <div className="text-[10px] mt-1"
                   style={{ color: msg.ok ? "var(--accent-green)" : "var(--accent-red)" }}>{msg.text}</div>}
    </div>
  );
}

/** Broker session: status, auto-reconnect, and manual login as the fallback.
 *
 * AUTO-CONNECT IS THE PRIMARY PATH. api_server logs Angel in from
 * quantnexus_keys.json at startup and DD-16 does the same for Shoonya, so in
 * the normal case nobody types a credential anywhere. "Reconnect" re-runs that
 * from the keys file with no credentials in the request at all — before DD-16 a
 * failed startup connect meant restarting the whole process.
 *
 * The manual forms exist only for when the keys file has nothing usable. Values
 * go out in a POST body and are never read back — the API cannot return them. */
function BrokerSessionPanel({ token }) {
  const { data, reload } = useOneShotFetch(`${API_BASE}/api/v1/broker/session`, 5000);
  const [msg, setMsg] = useState(null);
  const [openForm, setOpenForm] = useState(null);
  const [busy, setBusy] = useState(false);

  const post = (path, body) => {
    setBusy(true); setMsg(null);
    return fetch(`${API_BASE}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": token },
      body: JSON.stringify(body || {}),
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      setMsg({ ok: true, text: "Connected." }); reload(); return j;
    }).catch(e => setMsg({ ok: false, text: e.message }))
      .finally(() => setBusy(false));
  };

  const a = (data && data.angel) || {};
  const s = (data && data.shoonya) || {};

  const Dot = ({ on }) => (

/** Generic credential form. Secret fields are type=password, never prefilled
 * (the API cannot return a stored value), and cleared on submit. */
function CredentialForm({ fields, onSubmit, busy, note, allowPersist }) {
  const [v, setV] = useState({});
  const [persist, setPersist] = useState(false);
  return (
    <form className="mt-2 space-y-1"
          onSubmit={e => { e.preventDefault(); onSubmit({ ...v, persist }); setV({}); }}>
      {fields.map(([k, label, secret]) => (
        <input key={k} type={secret ? "password" : "text"} value={v[k] || ""}

}

/** Change the gate password. Requires the current one, so an unlocked-and-left
 * browser cannot silently rotate it. Stored server-side as a salted PBKDF2
 * hash in the gitignored keys file — never plaintext. */
function SetPasswordForm({ token, onDone }) {
  const [cur, setCur] = useState(""); const [nw, setNw] = useState("");
  const [msg, setMsg] = useState(null);
  const submit = (e) => {
    e.preventDefault();
    fetch(`${API_BASE}/api/v1/admin/set-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": token },
      body: JSON.stringify({ current_password: cur, new_password: nw }),
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      setMsg({ ok: true, text: "Password updated." });
      setCur(""); setNw(""); onDone && onDone();

/** Prompt templates — READ-ONLY, and that is a decision, not a gap.
 * SkillLibrary._save() writes via a shared '<path>.tmp' name; adding api_server
 * as a second writing process would re-introduce the concurrent-JSON-write bug.
 * Streamlit stays the single writer. */
/** Edit the managed LLM API keys.
 *
 * Reuses PUT /api/v1/providers, which ALREADY accepts a `keys` map and already
 * ignores a blank field or an unchanged masked echo — so a partial save cannot
 * wipe a key you did not touch. No second key store; quantnexus_keys.json stays
 * the only one.
 *
 * 🔴 Values are never rendered back. GET returns them masked and this only ever
 * SENDS. A field left blank means "keep what is stored". */
function KeysEditor({ token, onSaved }) {
  const NAMES = ["GROQ_API_KEY", "GEMINI_API_KEY", "NVIDIA_API_KEY"];
  const [v, setV] = useState({});
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const save = (e) => {
    e.preventDefault();
    const payload = {};
    NAMES.forEach(n => { if ((v[n] || "").trim()) payload[n] = v[n].trim(); });
    if (!Object.keys(payload).length) { setMsg({ ok: false, text: "Nothing to save — all fields blank." }); return; }
    setBusy(true); setMsg(null);
    fetch(`${API_BASE}/api/v1/providers`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "x-admin-token": token },
      body: JSON.stringify({ keys: payload }),
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      setMsg({ ok: true, text: `Saved: ${Object.keys(payload).join(", ")}` });
      setV({}); onSaved && onSaved();
    }).catch(e => setMsg({ ok: false, text: e.message }))
      .finally(() => setBusy(false));
  };

  return (
    <form onSubmit={save} className="rounded-lg border p-3 mt-3" data-testid="keys-editor"
          style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
      <div className="text-[11px] font-bold uppercase tracking-wide mb-1"
           style={{ color: "var(--text-bright)" }}>Edit API keys</div>
      <div className="text-[9px] mb-2" style={{ color: "var(--text-dim)" }}>
        Blank = keep the stored key. Values are never sent back to the browser,
        so nothing is prefilled.
      </div>
      {NAMES.map(n => (
        <input key={n} type="password" value={v[n] || ""} autoComplete="off"
               aria-label={n} placeholder={n}
               onChange={e => setV({ ...v, [n]: e.target.value })}
               className="w-full px-2 py-1 rounded border text-[10px] outline-none mb-1"
               style={{ background: "var(--bg-primary)", borderColor: "var(--border)",
                        color: "var(--text-bright)" }} />
      ))}
      <button type="submit" disabled={busy}
              className="px-2 py-0.5 rounded border text-[9px] font-bold uppercase"
              style={{ borderColor: "var(--accent-green)", color: "var(--accent-green)" }}>
        {busy ? "…" : "Save keys"}
      </button>
      {msg && <div className="text-[10px] mt-2"
                   style={{ color: msg.ok ? "var(--accent-green)" : "var(--accent-red)" }}>{msg.text}</div>}
    </form>
  );
}

/** Edit one prompt template. Gated by the admin token; the server validates the
 * required {variables} before writing, so a template that silently drops one is
 * refused here rather than failing at the next LLM call. */
function PromptEditor({ skill, name, token, onSaved }) {
  const [text, setText] = useState(skill.template || "");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  // The name of the skill being edited. Prefer the one the pane selected: it is
  // what drove the fetch, so it is known-good. skill.name is the fallback and is
  // only present because get_skill() injects it — the stored record is keyed by
  // name and does not repeat it, so this used to be undefined, JSON.stringify
  // dropped it, and every save came back 400 "name is required" with no field in
  // the UI to fix. The name is NOT user-chosen and must never be generated: the
  // endpoint updates an EXISTING skill, and a made-up name 404s.
  const skillName = name || skill.name || "";
  useEffect(() => { setText(skill.template || ""); setMsg(null); }, [skillName, skill.template]);

  const dirty = text !== (skill.template || "");
  const save = () => {
    if (!skillName) {
      setMsg({ ok: false, text: "Cannot save — no skill selected (missing name)." });
      return;
    }
    setBusy(true); setMsg(null);
    fetch(`${API_BASE}/api/v1/admin/prompts`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "x-admin-token": token },
      body: JSON.stringify({ name: skillName, template: text, bump_version: true }),
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      setMsg({ ok: true, text: `Saved — version ${j.version_before} to ${j.version_after}` });
      onSaved && onSaved();
    }).catch(e => setMsg({ ok: false, text: e.message }))
      .finally(() => setBusy(false));
  };

  return (
    <div data-testid="prompt-editor">
      <textarea value={text} onChange={e => setText(e.target.value)}
                aria-label="prompt template" spellCheck={false} rows={18}
                className="w-full text-[10px] font-mono p-3 rounded border outline-none"
                style={{ background: "var(--bg-secondary)", borderColor: dirty ? "var(--accent-amber)" : "var(--border)",
                         color: "var(--text-mid)", resize: "vertical" }} />
      <div className="flex items-center gap-2 mt-1">
        <button onClick={save} disabled={busy || !dirty || !skillName} data-testid="prompt-save"
                className="px-2.5 py-1 rounded border text-[10px] font-bold uppercase tracking-wider"
                style={{ borderColor: dirty ? "var(--accent-green)" : "var(--border)",
                         color: dirty ? "var(--accent-green)" : "var(--text-dim)" }}>
          {busy ? "…" : "Save prompt"}
        </button>
        <button onClick={() => { setText(skill.template || ""); setMsg(null); }}
                disabled={!dirty} className="text-[10px] underline"
                style={{ color: dirty ? "var(--accent-amber)" : "var(--text-dim)" }}>revert</button>
        {dirty && <span className="text-[9px]" style={{ color: "var(--accent-amber)" }}>unsaved</span>}
        <span className="ml-auto text-[9px]" style={{ color: "var(--text-dim)" }}>{text.length} chars</span>
      </div>
      {msg && <div className="text-[10px] mt-1"
                   style={{ color: msg.ok ? "var(--accent-green)" : "var(--accent-red)" }}>{msg.text}</div>}
    </div>
  );
}

// Redact anything credential-shaped before it can be rendered. Defensive by
// design: it does not trust the endpoint to mask, because a surface that prints
// whatever it is handed is one server change away from printing a live key — and a
// secret scan run against a correctly-masking server cannot detect that.
// ⚠️ Keyed on the FIELD NAME, not on the value's shape: a 40-char hex string and a
// 40-char model id are indistinguishable, and guessing by shape would either leak
// or redact the routing this pane exists to show.
const _SECRET_KEY_RE = /(key|secret|token|password|pwd|pin|totp|credential)/i;
function redactSecrets(v, keyName) {
  if (Array.isArray(v)) return v.map(x => redactSecrets(x, keyName));
  if (v && typeof v === "object") {
    const out = {};
    for (const k of Object.keys(v)) out[k] = redactSecrets(v[k], k);
    return out;
  }
  if (typeof v === "string" && keyName && _SECRET_KEY_RE.test(keyName) && v.length > 0) {
    // Keep the shape readable (configured vs not, roughly how long) without the value.
    return "[redacted · " + v.length + " chars]";
  }
  return v;
}

              Enter or change credentials in the Streamlit sidebar (password-gated).
            </div>
            {loading && !data && <div className="text-[12px]" style={{ color: "var(--text-dim)" }}>Loading…</div>}
            {data && (
              <>
                {/* 🔴 Both of these were unguarded. A partial /admin/keys payload
                    threw here, and because every top-level tab stays MOUNTED (DD-6)
                    the error unmounted the WHOLE dashboard — from the credential
                    surface, which is the worst place to lose the page. */}
                <div className="text-[10px] mb-2" style={{ color: "var(--text-dim)" }}>
                  {data.configured}/{data.total} configured · Angel session{" "}
                  {!data.live_sessions ? "not reported"
                    : data.live_sessions.angel
                      ? `LIVE (${data.live_sessions.angel_tier || "tier unknown"})` : "offline"}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                  {Object.entries(data.groups || {}).map(([g, rows]) => (
                    <div key={g} className="rounded-lg border p-3"
                         style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
                      <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
                           style={{ color: "var(--text-bright)" }}>{g.replace(/_/g, " ")}</div>
                      {(rows || []).map(r => (
                        <div key={r.field} className="flex justify-between text-[10px] py-0.5">
                          <span style={{ color: "var(--text-dim)" }}>{r.field}</span>
                          <span style={{ color: r.configured ? "var(--accent-green)" : "var(--text-dim)" }}>
                            {r.configured ? `set · ${r.length_band}` : "not set"}
                          </span>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </>
            )}
            {/* Editing is gated the same way every other admin action is:
                unlock on the Session tab first. Reading presence stays open,
                because it carries no secret. */}
            {token
              ? <KeysEditor token={token} onSaved={reload} />
              : <div className="text-[10px] mt-3" style={{ color: "var(--text-dim)" }}>
                  Unlock on the Session tab to edit keys.
                </div>}
          </>
        )}

        {tab === "route" && (
          <div data-testid="admin-route">
            {/* 🔴 This was `JSON.stringify(providers.data)` — it rendered whatever
                the server sent, VERBATIM, on the credential surface. That is safe
                only for as long as the endpoint happens to mask: a new field, an
                older server, or a regression in _mask_key would print a live key
                straight into the DOM, and the secret scan could not see it because
                it only ever tests TODAY's server. The page now redacts
                secret-shaped values itself, whatever arrives. */}
            <div className="mb-2" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
              Values that look like credentials are redacted HERE, by this page,
              regardless of what the endpoint sends.
            </div>
            <pre className="whitespace-pre-wrap p-3 zone"
                 style={{ border: "1px solid var(--hair)", fontSize: "var(--t-micro)",
                          color: "var(--text-mid)" }}>
              {providers.data ? JSON.stringify(redactSecrets(providers.data), null, 2)
                              : "Loading model routing…"}
            </pre>
          </div>
        )}

        {tab === "health" && (
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-3">
            {/* DD-16 §4 — Postgres STATUS only. The password is entered in the
                Streamlit sidebar; this API neither accepts nor returns one. */}
            <div className="xl:col-span-2 rounded-lg border p-3" data-testid="admin-postgres"
                 style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
              <div className="text-[11px] font-bold uppercase tracking-wide mb-1"
                   style={{ color: "var(--text-bright)" }}>🗄️ PostgreSQL / TimescaleDB</div>
              {!postgres.data && <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>Loading…</div>}
              {postgres.data && (
                <div className="text-[10px] space-y-0.5" style={{ color: "var(--text-dim)" }}>
                  <div style={{ color: postgres.data.connected ? "var(--accent-green)" : "var(--accent-amber)" }}>
                    {postgres.data.connected
                      ? `🟢 ${postgres.data.database} ACTIVE — ${postgres.data.host}`
                      : `🔴 not connected${postgres.data.driver_available ? " (data held in RAM only)" : ""}`}
                  </div>
                  {postgres.data.reason && <div>{postgres.data.reason}</div>}
                  <div className="text-[9px]">{postgres.data.note || postgres.data.hint}</div>
                </div>
              )}
            </div>
            <pre className="text-[10px] whitespace-pre-wrap p-3 rounded border"
                 style={{ background: "var(--bg-secondary)", borderColor: "var(--border)", color: "var(--text-mid)" }}>
              {health.data ? JSON.stringify(health.data, null, 2) : "Loading health…"}
            </pre>
            <pre className="text-[10px] whitespace-pre-wrap p-3 rounded border"
                 style={{ background: "var(--bg-secondary)", borderColor: "var(--border)", color: "var(--text-mid)" }}>
              {thresholds.data ? JSON.stringify(thresholds.data, null, 2) : "Loading thresholds…"}
            </pre>
          </div>
        )}
      </div>
    </div>
  );
}

/** Sector heat map — how this stock's SECTOR is doing, in India AND globally.
 * A pharma move in India rarely starts in India, so the regional medians matter
 * as much as the peer grid.
 *
 * ⚠️ Peers are CURATED (config/sector_peers.json), not inferred — the payload
 * says so. A peer with no price data renders as absent, never as 0%: a grid of
 * green squares with silent zeros is the exact failure this codebase keeps
 * fixing. */
function SectorHeatmapSection({ ticker }) {
  const { data, error, loading, reload, source, asOf } =
    useTickerFetch("sector-heatmap", null, ticker);

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Loading sector peers…</div>;
  if (error) return <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>Could not load sector map: {error}</div>;
  if (!data) return null;

  const cell = (v) => {
    if (v == null) return { background: "var(--bg-secondary)", color: "var(--text-dim)" };
    const mag = Math.min(Math.abs(v) / 5, 1);
    const c = v >= 0 ? "--accent-green" : "--accent-red";
    return { background: tint(c, 8 + mag * 26), color: `var(${c})` };
  };
  const REGION = { india: "India", us: "United States", europe: "Europe", asia: "Asia" };

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <SourceBadge source={source} />
        <AsOfBadge asOf={asOf} />
        {data.available && (
          <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
            {data.sector_label} · {data.peer_count} peers · {data.period}
          </span>)}
        <button onClick={reload} className="ml-auto text-[10px] underline"
                style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="sector-heatmap">
        {!data.available && (
          <div className="text-[11px] px-2 py-1.5 rounded"
               style={{ background: tint("--accent-amber", 10), color: "var(--accent-amber)" }}>
            {data.reason}
          </div>)}

        {data.available && (
          <>
            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-2 mb-4">
              <StatTile label="This stock"
                        value={data.self_change_pct == null ? null : `${data.self_change_pct}%`}
                        sub={data.period} tone={data.self_change_pct >= 0 ? "bullish" : "bearish"} />
              <StatTile label="vs India median"
                        value={data.vs_india_median_pp == null ? null : `${data.vs_india_median_pp}pp`}
                        sub="relative strength"
                        tone={data.vs_india_median_pp >= 0 ? "bullish" : "bearish"} />
              {Object.entries(REGION).map(([k, lbl]) => (
                <StatTile key={k} label={`${lbl} median`}
                          value={data.region_median_pct[k] == null ? null : `${data.region_median_pct[k]}%`}
                          sub="sector" tone={(data.region_median_pct[k] || 0) >= 0 ? "bullish" : "bearish"} />
              ))}
            </div>

            {Object.entries(data.regions).map(([region, rows]) => (
              <div key={region} className="mb-4">
                <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
                     style={{ color: "var(--text-bright)" }}>
                  {REGION[region] || region}
                  <span className="ml-2 text-[9px] font-normal" style={{ color: "var(--text-dim)" }}>
                    median {data.region_median_pct[region] == null ? "n/a" : `${data.region_median_pct[region]}%`}
                  </span>
                  {/* Per-region provenance: Indian peers follow the Angel
                      failover chain, global peers cannot (Angel is NSE/BSE/MCX
                      only). One badge for the panel would misreport whichever
                      half it did not describe. */}
                  {data.source_by_region && data.source_by_region[region] && (
                    <span className="ml-2 text-[9px] font-normal"
                          style={{ color: (data.source_by_region[region][0] || "").startsWith("Angel")
                                          ? "var(--accent-green)" : "var(--text-dim)" }}>
                      via {data.source_by_region[region].join(", ")}
                    </span>)}
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-2">
                  {rows.map(r => (
                    <div key={r.symbol} className="rounded-lg border px-2 py-2"
                         style={{ ...cell(r.change_pct), borderColor: "var(--border)" }}>
                      <div className="text-[10px] font-mono truncate"
                           style={{ color: r.symbol === data.ticker ? "var(--accent-blue)" : "var(--text-mid)" }}>
                        {r.symbol}{r.symbol === data.ticker ? " ◀" : ""}
                      </div>
                      <div className="text-[13px] font-bold">
                        {r.available ? `${r.change_pct > 0 ? "+" : ""}${r.change_pct}%` : "n/a"}
                      </div>
                      {!r.available && (
                        <div className="text-[8px]" style={{ color: "var(--text-dim)" }}>{r.unavailable_reason}</div>)}
                    </div>
                  ))}
                </div>
              </div>
            ))}
            {data.note && <div className="text-[9px] mt-1" style={{ color: "var(--text-dim)" }}>{data.note}</div>}
          </>
        )}
      </div>
    </div>
  );
}

            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-2 mb-4">

                      <td className="px-2 py-1" style={{ color: "var(--text-mid)" }}>{r.Expiry}</td>

                      <td className="px-2 py-1" style={{ color: "var(--text-bright)" }}>{fmtNum(r.LTP)}</td>

                      <td className="px-2 py-1" style={{ color: (r.basis_pct || 0) >= 0 ? "var(--accent-green)" : "var(--accent-red)" }}>

                      <td className="px-2 py-1" style={{ color: "var(--text-mid)" }}>
                        {r.annualised_pct == null ? "n/a" : `${r.annualised_pct}%`}</td>
                      <td className="px-2 py-1" style={{ color: "var(--text-mid)" }}>{fmtNum(r.OI)}</td>
                      <td className="px-2 py-1" style={{ color: "var(--text-mid)" }}>{fmtNum(r.Volume)}</td>
