/** EA-7 measurement chain. READ-ONLY — every figure is computed server-side from
 * the position store and nothing here can size, gate or place a trade.
 *
 * The design point is that it shows what is NOT known as loudly as what is.
 * Right now the historical ledger cannot feed most of it (no trade carries both
 * a P&L and a cost; every attribution group collapses to one bucket), and a
 * panel that rendered 0.00 for those would be inventing a verdict. */
/** "Is the model actually learning?" — EA-7 calibration surface.
 *
 * Shows how the Moderator's STATED probability compares with what actually
 * happened, per band. A perfectly calibrated model sits on the diagonal.
 *
 * The empty state is the point, not an afterthought: until closed trades carry
 * a stated probability there is nothing to measure, and this says so with the
 * exact shortfall rather than drawing an encouraging-looking flat line. No
 * value is computed here — every number comes from /analytics/calibration. */
function CalibrationPanel() {
  const { data, loading, reload } = useOneShotFetch(
    `${API_BASE}/api/v1/analytics/calibration`, 30000);

  if (loading && !data)
    return <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>Loading calibration…</div>;
  if (!data) return null;
  if (data.available === false)
    return <div className="text-[11px]" style={{ color: "var(--accent-amber)" }}>{data.reason}</div>;

  const map = data.map || {};
  const active = !!data.active;
  const need = data.samples_needed_for_fit || 0;
  // 🔴 An absent count must not become a NUMBER. `undefined / n * 100` is NaN and
  // rendered "NaN%" — a fabricated-looking value on the one panel whose entire job
  // is refusing to fabricate. A partial payload (a degraded endpoint, an older
  // server) is exactly when this shows, which is exactly when it misleads.
  const scoreable = Number.isFinite(data.scoreable_trades) ? data.scoreable_trades : null;
  const minFit = Number.isFinite(data.min_fit_samples) ? data.min_fit_samples : null;
  const pct = (scoreable == null || !minFit) ? null
            : Math.min(100, Math.round((scoreable / Math.max(1, minFit)) * 100));
  const bins = (data.reliability || []).filter(b => b.n > 0);
  const over = data.overconfidence_pp;

  const statusTone = active
    ? (map.status === "TRUSTED" ? "--accent-green" : "--accent-amber")
    : "--text-dim";

  return (
    <div data-testid="calibration-panel" className="rounded-lg border p-3 mt-3"
         style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
      <div className="flex items-baseline gap-2 mb-1">
        <span className="text-[11px] font-bold uppercase tracking-wider"
              style={{ color: "var(--text-bright)" }}>Model Learning — probability calibration</span>
        <span className="px-1.5 py-0.5 rounded text-[9px] font-bold"
              style={{ background: tint(statusTone, 14), color: `var(${statusTone})` }}>
          {active ? map.status : "NOT YET ACTIVE"}
        </span>
        <button onClick={reload} className="ml-auto text-[9px] underline"
                style={{ color: "var(--text-dim)" }}>refresh</button>
      </div>

      <div className="text-[10px] mb-2" style={{ color: "var(--text-dim)" }}>
        Does a stated 70% actually win 70% of the time? Python compares every closed
        trade's stated probability with the result and corrects EV by the measured gap.
      </div>

      {/* Progress toward a fit — the honest empty state. */}
      <div className="mb-2">
        <div className="flex justify-between text-[10px] mb-0.5">
          <span style={{ color: "var(--text-dim)" }}>
            scoreable closed trades: <b style={{ color: "var(--text-bright)" }}>
              {scoreable == null ? "not reported" : scoreable}</b>
            {minFit != null && <> / {minFit} to fit</>}
            {Number.isFinite(data.trusted_fit_samples) && <> · {data.trusted_fit_samples} to trust</>}
          </span>
          <span style={{ color: "var(--text-dim)" }}>{pct == null ? "—" : pct + "%"}</span>
        </div>
        <div className="h-1.5 rounded" style={{ background: tint("--border", 80) }}>
          <div className="h-1.5 rounded" style={{
            width: `${pct}%`,
            background: active ? "var(--accent-green)" : "var(--accent-amber)" }} />
        </div>
      </div>

      {!active && (
        <div className="text-[10px] px-2 py-1 rounded mb-2"
             style={{ background: tint("--accent-amber", 10), color: "var(--accent-amber)" }}>
          Probabilities are passed to EV <b>uncorrected</b>. {map.reason}
          {need > 0 && <> — <b>{need}</b> more scoreable trade{need === 1 ? "" : "s"} needed.</>}
        </div>
      )}

      {/* Why trades could not be scored — the number that matters while thin. */}
      {data.excluded && data.excluded.total > 0 && (
        <div className="text-[10px] mb-2" style={{ color: "var(--text-dim)" }}>
          excluded {data.excluded.total}: {data.excluded.no_stated_probability} with no
          stated probability{data.excluded.no_readable_outcome
            ? `, ${data.excluded.no_readable_outcome} with unreadable P&L` : ""}
          {data.excluded.not_closed ? `, ${data.excluded.not_closed} still open` : ""}.
          {data.excluded.no_stated_probability > 0 && (
            <span> Trades opened before the probability was recorded can never be scored.</span>
          )}
        </div>
      )}

      {data.scoreable_trades > 0 && (
        <div className="grid grid-cols-3 gap-2 mb-2 text-[10px]">
          <div><div style={{ color: "var(--text-dim)" }}>mean stated</div>
            <div style={{ color: Number.isFinite(data.mean_stated) ? "var(--text-bright)" : "var(--text-dim)" }}>
              {Number.isFinite(data.mean_stated)
                ? `${(data.mean_stated * 100).toFixed(1)}%` : "n/a"}</div></div>
          <div><div style={{ color: "var(--text-dim)" }}>actually won</div>
            <div style={{ color: Number.isFinite(data.observed_rate) ? "var(--text-bright)" : "var(--text-dim)" }}>
              {Number.isFinite(data.observed_rate)
                ? `${(data.observed_rate * 100).toFixed(1)}%` : "n/a"}</div></div>
          <div><div style={{ color: "var(--text-dim)" }}>overconfidence</div>
            <div style={{ color: over == null ? "var(--text-dim)"
                          : over > 0 ? "var(--accent-red)" : "var(--accent-green)" }}>
              {over == null ? "n/a" : `${over > 0 ? "+" : ""}${over.toFixed(1)}pp`}</div></div>
        </div>
      )}

      {/* Reliability diagram: stated vs observed, per band. */}
      {bins.length > 0 ? (
        <div>
          <div className="text-[10px] mb-1" style={{ color: "var(--text-dim)" }}>
            stated band → what actually happened (bar = observed; ▎= stated)
          </div>
          {bins.map(b => (
            <div key={b.bin_low} className="flex items-center gap-2 text-[10px] mb-0.5">
              <span className="w-16" style={{ color: "var(--text-dim)" }}>
                {Math.round(b.bin_low * 100)}-{Math.round(b.bin_high * 100)}%
              </span>
              <div className="flex-1 h-3 rounded relative"
                   style={{ background: tint("--border", 70) }}>
                <div className="h-3 rounded" style={{
                  width: `${(b.observed_rate * 100).toFixed(1)}%`,
                  background: b.gap_pp > 0 ? tint("--accent-red", 55)
                                           : tint("--accent-green", 55) }} />
                <div style={{ position: "absolute", top: 0, bottom: 0,
                              left: `${(b.stated_mean * 100).toFixed(1)}%`,
                              width: 2, background: "var(--text-bright)" }} />
              </div>
              <span className="w-28 text-right" style={{
                color: b.gap_pp > 0 ? "var(--accent-red)" : "var(--accent-green)" }}>
                {b.gap_pp > 0 ? "+" : ""}{b.gap_pp}pp
              </span>
              <span className="w-20 text-right" style={{ color: "var(--text-dim)" }}>
                n={b.n}{b.thin ? " thin" : ""}{b.significant ? " ✓sig" : ""}
              </span>
            </div>
          ))}
          <div className="text-[9px] mt-1" style={{ color: "var(--text-dim)" }}>
            positive gap = model was overconfident in that band. "thin" = under 10 trades;
            "✓sig" = the 95% Wilson interval excludes the stated rate.
          </div>
        </div>
      ) : (
        <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          No reliability curve yet — it appears once closed trades carry a stated probability.
        </div>
      )}

      {Object.keys(data.by_provider || {}).length > 0 && (
        <div className="mt-2 pt-2 border-t" style={{ borderColor: tint("--border", 60) }}>
          <div className="text-[10px] mb-1" style={{ color: "var(--text-dim)" }}>
            per provider — a gemini bear and a groq bear are different forecasters
          </div>
          {Object.entries(data.by_provider).map(([name, p]) => (
            <div key={name} className="flex justify-between text-[10px]">
              <span style={{ color: "var(--text-mid)" }}>{name}</span>
              <span style={{ color: "var(--text-dim)" }}>
                n={p.n} · stated {(p.mean_stated * 100).toFixed(0)}% ·
                won {(p.observed_rate * 100).toFixed(0)}% ·
                brier {p.brier == null ? "n/a" : p.brier} · {p.map.status}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── P&L ledger + per-trade decision trail ─────────────────────────────────
// Every executed trade, and — on click — everything that led to it.
//
// 🔴 Nothing here is computed client-side. Percentages, totals and the
//    gross/friction split all arrive from /api/v1/analytics/*, because a
//    percentage is a financial value and this file's standing rule is that no
//    financial value is derived in the browser.
//
// 🔴 An absent number renders "n/a", never 0. A closed trade whose P&L could
//    not be read is flagged UNRESOLVED and excluded from every total — an
//    unknown loss reading as no loss is the daily_pnl_summary defect that fed
//    the kill guard.

const _money = v => v == null ? "n/a" : (v < 0 ? "-" : "") + "₹" + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const _pct = v => v == null ? "n/a" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const _tone = v => v == null ? "var(--text-dim)" : v > 0 ? "var(--accent-green)" : v < 0 ? "var(--accent-red)" : "var(--text-mid)";

function PnlTile({ label, value, sub, tone }) {
  return (
    <div className="rounded-lg border p-3" style={{ borderColor: "var(--border)", background: "var(--bg-secondary)" }}>
      <div className="text-[10px] uppercase tracking-wider" style={{ color: "var(--text-dim)" }}>{label}</div>
      <div className="text-[19px] font-bold mt-1" style={{ color: tone || "var(--text-bright)" }}>{value}</div>
      {sub && <div className="text-[10px] mt-1" style={{ color: "var(--text-dim)" }}>{sub}</div>}
    </div>
  );
}

function TrailStageCard({ name, data, kind }) {
  const [open, setOpen] = useState(false);
  const label = {
    sentinel: "1 · Shortlist (Sentinel)", research: "2 · Research",
    bull: "3 · Bull analyst", bear: "4 · Bear analyst",
    moderator: "5 · Moderator verdict", simulation: "6 · Monte Carlo",
    levels: "7 · Levels", risk: "8 · Risk (7 checks)",
    portfolio: "9 · Portfolio", execution: "10 · Fill",
  }[name] || name;
  const compute = ["sentinel", "simulation", "risk", "portfolio", "execution", "levels"].includes(name)
    ? "🔒 PYTHON" : name === "moderator" ? "🔒🧠 MIXED" : "🧠 LLM";
  return (
    <div className="rounded border" style={{ borderColor: "var(--border)" }}>
      <button onClick={() => setOpen(o => !o)}
              className="w-full flex items-center justify-between px-3 py-2 text-left">
        <span className="text-[11px] font-semibold">{label}</span>
        <span className="flex items-center gap-2">
          <span className="text-[9px] px-1.5 py-0.5 rounded" style={{ color: "var(--text-dim)", background: tint("--border", 40) }}>{compute}</span>
          <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>{open ? "▾" : "▸"}</span>
        </span>
      </button>
      {open && (
        <pre className="text-[10px] px-3 pb-2 overflow-x-auto whitespace-pre-wrap"
             style={{ color: "var(--text-mid)" }}>{JSON.stringify(data, null, 1)}</pre>
      )}
    </div>
  );
}

function TradeDrilldown({ tradeId, onClose }) {
  const { data, loading } = useOneShotFetch(
    tradeId ? `${API_BASE}/api/v1/analytics/trade/${encodeURIComponent(tradeId)}` : null);
  if (!tradeId) return null;
  const t = data && data.trade, tr = data && data.trail, o = data && data.outcome;
  const prov = (data && data.provenance) || {};
  const dp = prov.decision_provenance || {};

  return (
    <div className="fixed inset-0 z-40 flex items-start justify-center overflow-auto py-8"
         style={{ background: "var(--scrim)" }} onClick={onClose} data-testid="pnl-drilldown">
      <div className="rounded-lg border w-[min(1100px,94vw)]" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}
           onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: "var(--border)" }}>
          <div className="flex items-baseline gap-3">
            <span className="text-[15px] font-bold">{t ? t.ticker : "…"}</span>
            {t && <span className="text-[10px] font-mono" style={{ color: "var(--text-dim)" }}>{t.trade_id}</span>}
            {t && <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: "var(--accent-blue)", background: tint("--accent-blue", 14) }}>{t.trade_class}</span>}
            {t && t.selection_mode === "EXPLORATION" && (
              <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: "var(--accent-amber, #ffb74d)", background: tint("--accent-amber", 14) }}>EXPL</span>
            )}
          </div>
          <button onClick={onClose} className="text-[12px] px-2" style={{ color: "var(--text-dim)" }}>✕</button>
        </div>

        <div className="p-4 space-y-3">
          {loading && !data && <div className="text-[12px]" style={{ color: "var(--text-dim)" }}>Loading…</div>}

          {t && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <PnlTile label="P&L" value={_money(t.pnl)} tone={_tone(t.pnl)} sub={t.pnl_pct == null ? "n/a" : _pct(t.pnl_pct)} />
              <PnlTile label="entry → exit" value={`${t.entry_effective ?? "n/a"} → ${(t.close_price ?? t.last_ltp) ?? "n/a"}`} sub={t.status} />
              <PnlTile label="size / invested" value={t.position_size ?? "n/a"} sub={_money(t.invested)} />
              <PnlTile label="slippage" value={_money(t.slippage_cost)} sub={t.close_reason || (t.status === "OPEN" ? "still open" : "")} />
            </div>
          )}

          {/* WHY it made or lost money — decomposed, not asserted */}
          {o && (
            <div className="rounded-lg border p-3" style={{ borderColor: "var(--border)" }}>
              <div className="text-[11px] font-bold mb-2">Why this trade made / lost money</div>
              {!o.resolved ? (
                <div className="text-[11px]" style={{ color: "var(--accent-amber, #ffb74d)" }}>⚠ {o.reason}</div>
              ) : (
                <>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-[11px]">
                    <div><div style={{ color: "var(--text-dim)" }}>gross (before friction)</div><div className="font-mono" style={{ color: _tone(o.gross_pnl) }}>{_money(o.gross_pnl)}</div></div>
                    <div><div style={{ color: "var(--text-dim)" }}>entry friction</div><div className="font-mono">{_money(o.friction)}</div></div>
                    <div><div style={{ color: "var(--text-dim)" }}>net</div><div className="font-mono" style={{ color: _tone(o.net_pnl) }}>{_money(o.net_pnl)}</div></div>
                    <div><div style={{ color: "var(--text-dim)" }}>price move</div><div className="font-mono">{o.price_move_pct == null ? "n/a" : _pct(o.price_move_pct)}</div></div>
                  </div>
                  {o.verdict && <div className="text-[11px] mt-2" style={{ color: "var(--text-mid)" }}>{o.verdict}.</div>}
                  {o.friction_pct_of_gross != null && (
                    <div className="text-[10px] mt-1" style={{ color: "var(--text-dim)" }}>
                      Friction was {o.friction_pct_of_gross.toFixed(1)}% of the gross move.
                    </div>
                  )}
                  {o.base_rate && (
                    <div className="text-[10px] mt-2 p-2 rounded" style={{ background: tint("--border", 30), color: "var(--text-dim)" }}>
                      Monte Carlo before the trade: P(target) {(o.base_rate.p_target * 100).toFixed(1)}%,
                      P(stop) {(o.base_rate.p_stop * 100).toFixed(1)}%,
                      required edge {o.base_rate.required_edge_pp}pp, model risk {o.base_rate.model_risk}.
                      <br />ⓘ {o.base_rate.note}
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          {/* The committee's own numbers survive even when the journal does not */}
          {dp && dp.probability_raw != null && (
            <div className="rounded-lg border p-3" style={{ borderColor: "var(--border)" }}>
              <div className="text-[11px] font-bold mb-2">Committee decision record</div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-[11px]">
                <div><div style={{ color: "var(--text-dim)" }}>stated probability</div><div className="font-mono">{dp.probability_raw}%</div></div>
                <div><div style={{ color: "var(--text-dim)" }}>EV</div><div className="font-mono">{dp.ev}</div></div>
                <div><div style={{ color: "var(--text-dim)" }}>recommendation</div><div className="font-mono">{dp.recommendation}</div></div>
                <div><div style={{ color: "var(--text-dim)" }}>bull / bear / mod</div><div className="font-mono">{dp.bull_confidence}/{dp.bear_confidence}/{dp.moderator_confidence}</div></div>
              </div>
              {dp.providers && (
                <div className="text-[10px] mt-2" style={{ color: "var(--text-dim)" }}>
                  seats: bull {dp.providers.bull} · bear {dp.providers.bear} · moderator {dp.providers.moderator}
                  {dp.prompt_sources && ` · prompts ${Object.values(dp.prompt_sources).join(" / ")}`}
                </div>
              )}
              {dp.calibration && !dp.calibration.applied && (
                <div className="text-[10px] mt-1" style={{ color: "var(--text-dim)" }}>
                  ⓘ probability passed to EV UNCORRECTED — {dp.calibration.reason}
                </div>
              )}
              {prov.committee_verdict && (
                <div className="text-[10px] mt-2 italic p-2 rounded" style={{ background: tint("--accent-amber", 6), color: "var(--text-mid)", borderLeft: "2px solid var(--accent-amber, #ffb74d)" }}>
                  {prov.committee_verdict}
                </div>
              )}
            </div>
          )}

          {/* The chain */}
          {tr && (
            <div className="rounded-lg border p-3 space-y-1.5" style={{ borderColor: "var(--border)" }}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-[11px] font-bold">Decision trail</span>
                {tr.chain_kind && <span className="text-[9px] px-1.5 py-0.5 rounded" style={{ color: "var(--text-dim)", background: tint("--border", 40) }}>{tr.chain_kind}</span>}
              </div>
              {!tr.trail_available ? (
                // 🔴 The reason is the content. An empty panel with no
                // explanation reads as a bug; a nearest-match trail would be
                // worse — it would read as this trade's reasoning.
                <div className="text-[11px] p-2 rounded" style={{ color: "var(--accent-amber, #ffb74d)", background: tint("--accent-amber", 8) }}>
                  ⚠ Decision trail unavailable — {tr.trail_reason}
                </div>
              ) : (
                <>
                  {tr.stages_present.map(s => <TrailStageCard key={s} name={s} data={tr.stages[s]} kind={tr.chain_kind} />)}
                  {tr.stages_absent.length > 0 && (
                    <div className="text-[10px] pt-1" style={{ color: "var(--text-dim)" }}>
                      not recorded for this attempt: {tr.stages_absent.join(", ")}
                      {tr.chain_kind === "RULE_BASED" && " — a rule-based intraday fill has no committee debate; that is a different chain, not a missing one"}
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PnlTab() {
  const [sel, setSel] = useState(null);
  const [statusF, setStatusF] = useState("");
  const { data, loading, reload } = useOneShotFetch(
    `${API_BASE}/api/v1/analytics/pnl?limit=400${statusF ? `&status=${statusF}` : ""}`, 15000);

  const s = (data && data.summary) || {};
  const rows = (data && data.rows) || [];
  const groups = (data && data.groups) || {};
  const cov = (data && data.trail_coverage) || {};

  return (
    <div className="space-y-3" data-testid="pnl-tab">
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <PnlTile label="realised P&L" value={_money(s.realised_pnl)} tone={_tone(s.realised_pnl)}
                 sub={s.closed_scored != null ? `${s.closed_scored} closed & scored` : null} />
        <PnlTile label="unrealised P&L" value={_money(s.unrealised_pnl)} tone={_tone(s.unrealised_pnl)}
                 sub={`${s.open ?? 0} open`} />
        <PnlTile label="win rate" value={s.win_rate_pct == null ? "n/a" : s.win_rate_pct.toFixed(1) + "%"}
                 sub={s.win_rate_pct == null ? s.win_rate_reason : `${s.wins}W / ${s.losses}L`} />
        <PnlTile label="gross win / loss" value={_money(s.gross_win)} sub={_money(s.gross_loss)} />
        <PnlTile label="total slippage" value={_money(s.total_slippage)} sub="entry-side only (EA-8 open)" />
      </div>

      {s.unresolved_note && (
        <div className="text-[10px] p-2 rounded" style={{ color: "var(--accent-amber, #ffb74d)", background: tint("--accent-amber", 8) }}>
          ⚠ {s.unresolved_note}
        </div>
      )}
      {cov.without_trail > 0 && (
        <div className="text-[10px] p-2 rounded" style={{ color: "var(--text-dim)", background: tint("--border", 25) }}>
          ⓘ {!Number.isFinite(cov.with_trail) || !Number.isFinite(cov.without_trail)
              ? "Decision-trail coverage not reported."
              : `${cov.with_trail} of ${cov.with_trail + cov.without_trail} trades carry a decision trail.`} {cov.note}
        </div>
      )}

      {/* Populations kept apart — pooling EXPLORATION with POLICY makes every
          figure describe a strategy nobody would run. */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        {[["by_selection_mode", "By selection mode"], ["by_class", "By trade class"]].map(([k, title]) => (
          <div key={k} className="rounded-lg border p-3" style={{ borderColor: "var(--border)" }}>
            <div className="text-[11px] font-bold mb-2">{title}</div>
            <table className="w-full text-[11px]">
              <thead><tr style={{ color: "var(--text-dim)" }}>
                <th className="text-left font-normal">group</th><th className="text-right font-normal">n</th>
                <th className="text-right font-normal">realised</th><th className="text-right font-normal">win%</th>
              </tr></thead>
              <tbody>
                {Object.entries(groups[k] || {}).map(([g, v]) => (
                  <tr key={g}>
                    <td className="py-0.5">{g}</td>
                    <td className="text-right font-mono">{v.trades_total}</td>
                    <td className="text-right font-mono" style={{ color: _tone(v.realised_pnl) }}>{_money(v.realised_pnl)}</td>
                    <td className="text-right font-mono">{v.win_rate_pct == null ? "n/a" : v.win_rate_pct.toFixed(0) + "%"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ))}
      </div>

      <div className="flex items-center gap-2">
        {[["", "all"], ["OPEN", "open"], ["CLOSED", "closed"]].map(([v, l]) => (
          <button key={l} onClick={() => setStatusF(v)}
                  className="px-2 py-1 rounded text-[10px] uppercase tracking-wider border"
                  style={{ borderColor: statusF === v ? "var(--accent-blue)" : "var(--border)",
                           color: statusF === v ? "var(--accent-blue)" : "var(--text-mid)" }}>{l}</button>
        ))}
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          {/* `data` being present does not mean `rows_total` is: the ternary
              guarded the WRAPPER, not the field, so a payload without it
              rendered "0 of undefined". */}
          {loading ? "loading…"
            : `${rows.length} of ${Number.isFinite(data && data.rows_total) ? data.rows_total : rows.length}`
              + " — click a row for its full decision trail"}
        </span>
      </div>

      <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)" }}>
        <table className="w-full text-[11px]" data-testid="pnl-table">
          <thead><tr style={{ color: "var(--text-dim)" }}>
            {["date", "ticker", "class", "mode", "side", "qty", "entry", "exit", "P&L", "P&L %", "trail"].map(h => (
              <th key={h} className={`font-normal py-1.5 px-2 ${["qty", "entry", "exit", "P&L", "P&L %"].includes(h) ? "text-right" : "text-left"}`}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.trade_id} onClick={() => setSel(r.trade_id)}
                  className="cursor-pointer border-t" style={{ borderColor: tint("--border", 50) }}>
                <td className="py-1.5 px-2 font-mono" style={{ color: "var(--text-dim)" }}>{r.open_date || "—"}</td>
                <td className="px-2 font-semibold">{r.ticker}</td>
                <td className="px-2">{r.trade_class || "—"}</td>
                <td className="px-2" style={{ color: r.selection_mode === "EXPLORATION" ? "var(--accent-amber, #ffb74d)" : "var(--text-mid)" }}>{r.selection_mode || "—"}</td>
                <td className="px-2">{r.direction || "—"}</td>
                <td className="px-2 text-right font-mono">{r.position_size ?? "n/a"}</td>
                <td className="px-2 text-right font-mono">{r.entry_effective ?? "n/a"}</td>
                <td className="px-2 text-right font-mono">{(r.close_price ?? r.last_ltp) ?? "n/a"}</td>
                <td className="px-2 text-right font-mono" style={{ color: _tone(r.pnl) }}>
                  {r.pnl_unresolved ? "UNRESOLVED" : _money(r.pnl)}
                </td>
                <td className="px-2 text-right font-mono" style={{ color: _tone(r.pnl) }}>{r.pnl_pct == null ? "n/a" : _pct(r.pnl_pct)}</td>
                <td className="px-2" style={{ color: r.trail_available ? "var(--accent-green)" : "var(--text-dim)" }}>{r.trail_available ? "✓" : "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {!rows.length && !loading && (
          <div className="text-[11px] p-4 text-center" style={{ color: "var(--text-dim)" }}>No trades match this filter.</div>
        )}
      </div>

      <TradeDrilldown tradeId={sel} onClose={() => setSel(null)} />
    </div>
  );
}

// ── Analytics: the measurement console ──────────────────────────────────────
//
// EA-7's discipline is "a verdict you can REPRODUCE" — replay.py carries as_of,
// window and an input fingerprint for exactly that reason. The fingerprint was a 9px
// grey chip at the end of a row of controls. It is now part of the header, beside
// the scope and the sample size, because a figure from this tab is meaningless
// without them: quoting one without its fingerprint is how two people end up arguing
// about different ledgers.
//
// Every data read below is unchanged. PnlTab and CalibrationPanel are untouched.

function StatLine({ label, value, note, tone }) {
  return (
    <div className="flex justify-between items-baseline py-[3px]"
         style={{ borderBottom: "1px solid var(--hair-soft)" }}>
      <span style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>{label}</span>
      <span className="text-right">
        <span className="num" style={{ fontSize: "var(--t-small)",
              color: value == null ? "var(--text-dim)"
                                   : (DECK_TONE_COLOR[tone] || "var(--text-bright)") }}>
          {value == null ? "n/a" : value}

}

// A panel that cannot compute says WHY, in its own body. An empty card and a

}

/** LLM strategy commentary. Same contract as DD-13b's AI tab: user-triggered,
 * submit-then-poll, commentary visually separated, and the model is explicitly
 * told NOT to output levels — those come from SignalsSection, computed. */
function StrategySection({ ticker }) {
  const [state, setState] = useState("idle");
  const [facts, setFacts] = useState(null);
  const [text, setText] = useState("");
  const [err, setErr] = useState(null);
  const pollRef = useRef(null);

  useEffect(() => {
    setState("idle"); setFacts(null); setText(""); setErr(null);
    if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
  }, [ticker]);
  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const run = () => {
    if (!ticker) return;
    setState("pending"); setText(""); setErr(null);
    fetch(`${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/strategy`, { method: "POST" })
      .then(r => r.ok ? r.json() : r.json().then(j => { throw new Error(j.detail || "HTTP " + r.status); }))
      .then(j => {
        setFacts(j.facts_given || null);
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(() => {
          fetch(`${API_BASE}/api/ai/result/${encodeURIComponent(j.prompt_id)}`)
            .then(r => r.json())
            .then(res => {
              if (res.response) setText(res.response);
              if (res.status === "done" || res.status === "complete") {
                setState("done"); clearInterval(pollRef.current); pollRef.current = null;
              } else if (res.error) {
                setErr(res.error); setState("error");
                clearInterval(pollRef.current); pollRef.current = null;
              }
            }).catch(() => {});
        }, 1500);
      })
      .catch(e => { setErr(String(e.message || e)); setState("error"); });
  };

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <span className="px-1.5 py-0.5 rounded text-[9px] font-bold border"
              style={{ color: "var(--accent-amber)", borderColor: "var(--accent-amber)",
                       background: tint("--accent-amber", 12) }}>🧠 LLM COMMENTARY</span>
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          no price levels &mdash; those are computed on the Signals tab
        </span>
        <button onClick={run} disabled={state === "pending"} data-testid="strategy-run"
          className="ml-auto px-3 py-1 rounded border text-[10px] font-bold uppercase tracking-wider"
          style={{ background: state === "pending" ? "var(--bg-secondary)" : tint("--accent-blue", 14),
                   borderColor: "var(--accent-blue)",
                   color: state === "pending" ? "var(--text-dim)" : "var(--accent-blue)" }}>
          {state === "pending" ? "Thinking…" : "Run strategy note"}
        </button>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="strategy">
        {state === "idle" && (
          <div className="text-[12px]" style={{ color: "var(--text-dim)" }}>
            No strategy note requested. Runs only when you ask.
          </div>
        )}
        {state === "error" && <div className="text-[11px]" style={{ color: "var(--accent-red)" }}>Failed: {err}</div>}
        {facts && (
          <div className="mb-3 rounded-lg border p-3" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{ color: "var(--text-mid)" }}>
              Computed facts given to the model
            </div>
            <div className="text-[10px]" style={{ color: "var(--text-bright)" }}>{facts}</div>
          </div>
        )}
        {(state === "pending" || text) && (
          <div className="rounded-lg p-3" data-testid="strategy-text"
               style={{ background: tint("--accent-amber", 6), borderLeft: "3px solid var(--accent-amber)" }}>
            <div className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{ color: "var(--accent-amber)" }}>
              🧠 Model commentary &mdash; not a computed value
            </div>
            <div className="text-[12px] whitespace-pre-wrap" style={{ color: "var(--text-bright)", fontStyle: "italic" }}>
              {text || "Waiting for the model…"}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const REGIME_COLOR = { Trending: "var(--accent-green)", Ranging: "var(--accent-amber)",

  const dist = data.distribution_pct || {};

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="market-regime">
        {/* SAFETY CONTROL, not styling. agents/regime_detector.py produces a

            while sizing a position is the dangerous outcome the sprint names. */}

             style={{ background: tint("--accent-blue", 10), color: "var(--accent-blue)" }}>
          <b>Per-ticker price regime</b> (HMM over this stock&rsquo;s own bars). This is
          <b> not</b> the macro market regime used for position sizing

          may disagree.

        {!data.available ? (

            <div className="mt-1 text-[10px]" style={{ color: col }}>
              Latest: {data.state_label}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/** AI commentary. Three explicit states (idle -> pending -> result) because
 * this is the only tab whose latency is seconds.
 *
 * USER-TRIGGERED ONLY — nothing fires on mount. Auto-fetching would bill an LLM
 * call every time someone browsed a ticker.
 *
 * The output is rendered as clearly-marked COMMENTARY, visually separated from
 * computed values, and the exact Python-computed facts the model was given are
 * shown beside it. That is a safety control: a hallucinated sentence must never
 * be mistakable for a metric (CLAUDE.md rule 1). */
function AiAnalysisSection({ ticker }) {
  const [state, setState] = useState("idle");   // idle | pending | done | error
  const [facts, setFacts] = useState(null);
  const [text, setText] = useState("");
  const [err, setErr] = useState(null);
  const [routed, setRouted] = useState(null);   // {provider, model} actually used
  const pollRef = useRef(null);

  // Which provider runs THIS task. Read from — and written back to — the SAME
  // provider_overrides.json every other task uses, via the existing
  // GET/PUT /api/v1/providers. No second settings store and no parallel key
  // path: keys stay in quantnexus_keys.json, routing stays in ModelRouter.
  const TASK = "stock_ai_synthesis";
  const providers = useOneShotFetch(`${API_BASE}/api/v1/providers`);
  // GET returns the map under `routing`; PUT accepts it as `overrides`. Same
  // file either way — asymmetric names, so read and write are not symmetric.
  const current = (providers.data && providers.data.routing
                   && providers.data.routing[TASK]) || "";

  const setProvider = (p) => {
    fetch(`${API_BASE}/api/v1/providers`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ overrides: { [TASK]: p } }),
    }).then(() => providers.reload()).catch(() => {});
  };

  useEffect(() => {
    // Reset when the ticker changes; still no automatic call.
    setState("idle"); setFacts(null); setText(""); setErr(null);
    if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
  }, [ticker]);

  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const run = () => {
    if (!ticker) return;
    setState("pending"); setText(""); setErr(null);
    fetch(`${API_BASE}/api/v1/stock/${encodeURIComponent(ticker)}/candles/ai-analysis`,
          { method: "POST" })
      .then(r => r.ok ? r.json() : r.json().then(j => { throw new Error(j.detail || "HTTP " + r.status); }))
      .then(j => {
        setFacts(j.facts_given || null);
        // Reported BY THE SERVER, not assumed by the UI - so switching the
        // dropdown is verifiable rather than taken on trust.
        setRouted({ provider: j.provider, model: j.model });
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(() => {
          fetch(`${API_BASE}/api/ai/result/${encodeURIComponent(j.prompt_id)}`)
            .then(r => r.json())
            .then(res => {
              if (res.response) setText(res.response);
              if (res.status === "done" || res.status === "complete") {
                setState("done"); clearInterval(pollRef.current); pollRef.current = null;
              } else if (res.error) {
                setErr(res.error); setState("error");
                clearInterval(pollRef.current); pollRef.current = null;
              }
            })
            .catch(() => {});
        }, 1500);
      })
      .catch(e => { setErr(String(e.message || e)); setState("error"); });
  };

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        {/* Provider selector for THIS task. Writes the same
            provider_overrides.json key the Streamlit Provider Routing panel
            edits — one routing system, two front doors. */}
        <select value={current} onChange={e => setProvider(e.target.value)}
                aria-label="ai synthesis provider" data-testid="ai-provider"
                className="px-2 py-0.5 rounded border text-[10px] outline-none"
                style={{ background: "var(--bg-primary)", borderColor: "var(--border)",
                         color: "var(--text-bright)" }}>
          <option value="">route default (qwen)</option>
          <option value="groq">Groq</option>
          <option value="gemini">Gemini</option>
          <option value="nvidia">NVIDIA</option>
          <option value="qwen">Qwen (local)</option>
        </select>
        {routed && (
          <span className="text-[9px] px-1.5 py-0.5 rounded border" data-testid="ai-routed"
                title="Reported by the server for the last run — not assumed by the UI"
                style={{ borderColor: "var(--accent-blue)", color: "var(--accent-blue)" }}>
            ran on {routed.provider}{routed.model ? ` · ${routed.model}` : ""}
          </span>)}
        <span className="px-1.5 py-0.5 rounded text-[9px] font-bold border"
              style={{ color: "var(--accent-amber)", borderColor: "var(--accent-amber)",
                       background: tint("--accent-amber", 12) }}>
          🧠 LLM COMMENTARY
        </span>
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          interpretation only &mdash; every figure is computed in Python first
        </span>
        <button onClick={run} disabled={state === "pending"} data-testid="ai-run"
          className="ml-auto px-3 py-1 rounded border text-[10px] font-bold uppercase tracking-wider"
          style={{ background: state === "pending" ? "var(--bg-secondary)" : tint("--accent-blue", 14),
                   borderColor: "var(--accent-blue)",
                   color: state === "pending" ? "var(--text-dim)" : "var(--accent-blue)" }}>
          {state === "pending" ? "Analysing…" : "Run AI analysis"}
        </button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="ai-analysis">
        {state === "idle" && (
          <div className="text-[12px]" style={{ color: "var(--text-dim)" }}>
            No analysis requested. This is the only tab that costs an LLM call, so it runs
            only when you ask.
          </div>
        )}
        {state === "error" && (
          <div className="text-[11px]" style={{ color: "var(--accent-red)" }}>AI analysis failed: {err}</div>
        )}
        {facts && (
          <div className="mb-3 rounded-lg border p-3"
               style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{ color: "var(--text-mid)" }}>
              Computed facts given to the model
            </div>
            <div className="text-[10px]" style={{ color: "var(--text-bright)" }}>{facts}</div>
          </div>
        )}
        {(state === "pending" || text) && (
          // Deliberately distinct from every metric surface on this page: amber
          // left rule, italic, and labelled commentary.
          <div className="rounded-lg p-3" data-testid="ai-text"
               style={{ background: tint("--accent-amber", 6),
                        borderLeft: "3px solid var(--accent-amber)" }}>
            <div className="text-[10px] font-bold uppercase tracking-wide mb-1" style={{ color: "var(--accent-amber)" }}>
              🧠 Model commentary &mdash; not a computed value
            </div>
            <div className="text-[12px] whitespace-pre-wrap" style={{ color: "var(--text-bright)", fontStyle: "italic" }}>
              {text || "Waiting for the model…"}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Candlestick sub-tab 3: Volume & Risk (Sprint DD-13a) ─────────────────
// Volume profile, VWAP, HV, GARCH(1,1) forecast and S/R levels.
//
// GARCH is the expensive part (cold fit ~1.3s, warm ~0.06s) and is cached
// server-side per (ticker, trading date). The cache hit carries its OWN as_of
// and a `cached` flag, and both are surfaced here — a cached risk number must
// never imply it was just computed (DATA-INTEGRITY §3).

function VolumeRiskSection({ ticker }) {
  const { data, error, loading, reload, source, sourceDetail, asOf } =
    useTickerFetch("candles/volume-risk", null, ticker);

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Computing volume profile &amp; GARCH…</div>;
  if (error) return <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>Could not load volume/risk: {error}</div>;
  if (!data) return null;
  if (!data.available) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>No volume/risk data for {ticker}.</div>;

  const g = data.garch || {};
  const va = data.value_area || {};
  const vp = data.volume_profile || [];
  const sr = data.sr_levels || [];
  const maxVol = Math.max(1, ...vp.map(b => b.volume || 0));
  const hasGarch = g.vol_annual !== null && g.vol_annual !== undefined;

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <SourceBadge source={source} detail={sourceDetail} />
        <AsOfBadge asOf={asOf} />
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          {data.bars} bars
        </span>
        <button onClick={reload} className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="volume-risk">
        {/* GARCH provenance stated in words. `cached` + its own as_of, so a
            stale volatility forecast cannot pass as freshly fitted. */}
        <div className="mb-3 px-2 py-1 rounded text-[10px]"
             style={{ background: tint(hasGarch ? "--accent-blue" : "--accent-amber", 10),
                      color: hasGarch ? "var(--accent-blue)" : "var(--accent-amber)" }}>
          {hasGarch
            ? <>Volatility model: <b>{g.source}</b>{g.cached ? " · served from cache" : " · fitted now"}
                {g.as_of && <> · computed <AsOfBadge asOf={g.as_of} /></>}</>
            : <>Volatility forecast unavailable — {g.source || "no model"}. Risk levels below are not shown rather than guessed.</>}
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-2 mb-4">
          <StatTile label="GARCH vol (ann)" value={hasGarch ? fmtNum(g.vol_annual) + "%" : null} tone="warn" />
          <StatTile label="ATR (ann)" value={data.atr_annual_pct === null ? null : fmtNum(data.atr_annual_pct) + "%"} />
          <StatTile label="Hist vol (ann)" value={data.hv_annual_pct === null ? null : fmtNum(data.hv_annual_pct) + "%"} />
          <StatTile label="VWAP" value={data.vwap === null ? null : "₹" + fmtNum(data.vwap)} tone="info" />
          <StatTile label="POC" value={va.available ? "₹" + fmtNum(va.poc) : null} sub="most-traded price" />
          <StatTile label="Value area high" value={va.available ? "₹" + fmtNum(va.vah) : null} tone="bearish" />
          <StatTile label="Value area low" value={va.available ? "₹" + fmtNum(va.val) : null} tone="bullish" />
        </div>

        <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>
          Risk levels from the volatility forecast
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4" data-testid="risk-levels">
          <StatTile label="Stop (tight, 1.5σ)" value={g.sl_tight === null || g.sl_tight === undefined ? null : "₹" + fmtNum(g.sl_tight)} tone="bearish" />
          <StatTile label="Stop (safe, 2.5σ)" value={g.sl_safe === null || g.sl_safe === undefined ? null : "₹" + fmtNum(g.sl_safe)} tone="bearish" />
          <StatTile label="Target 1R (1.5σ)" value={g.target_1r === null || g.target_1r === undefined ? null : "₹" + fmtNum(g.target_1r)} tone="bullish" />
          <StatTile label="Target 2R (3.0σ)" value={g.target_2r === null || g.target_2r === undefined ? null : "₹" + fmtNum(g.target_2r)} tone="bullish" />
        </div>

        <div className="grid grid-cols-1 xl:grid-cols-2 gap-3">
          <div className="rounded-lg border p-3" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>
              Volume Profile
              <span className="ml-2 font-normal normal-case" style={{ color: "var(--text-dim)" }}>POC / value area highlighted</span>
            </div>
            <div data-testid="vap-bars">
              {vp.slice().reverse().map((b, i) => (
                <div key={i} className="flex items-center gap-2" style={{ height: 9 }}>
                  <span className="text-[8px] w-14 shrink-0 text-right" style={{ color: "var(--text-dim)" }}>
                    {fmtNum(b.price, 0)}
                  </span>
                  {/* Presentational width scaling of a server value — the
                      DistanceBar precedent. No arithmetic on a traded number. */}
                  <div style={{
                    height: 6,
                    width: Math.max(1, (b.volume / maxVol) * 100) + "%",
                    background: b.is_poc ? "var(--accent-amber)"
                              : (b.is_vah || b.is_val) ? "var(--accent-blue)"
                              : tint("--text-bright", 25),
                  }} />
                </div>
              ))}
            </div>
          </div>

          <div className="rounded-lg border p-3" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>
              Support / Resistance
            </div>
            {sr.length === 0 ? (
              <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>No clustered levels found.</div>
            ) : (
              <table className="w-full text-[11px]" data-testid="sr-table">
                <thead><tr style={{ color: "var(--text-dim)" }}>
                  {["Level","Type","Touches"].map(h => <th key={h} className="px-2 py-1 text-left font-semibold">{h}</th>)}
                </tr></thead>
                <tbody>
                  {sr.map((l, i) => (
                    <tr key={i}>
                      <td className="px-2 py-1" style={{ color: "var(--text-bright)" }}>₹{fmtNum(l.price)}</td>
                      <td className="px-2 py-1" style={{
                        color: l.type === "Support" ? "var(--accent-green)"
                             : l.type === "Resistance" ? "var(--accent-red)" : "var(--accent-blue)" }}>
                        {l.type}
                      </td>
                      <td className="px-2 py-1" style={{ color: "var(--text-mid)" }}>{l.touches}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Candlestick sub-tab 2: Pattern Win-Rates (Sprint DD-12b) ─────────────
// The most decision-relevant screen in the app: these win rates influence trade
// selection. Two honesty rules are carried in the payload and rendered here:
//   * a cell is unavailable by SAMPLE COUNT, never by value — so a real 0% win
//     rate shows as "0.0%", not as "—". Streamlit's `if _wr_a else "—"` is a
//     truthiness test on a number and hides exactly that case.
//   * when corporate-event dates are unavailable the normal/event split is
//     withheld, never defaulted to "all normal days".
// Sample size is shown next to every rate, and thin samples are marked.

function WinRateCell({ cell }) {
  if (!cell || !cell.available) {
    return <span style={{ color: "var(--text-dim)" }}>n/a</span>;
  }
  // The raw rate is shown plainly, but its COLOUR comes from the edge: a high
  // rate against a higher baseline is not a good signal. MAHABANK's Inside Bar
  // is 83.9% with a -9.4pp edge; colouring by the rate would paint it green.
  const e = cell.edge_pp;
  const tone = (e === null || e === undefined) ? "neutral"
             : e > 0 ? "bullish" : e < 0 ? "bearish" : "neutral";
  return (
    <span>
      <span style={{ color: DECK_TONE_COLOR[tone] }}>{fmtNum(cell.win_pct, 1)}%</span>
      <span className="ml-1 text-[9px]" style={{ color: "var(--text-dim)" }}>n={cell.n}</span>
    </span>
  );
}

/** Edge = win rate - baseline. This is the column that actually carries
 * information; the raw rate alone does not. `significant` is true only when the
 * 95% Wilson interval excludes the baseline, so a 100%-on-3 reads as
 * inconclusive rather than as a +45pp edge. */
function EdgeCell({ cell }) {
  if (!cell || !cell.available || cell.edge_pp === null || cell.edge_pp === undefined) {
    return <span style={{ color: "var(--text-dim)" }}>n/a</span>;
  }
  const e = cell.edge_pp;
  const col = e > 0 ? "var(--accent-green)" : e < 0 ? "var(--accent-red)" : "var(--text-mid)";
  return (
    <span>
      <span style={{ color: col, fontWeight: cell.significant ? 700 : 400 }}>
        {e >= 0 ? "+" : ""}{fmtNum(e, 1)}pp
      </span>
      {cell.significant
        ? <span className="ml-1 text-[9px]" style={{ color: col }}>sig</span>
        : <span className="ml-1 text-[9px]" style={{ color: "var(--text-dim)" }}>ns</span>}
      {cell.ci_low !== null && cell.ci_low !== undefined && (
        <span className="ml-1 text-[9px]" style={{ color: "var(--text-dim)" }}>
          CI {fmtNum(cell.ci_low, 0)}-{fmtNum(cell.ci_high, 0)}
        </span>
      )}
    </span>
  );
}

function PatternWinRateSection({ ticker }) {
  const { data, error, loading, reload, source, sourceDetail, asOf } =
    useTickerFetch("candles/patterns", null, ticker);

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Scanning pattern history…</div>;
  if (error) return <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>Could not load win-rates: {error}</div>;
  if (!data) return null;

  if (!data.available) {
    return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>
      Pattern win-rates unavailable{data.reason ? ` — ${data.reason}` : ""}.
    </div>;
  }

  const pats = data.patterns || [];
  const maxAbsEdge = Math.max(1, ...pats
    .filter(p => p.all.available && p.all.edge_pp !== null)
    .map(p => Math.abs(p.all.edge_pp)));

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <SourceBadge source={source} detail={sourceDetail} />
        <AsOfBadge asOf={asOf} />
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          {data.total_occurrences} occurrences over {data.bars_scanned} bars
          {data.events_known ? ` · ${data.event_day_count} event days` : ""}
        </span>
        <button onClick={reload} className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="pattern-winrates">
        {!data.events_known && (
          <div className="mb-3 px-2 py-1 rounded text-[10px]"
               style={{ background: tint("--accent-amber", 10), color: "var(--accent-amber)" }}>
            {data.event_note} Occurrences are NOT being counted as normal days.
          </div>
        )}
        {data.baselines && (
          <div className="mb-3 px-2 py-1 rounded text-[10px]"
               style={{ background: tint("--accent-blue", 10), color: "var(--accent-blue)" }}>
            Baseline over {data.baselines.n_windows} five-day windows &mdash; up {data.baselines.up}%,
            down {data.baselines.down}%, moved&gt;0.3% {data.baselines.moved}%.
            <b> Edge = win rate &minus; baseline</b>; a rate below its baseline is worse than
            doing nothing. &ldquo;sig&rdquo; means the 95% interval excludes the baseline &mdash;
            most rows will not be.
          </div>
        )}
        {pats.some(p => p.low_sample) && (
          <div className="mb-3 px-2 py-1 rounded text-[10px]"
               style={{ background: tint("--accent-blue", 10), color: "var(--accent-blue)" }}>
            Rows marked “thin” have fewer than 10 occurrences — a high win rate on 3 samples
            is not the same evidence as the same rate on 40.
          </div>
        )}

        <div className="rounded-lg border overflow-x-auto mb-4"
             style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
          <table className="w-full text-[11px]" data-testid="winrate-table">
            <thead><tr style={{ color: "var(--text-dim)" }}>
              {["Pattern","Measures","n","Win%","Base%","Edge vs base","Avg 5d","Win% (normal)","Win% (event)","Sample"].map(h =>
                <th key={h} className="px-2 py-1.5 text-left font-semibold">{h}</th>)}
            </tr></thead>
            <tbody>
              {pats.map(p => (
                <tr key={p.pattern}>
                  <td className="px-2 py-1" style={{ color: "var(--text-bright)" }}>{p.pattern}</td>
                  {/* What the "win" actually tests. A NEUTRAL pattern's win is
                      only that price MOVED, so it must not be read as a
                      directional rate beside the BULL/BEAR rows. */}
                  <td className="px-2 py-1 text-[10px]" style={{
                    color: p.direction === "BULL" ? "var(--accent-green)"
                         : p.direction === "BEAR" ? "var(--accent-red)" : "var(--accent-amber)" }}>
                    {p.metric_label || p.direction}
                  </td>
                  <td className="px-2 py-1" style={{ color: "var(--text-mid)" }}>{p.all.n}</td>
                  <td className="px-2 py-1"><WinRateCell cell={p.all} /></td>
                  <td className="px-2 py-1 text-[10px]" style={{ color: "var(--text-dim)" }}>
                    {(p.all.base_pct === null || p.all.base_pct === undefined)
                      ? "n/a" : fmtNum(p.all.base_pct, 1) + "%"}
                  </td>
                  <td className="px-2 py-1"><EdgeCell cell={p.all} /></td>
                  <td className="px-2 py-1" style={{
                    color: !p.all.available ? "var(--text-dim)"
                         : p.all.avg_fwd5 >= 0 ? "var(--accent-green)" : "var(--accent-red)" }}>
                    {p.all.available ? `${p.all.avg_fwd5 >= 0 ? "+" : ""}${fmtNum(p.all.avg_fwd5)}%` : "n/a"}
                  </td>
                  <td className="px-2 py-1"><WinRateCell cell={p.normal} /></td>
                  <td className="px-2 py-1"><WinRateCell cell={p.event} /></td>
                  <td className="px-2 py-1 text-[9px]" style={{ color: p.low_sample ? "var(--accent-amber)" : "var(--text-dim)" }}>
                    {p.low_sample ? "thin" : "ok"}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "var(--text-bright)" }}>
          Edge vs Baseline (percentage points)
        </div>
        <div className="rounded-lg border p-3" style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
          {pats.filter(p => p.all.available && p.all.edge_pp !== null).map(p => {
            // Signed bars around a zero line: negative edge grows left, positive
            // right, and non-significant bars are dimmed. Width is presentational
            // scaling of a server value (the DistanceBar precedent) - no
            // arithmetic on a traded number.
            const e = p.all.edge_pp;
            const pct = Math.min(50, (Math.abs(e) / maxAbsEdge) * 50);
            return (
              <div key={p.pattern} className="flex items-center gap-2 mb-1.5">
                <span className="text-[10px] w-28 shrink-0" style={{ color: "var(--text-dim)" }}>{p.pattern}</span>
                <div className="flex-1 h-3 rounded relative" style={{ background: tint("--text-bright", 6) }}>
                  <div className="absolute top-0 bottom-0" style={{ left: "50%", width: 1, background: "var(--border)" }} />
                  <div className="absolute h-3 rounded" style={{
                    left: e >= 0 ? "50%" : (50 - pct) + "%",
                    width: Math.max(0.5, pct) + "%",
                    background: e >= 0 ? "var(--accent-green)" : "var(--accent-red)",
                    opacity: p.all.significant ? 1 : 0.45 }} />
                </div>
                <span className="text-[10px] w-28 text-right" style={{ color: "var(--text-mid)" }}>
                  {e >= 0 ? "+" : ""}{fmtNum(e, 1)}pp (n={p.all.n})
                </span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Candlestick sub-tab 1: Chart & Indicators (Sprint DD-12a) ────────────
// Mirrors Streamlit's layout: chart left (~60%) + values panel right (~40%),
// with the RSI(14) row underneath. The candlestick comes from the EXISTING
// /charts?type=candlestick — create_ultra_premium_chart is already pure and is
// the single candlestick implementation this twin uses.
//
// RSI is drawn from the server's series; it is never recomputed here (the
// values would be a second implementation of Wilder smoothing and could drift
// from Streamlit's overbought/oversold reads).

/** Streamlit's "🔍 Active Patterns (last 3 bars)" card, plus its
 * "All patterns found (N in last 60 bars)" expander.
 *
 * "no patterns found" and "the scanner could not run" are opposite claims, so
 * `available:false` renders the reason rather than an empty list that would read
 * as a confident "nothing here". */
function PatternsCard({ patterns }) {
  const [open, setOpen] = useState(false);
  const p = patterns || {};
  if (!p.available) {
    return <div className="text-[10px]" style={{ color: "var(--accent-amber)" }}>
      Pattern scan unavailable — {p.reason || "reason not reported"}.
    </div>;
  }
  const tone = (d) => d === "BULL" ? "var(--accent-green)"
                    : d === "BEAR" ? "var(--accent-red)" : "var(--text-mid)";
  const active = p.active || [];
  return (
    <div data-testid="candle-patterns">
      <div className="text-[9px] mb-1" style={{ color: "var(--text-dim)" }}>
        last {p.recent_bars} bars
      </div>
      {active.length === 0
        ? <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>
            No strong pattern in last {p.recent_bars} bars
          </div>
        : active.map((a, i) => (
            <div key={`${a.date}-${a.pattern}-${i}`} className="text-[11px] py-0.5"
                 style={{ color: tone(a.direction) }}>
              {a.pattern} — {a.date}
            </div>
          ))}
      {p.total > 0 && (
        <>
          <button onClick={() => setOpen(!open)} className="mt-2 text-[10px] underline"
                  style={{ color: "var(--accent-blue)" }}>
            {open ? "▾" : "▸"} All patterns found ({p.total} in last {p.lookback_bars} bars)
          </button>
          {open && (
            <div className="mt-1 max-h-48 overflow-y-auto">
              {(p.all || []).slice().reverse().map((a, i) => (
                <div key={`${a.date}-${a.pattern}-${i}`}
                     className="flex justify-between text-[10px] py-0.5 border-b"
                     style={{ borderColor: tint("--border", 60) }}>
                  <span style={{ color: "var(--text-dim)" }}>{a.date}</span>
                  <span style={{ color: tone(a.direction) }}>{a.pattern}</span>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function CandleIndicatorsSection({ ticker }) {

  // RSI figure assembled from the server's series. Guide lines at 70/50/30 and

    data: [{
      type: "scatter", mode: "lines+markers", name: "RSI",

      font: { color: cssVar("--text-bright", "#e2e8f0"), size: 10 },
      margin: { l: 10, r: 80, t: 10, b: 10 },
      yaxis: { range: [0, 100], showgrid: true, gridcolor: tint("--text-dim", 20) },
      xaxis: { showgrid: false },
      shapes: [
        { type: "line", xref: "paper", x0: 0, x1: 1, y0: 70, y1: 70, line: { color: cssVar("--accent-red", "#ff4444"), width: 1, dash: "dot" } },
        { type: "line", xref: "paper", x0: 0, x1: 1, y0: 30, y1: 30, line: { color: cssVar("--accent-green", "#00c853"), width: 1, dash: "dot" } },
        { type: "line", xref: "paper", x0: 0, x1: 1, y0: 50, y1: 50, line: { color: cssVar("--text-mid", "#8899aa"), width: 1, dash: "dot" } },

  return (
    <div className="flex flex-col h-full min-h-0">

        <SourceBadge source={source} detail={sourceDetail} />
        <AsOfBadge asOf={asOf} />
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          {cov.available}/{cov.total} values · RSI {rsi.smoothing}-smoothed
        </span>
        {/* Liveness is READ FROM THE SERVER'S live_tick.applied, never inferred
            from the source string or a session flag — the DD-2 /live bug. */}
        {data.live_tick && (
          data.live_tick.applied
            ? <span className="px-1.5 py-0.5 rounded text-[9px] font-bold border"
                    style={{ color: "var(--accent-green)", borderColor: "var(--accent-green)",
                             background: tint("--accent-green", 12) }}>
                LIVE TICK ₹{fmtNum(data.live_tick.ltp)}
                {data.live_tick.tier ? ` · ${data.live_tick.tier}` : ""}
              </span>
            : <span className="px-1.5 py-0.5 rounded text-[9px] border"
                    style={{ color: "var(--text-dim)", borderColor: "var(--border)" }}>
                LAST SETTLED BAR
              </span>
        )}
        <button onClick={() => { reload(); charts.reload(); }}
                className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="candle-indicators">
        <div className="grid grid-cols-1 xl:grid-cols-5 gap-3 mb-3">
          <div className="xl:col-span-3 rounded-lg border p-2" data-testid="candle-chart"
               style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[10px] uppercase tracking-wide px-2 pt-1" style={{ color: "var(--text-mid)" }}>Price Action &amp; DMA</div>
            {candle ? <PlotlyChart fig={candle} minHeight={460} />
                    : <div className="p-4 text-[11px]" style={{ color: "var(--text-dim)" }}>Chart unavailable.</div>}
          </div>

          {/* Values Panel — the twin of Streamlit's right-hand column
              ("Chart left 60% + Values Panel right 40%", app.py `_ct1`).
              Grouped into the SAME four cards, so a reader who is not
              comfortable with charts gets the same 35 numbers in the same
              order in both frontends. Card membership comes from the
              server's `group` field — never decided here. */}
          <div className="xl:col-span-2 overflow-y-auto" data-testid="candle-values-panel"
               style={{ maxHeight: "60vh" }}>
            {(data.groups || []).map(g => {
              const inGroup = rows.filter(r => r.group === g);
              const isPatterns = g === "Active Patterns";
              if (!inGroup.length && !isPatterns) return null;
              return (
                <div key={g} className="rounded-lg border p-3 mb-2"
                     style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
                  <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
                       style={{ color: "var(--text-bright)" }}>{g}</div>

                  {isPatterns

                             style={{ borderColor: tint("--border", 60) }}>
                          <span style={{ color: "var(--text-dim)" }}>{r.label}</span>
                          <span className="text-right">
                            <span style={{ color: r.available ? (DECK_TONE_COLOR[r.tone] || "var(--text-bright)") : "var(--text-dim)" }}>
                              {!r.available ? "n/a"
                                : (typeof r.value === "number"
                                    ? (r.unit === "₹" ? "₹" : "") + fmtNum(r.value) + (r.unit && r.unit !== "₹" ? r.unit : "")
                                    : String(r.value))}
                            </span>
                            {r.note && <span className="ml-2 text-[9px]" style={{ color: "var(--text-dim)" }}>{r.note}</span>}
                          </span>
                        </div>
                      ))}
                </div>
              );
            })}
          </div>
        </div>

        {rsiFig && (
          <div className="rounded-lg border p-2" data-testid="candle-rsi"
               style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
            <div className="text-[10px] uppercase tracking-wide px-2 pt-1" style={{ color: "var(--text-mid)" }}>
              RSI (14) — {rsi.smoothing} Smoothed · now {fmtNum(rsi.value, 1)} ({rsi.zone})
            </div>
            <PlotlyChart fig={rsiFig} minHeight={190} />
          </div>
        )}
      </div>
    </div>
  );
}

// ── Financials section (Sprint DD-11) ────────────────────────────────────
// Twin of Streamlit's 💰 Financials tab. Rendered GENERICALLY from the payload,
// so a new ratio group needs no change here.
//
// The design decision this tab exists to get right: a fundamental yfinance does
// not have arrives from compute_advanced_ratios as 0 (its missing sentinel), and
// Streamlit prints "0.00" — which for a P/E or EV/EBITDA reads as an absurdly
// cheap valuation rather than as absent data. Here `available:false` renders
// "n/a" (DATA-INTEGRITY §4). Measured: MAHABANK, a bank, has 17 of 35 genuinely
// inapplicable (Current Ratio, Inventory Turnover, CCC, DSO...).

function FinancialsSection({ ticker }) {
  const { data, error, loading, reload, source, sourceDetail, asOf } =
    useTickerFetch("financials", null, ticker);

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Loading financials…</div>;
  if (error) return <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>Could not load financials: {error}</div>;
  if (!data) return null;

  const cov = data.coverage || {};
  const meta = data.meta || {};
  const groups = Object.entries(data.ratios || {});

  const fmtRatio = (r) => {
    if (!r.available) return "n/a";
    const v = r.value;
    // Large absolutes (cash-flow lines are in rupees) would otherwise render as
    // an unreadable 13-digit run. Presentational only — the server's number is
    // unchanged, nothing financial is recomputed here.
    if (Math.abs(v) >= 1e7) return (v / 1e7).toFixed(2) + " Cr";
    return fmtNum(v) + (r.unit || "");
  };

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <SourceBadge source={source} detail={sourceDetail} />
        <AsOfBadge asOf={asOf} label="filings" />
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          {cov.available}/{cov.total} ratios available · P/E {meta.pe_type} · {meta.years_used}y CAGR {fmtNum(meta.cagr_used)}%
        </span>
        <button onClick={reload} className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="financials-body">
        {cov.missing > 0 && (
          <div className="mb-3 px-2 py-1 rounded text-[10px]"
               style={{ background: tint("--accent-amber", 10), color: "var(--accent-amber)" }}>
            {cov.missing} of {cov.total} ratios are unavailable for this name and render as n/a —
            not as 0. Sparse fundamentals are normal for smallcaps, and several ratios are
            genuinely inapplicable to banks.
          </div>
        )}
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
          {groups.map(([group, rows]) => (
            <div key={group} className="rounded-lg border p-3"
                 style={{ background: "var(--bg-secondary)", borderColor: "var(--border)" }}>
              <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
                   style={{ color: "var(--text-bright)" }}>{group}</div>
              {rows.map(r => (
                <div key={r.label} className="flex justify-between text-[11px] py-1 border-b"
                     style={{ borderColor: tint("--border", 60) }}>
                  <span style={{ color: "var(--text-dim)" }}>{r.label}</span>
                  <span style={{ color: r.available ? DECK_TONE_COLOR[r.tone] || "var(--text-bright)" : "var(--text-dim)" }}>
                    {fmtRatio(r)}
                  </span>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

          <StatTile label="Forecast Target"

// ── Derivatives section (Sprint DD-9) ────────────────────────────────────
// Twin of Streamlit's ⚡ Derivatives tab: flow + sentiment analytics. The chain
// LADDER lives in the F&O Command tab (DD-8); this one is Greeks, VIX,

function DerivativesSection({ ticker }) {
  const { data, error, loading, reload, source, sourceDetail, asOf } =
    useTickerFetch("derivatives", null, ticker);
  // The DD-1 chart builders, served by DD-2's /charts. DD-9 deliberately did NOT
  // duplicate the figures into /derivatives — but this tab then rendered numbers
  // ONLY, so the OI/PCR charts a trader expects on a Derivatives tab were
  // reachable nowhere except F&O Command. Fetched here too; the endpoint is
  // shared, not duplicated.
  const charts = useTickerFetch("charts?type=derivatives", null, ticker);

  if (loading && !data) return <div className="p-4 text-[12px]" style={{ color: "var(--text-dim)" }}>Loading derivatives…</div>;
  if (error) return <div className="p-4 text-[11px]" style={{ color: "var(--accent-red)" }}>Could not load derivatives: {error}</div>;
  if (!data) return null;

  const g = data.greeks || {};
  const ad = data.advance_decline || {};
  const fd = data.fii_dii || {};
  const metrics = data.metrics || {};
  const signals = data.signals || [];
  const sigCols = signals.length ? Object.keys(signals[0]) : [];

  const flowTone = (v) => (v === null || v === undefined) ? "neutral" : (v > 0 ? "bullish" : v < 0 ? "bearish" : "neutral");

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex items-center gap-2 px-4 pt-3 flex-wrap">
        <SourceBadge source={source} detail={sourceDetail} />
        <AsOfBadge asOf={asOf} />
        <span className="text-[10px]" style={{ color: "var(--text-dim)" }}>
          {data.compute_source_label} · spot ₹{fmtNum(data.spot)} · chain {data.chain_rows} rows
        </span>
        <button onClick={reload} className="ml-auto text-[10px] underline" style={{ color: "var(--accent-blue)" }}>refresh</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-3" data-testid="derivatives-body">
        {/* DD-1 builders via DD-2's /charts. Rendered here as well as in F&O
            Command — the endpoint is shared, so this is one source of truth
            displayed twice, not two implementations.

            ⚠️ WHICH FIGURES COME BACK IS DATA-DEPENDENT, and that is not a bug.
            `oi_change` needs a PRIOR day's OI snapshot and `pcr_trend` needs
            accumulated PCR history, so a ticker being watched for the first
            time legitimately returns only `oi_bar`. Measured on ZYDUSLIFE.NS:
            derivatives -> oi_bar; fno -> iv_skew, iv_term_structure, payoff.
            The panel names what is absent rather than rendering an empty box. */}
        <div className="mb-4" data-testid="derivatives-charts">
          <div className="text-[11px] font-bold uppercase tracking-wide mb-2"
               style={{ color: "var(--text-bright)" }}>Open Interest &amp; PCR</div>

            <div className="text-[11px]" style={{ color: "var(--text-dim)" }}>Loading charts…</div>)}

            <div className="text-[11px]" style={{ color: "var(--accent-red)" }}>

          {charts.data && (() => {

            const want = [["oi_bar", "OI by strike"],
                          ["oi_change", "OI change (needs a prior-day snapshot)"],
                          ["pcr_trend", "PCR trend (needs accumulated history)"]];

            return (

                {missing.length > 0 && (

          <StatTile label="IV Skew" value={fmtNum(g.iv_skew)} sub="PE−CE" />

          {/* bid_ask_spread is null when there is no order-book depth. StatTile
