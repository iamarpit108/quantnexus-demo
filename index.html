<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<!-- Pinned to the Babel 7 line: @babel/standalone's react preset there
     defaults to the "classic" JSX runtime (React.createElement calls) —
     the unversioned unpkg URL currently resolves to Babel 8, whose react
     preset defaults to the "automatic" runtime and emits
     `import ... from "react/jsx-runtime"`, which cannot execute in a plain
     script tag with React loaded as a UMD global (no module resolution). -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Pinned for the same reason Babel is pinned above: an unversioned URL can
     silently jump major versions and break the Plotly.react() call signature
     the drill-down panel (Sprint DD-3) depends on.

     VERSION MUST MATCH plotly.py — DD-6 §3. api_server.py serves figures built
     by plotly.py 6.6.0, which targets plotly.js **3.4.0** (measured, not
     assumed: `plotly.offline.get_plotlyjs_version()` -> '3.4.0'). This tag was
     pinned at 2.35.2, a four-major-version skew: the server was emitting a
     schema newer than the renderer understood. It happened to be benign for
     the trace types in use (candlestick/scatter/bar), but "happened to be" is
     not a guarantee, and DD-7..DD-14 add many more chart types on top of it.
     Verified after the bump with tests/visual/chart_parity.py against a REAL
     browser — the only instrument that can see this, since server-side
     fig.to_plotly_json() is identical either way and the DD-3/DD-4 jsdom
     harness stubbed Plotly entirely.
     If you bump plotly.py in requirements.txt, re-check this number. -->
<script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
<style>
  /* Exact token set from app.py's Streamlit dashboard — every color in this
     file resolves through one of these, no ad-hoc hex/rgba. Tinted/
     translucent surfaces (banners, badges) use color-mix() against these
     vars rather than separate rgba literals, so the palette still has one
     source of truth. */
  :root {
    /* A 4-step INK SCALE, not a set of card backgrounds. Panels separate by value;
       a hairline is spent only where two zones actually meet. The navy is kept
       deliberately - it is the one thing here that was already not a default, and
       amber-on-black would be Bloomberg cosplay. */
    --ink-900:#081625;   /* page */
    --ink-850:#0a1b2c;   /* sunken: stream, meter troughs */
    --ink-800:#0c1e30;   /* panel */
    --ink-700:#11283c;   /* raised: row hover, active spine node */
    --hair:#1a3147;      /* hairline, zone edges only */
    --hair-soft:#132639; /* inside a zone, when a rule is unavoidable */

    /* Data colours. Desaturated from the originals so a full screen of them reads
       as information rather than as decoration. Meaning is fixed: green/red are
       P&L and direction ONLY, cyan is interactive, amber is a warning. */
    --accent-blue:#4cc9f0; --accent-green:#2ee6a8; --accent-red:#ff5470;
    --accent-amber:#ffc247; --accent-orange:#ff8a5c;

    --text-dim:#4e6478; --text-mid:#8ba3b8; --text-bright:#e8f0f7;

    /* Kept as aliases so every pre-existing rule in this file still resolves. */
    --bg-primary:var(--ink-900); --bg-secondary:var(--ink-800);
    --bg-card:var(--ink-800); --bg-deep:var(--ink-850); --border:var(--hair);
    --text:var(--text-bright);

    /* Type scale. 32 is spent on exactly one number on the page. */
    --t-micro:10px; --t-small:11px; --t-body:13px; --t-lead:18px; --t-hero:32px;
  }

  /* ── Light theme ──────────────────────────────────────────────────────────
     A token override, not a second stylesheet — everything on the page already
     resolves through these names, and tint() composes against them with
     color-mix, so translucent surfaces follow automatically.

     ⚠️ The accents are re-tuned, not reused. #2ee6a8 / #4cc9f0 are built for a dark
     ground; on white they are low-contrast and read as decoration rather than as
     data. These keep the MEANING legible against paper: green/red are P&L and
     direction, cyan is interactive, amber is a warning. */
  :root[data-theme="light"] {
    --ink-900:#f5f7fa;   /* page */
    --ink-850:#eceff4;   /* sunken: wires, meter troughs */
    --ink-800:#ffffff;   /* panel */
    --ink-700:#e4e9f0;   /* raised: row hover, active row */
    --hair:#c9d2dd;
    --hair-soft:#dfe5ec;

    --accent-blue:#0b6fa4; --accent-green:#0f7d55; --accent-red:#c2283f;
    --accent-amber:#8a6100; --accent-orange:#b4480c;

    --text-dim:#7b8794; --text-mid:#4a5663; --text-bright:#17202a;

    --scrim: rgba(23, 32, 42, 0.42);
  }
  :root { --scrim: rgba(0, 0, 0, 0.6); }
  html, body { background: var(--ink-900); }
  /* Mono carries every NUMBER. Archivo carries the chrome - panel names, status
     words, buttons - so a figure is visually a figure. */
  body { font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; }
  .mono, table, input, textarea { font-family: 'JetBrains Mono', 'Consolas', monospace; }
  .num { font-family: 'JetBrains Mono', 'Consolas', monospace;
         font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  /* Panel name: sentence-case, weight and colour do the work. No tracked-out caps. */
  .panel-name { font-size: var(--t-small); font-weight: 600; letter-spacing: .01em;
                color: var(--text-mid); }
  .zone { background: var(--ink-800); }
  .sunken { background: var(--ink-850); }
  *:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot, .flash-override, .flash-success { animation: none !important; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  /* The nav scrolls within itself rather than widening the document. */
  .nav-scroll { scrollbar-width: none; }
  .nav-scroll::-webkit-scrollbar { height: 0; }
  .nav-scroll > * { flex: 0 0 auto; }
  /* A GROUP HEADER has items beneath it; a panel name labels one panel. They were
     both .panel-name, so in a dense rail a header and its children read at nearly
     the same weight and the hierarchy had to be inferred from indentation alone.
     Three signals, so it survives at any size: a hairline above (the group starts
     HERE), a short accent tick, and brighter/bolder text than the items.
     ⚠️ Deliberately NOT tracked-out ALL CAPS — that is the commonest generated-page
     tell, and weight plus a rule carry the same information without it. */
  .group-head { display:flex; align-items:center; gap:0.4rem;
                font-size: var(--t-small); font-weight: 700; letter-spacing: .005em;
                color: var(--text-bright); }
  .group-head::before { content:""; flex:0 0 auto; width:7px; height:2px;
                        border-radius:1px; background: var(--accent-blue); }
  .group-head + * { margin-top: 0.15rem; }
  /* The rule belongs to the group, not the first item, so a group that opens a
     panel does not draw one against the panel's own edge. */
  .group-sep { border-top: 1px solid var(--hair-soft); }
  .group-sep:first-child { border-top: none; }
  /* Research board: zoned panels, scroll-anchored sections. */
  .research-panel { background: var(--ink-800); border: 1px solid var(--hair);
                    padding: 0.75rem; }
  .research-panel table { width: 100%; }
  [id^="research-"] { scroll-margin-top: 0.5rem; }
  /* Analytics: metric panels, then per-group attribution. */
  .analytics-grid { display:grid; gap: 0.75rem;
                    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .analytics-groups-grid { display:grid; gap: 0.75rem 1.5rem;
                           grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  /* News: wire | sources & brief. One column on a phone. */
  .news-grid { display:grid; grid-template-columns: minmax(0,1fr) 300px; }
  @media (max-width: 900px) {
    .news-grid { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
    .news-grid > [data-testid="news-side"] {
      border-left: none !important; border-top: 1px solid var(--hair); max-height: 16rem;
    }
  }
  /* Workspace: function rail | section body. Rail on top on a phone. */
  .workspace-grid { display:grid; grid-template-columns: 172px minmax(0,1fr); }
  @media (max-width: 900px) {
    .workspace-grid { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); }
    .workspace-grid > [data-testid="workspace-rail"] {
      max-height: 11rem; border-right: none !important;
      border-bottom: 1px solid var(--hair);
    }
  }
  /* Sentinel: criteria | results. One column on a phone. */
  .sentinel-grid { display:grid; grid-template-columns: 340px minmax(0,1fr); min-height: 0; }
  @media (max-width: 900px) {
    .sentinel-grid { grid-template-columns: minmax(0,1fr); }
    .sentinel-grid > div { border-right: none !important; border-bottom: 1px solid var(--hair); }
  }
  /* Agent cockpit: spine | book | shortlist. One column on a phone. */
  .agent-grid { display:grid;
                grid-template-columns: 186px 288px minmax(0,1fr) 332px;
                min-height: 268px; }
  @media (max-width: 900px) {
    .agent-grid { grid-template-columns: minmax(0,1fr); min-height: 0; }
    .agent-grid > div { border-right: none !important;
                        border-bottom: 1px solid var(--hair); }
  }
  @keyframes flashAmber {
    0%   { background-color: color-mix(in srgb, var(--accent-amber) 30%, transparent); }
    100% { background-color: transparent; }
  }
  .flash-override { animation: flashAmber 1.5s ease-out; }
  @keyframes flashSuccess {
    0%   { background-color: color-mix(in srgb, var(--accent-green) 35%, transparent) !important; }
    100% { background-color: transparent; }
  }
  .flash-success { animation: flashSuccess .9s ease-out; }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50%      { opacity: .35; }
  }
  .pulse-dot { animation: pulseDot 1.4s ease-in-out infinite; }
</style>
</head>
<body class="min-h-screen" style="background:var(--bg-primary); color:var(--text-bright)">
<script>
// Applied BEFORE React mounts so the page never flashes dark and repaints light.
// Wrapped because localStorage throws in a private window or with site data blocked,
// and a theme preference must never be able to stop the dashboard loading.
(function () {
  try {
    var t = localStorage.getItem("qn-theme");
    if (t === "light") document.documentElement.dataset.theme = "light";
  } catch (e) { /* no stored preference is a valid state, not an error */ }
})();
</script>
<div id="root"></div>
<script src="shim.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext } = React;

// ── Config ───────────────────────────────────────────────────────────────
// MUST be 127.0.0.1, never "localhost" — api_server.py binds 0.0.0.0:8000,
// which is IPv4-ONLY. On this machine "localhost" resolves to ::1 first, and
// nothing listens on [::1]:8000, so the browser gets a connection refusal
// before any HTTP response — surfacing as fetch()'s "Failed to fetch".
// curl hides this by silently falling back to IPv4, which is why every
// curl test passed while the browser failed. See CLAUDE.md.
const API_BASE = "https://demo.invalid";
const WS_URL   = "wss://demo.invalid/ws/v1/events";
const MAX_EVENTS = 500;
const RECONNECT_BASE_MS = 1000;
const RECONNECT_CAP_MS  = 10000;
const RECONNECT_ATTEMPTS_BEFORE_DOWN = 3;
const STALE_WARN_S     = 60;
const STALE_CRITICAL_S = 300;

// tint() — the only place this file builds a translucent surface. Always a
// color-mix() against a design token, never a hand-picked rgba literal.
function tint(varName, pct) {
  return `color-mix(in srgb, var(${varName}) ${pct}%, transparent)`;
}


// Resolve a design token to its current value. Needed where a library cannot take a
// CSS var() — Plotly takes colour strings only — so the value is read at render
// time and therefore follows the theme like everything else.
function cssVar(name, fallback) {
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  } catch (e) { return fallback; }
}

// ── Format helpers (presentational only — every number rendered here comes
//    from the server; nothing financial is computed in this file) ─────────
function fmtNum(v, digits) {
  if (v === null || v === undefined) return "—";
  return Number(v).toFixed(digits === undefined ? 2 : digits);
}
function pnlColor(v) {
  if (v === null || v === undefined) return "var(--text-mid)";
  return v >= 0 ? "var(--accent-green)" : "var(--accent-red)";
}
function fmtAge(s) {
  if (s === null || s === undefined) return "—";
  const n = Math.max(0, Math.round(s));
  if (n < 60) return n + "s ago";
  if (n < 3600) return Math.round(n / 60) + "m ago";
  return Math.round(n / 3600) + "h ago";
}
function fmtTime(ts) {
  if (!ts) return "—";
  const s = String(ts);
  const tIdx = s.indexOf("T") >= 0 ? s.indexOf("T") : s.indexOf(" ");
  return tIdx >= 0 ? s.slice(tIdx + 1, tIdx + 9) : s.slice(0, 19);
}

// ── Hooks ────────────────────────────────────────────────────────────────

/**
 * useWebSocket — connects to `url`, handles the HYDRATION message (full
 * snapshot, replaces local state wholesale) vs. delta envelopes (appended,
 * deduped by seq — never by object identity), auto-reconnects with
 * exponential backoff 1s -> 2s -> 4s, capped at 10s, and re-hydrates fully
 * on every reconnect (the server always sends a fresh HYDRATION on
 * connect, so there is nothing extra to request).
 */
function useWebSocket(url) {
  const [status, setStatus] = useState("RECONNECTING"); // LIVE | RECONNECTING | DOWN
  const [events, setEvents] = useState([]);              // newest-first, deduped by seq
  const [hydrationSeq, setHydrationSeq] = useState(0);    // increments every HYDRATION — lets
                                                           // consumers react to "a fresh snapshot
                                                           // just replaced the list" distinctly
                                                           // from a normal delta append.
  const wsRef = useRef(null);
  const backoffRef = useRef(RECONNECT_BASE_MS);
  const attemptsRef = useRef(0);
  const unmountedRef = useRef(false);
  const seenSeqRef = useRef(new Set());
  const timerRef = useRef(null);

  const applyHydration = useCallback((snapshotEvents) => {
    seenSeqRef.current = new Set();
    const deduped = [];
    for (const e of snapshotEvents) {
      if (!seenSeqRef.current.has(e.seq)) {
        seenSeqRef.current.add(e.seq);
        deduped.push(e);
      }
    }
    deduped.sort((a, b) => b.seq - a.seq); // newest first
    setEvents(deduped.slice(0, MAX_EVENTS));
    setHydrationSeq(n => n + 1);
  }, []);

  const applyDelta = useCallback((envelope) => {
    if (seenSeqRef.current.has(envelope.seq)) return; // dedupe by seq, not identity
    seenSeqRef.current.add(envelope.seq);
    setEvents(prev => [envelope, ...prev].slice(0, MAX_EVENTS));
  }, []);

  const connect = useCallback(() => {
    if (unmountedRef.current) return;
    const ws = new WebSocket(url);
    wsRef.current = ws;

    ws.onopen = () => {
      attemptsRef.current = 0;
      backoffRef.current = RECONNECT_BASE_MS;
      setStatus("LIVE");
    };

    ws.onmessage = (msg) => {
      let data;
      try { data = JSON.parse(msg.data); } catch (e) { return; }
      if (data.type === "HYDRATION") {
        applyHydration(data.events || []);
      } else {
        applyDelta(data);
      }
    };

    ws.onclose = () => {
      if (unmountedRef.current) return;
      attemptsRef.current += 1;
      setStatus(attemptsRef.current >= RECONNECT_ATTEMPTS_BEFORE_DOWN ? "DOWN" : "RECONNECTING");
      const delay = backoffRef.current;
      backoffRef.current = Math.min(delay * 2, RECONNECT_CAP_MS);
      timerRef.current = setTimeout(connect, delay);
    };

    ws.onerror = () => {
      try { ws.close(); } catch (e) {}
    };
  }, [url, applyHydration, applyDelta]);

  useEffect(() => {
    unmountedRef.current = false;
    connect();
    return () => {
      unmountedRef.current = true;
      if (timerRef.current) clearTimeout(timerRef.current);
      if (wsRef.current) wsRef.current.close();
    };
  }, [connect]);

  return { status, events, hydrationSeq };
}

/** usePolling — generic fetch poller. Never clears `data` on a failed poll
 * (callers rely on this to keep showing last-known-good data), tracks
 * consecutiveFailures for a stale-data banner, and the last successful
 * fetch time. */
function usePolling(url, intervalMs) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [consecutiveFailures, setConsecutiveFailures] = useState(0);
  const [lastSuccessAt, setLastSuccessAt] = useState(null);

  useEffect(() => {
    let cancelled = false;
    let timer = null;

    async function tick() {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (cancelled) return;
        setData(json);
        setError(null);
        setConsecutiveFailures(0);
        setLastSuccessAt(new Date());
      } catch (e) {
        if (cancelled) return;
        setError(String(e && e.message ? e.message : e));
        setConsecutiveFailures(prev => prev + 1);
      } finally {
        if (!cancelled) timer = setTimeout(tick, intervalMs);
      }
    }
    tick();
    return () => { cancelled = true; if (timer) clearTimeout(timer); };
  }, [url, intervalMs]);

  return { data, error, consecutiveFailures, lastSuccessAt };
}

/**
 * useAgentState — the sticky risk bar / status card / workflow panel all
 * need /api/v1/state's server-computed shape (risk.heat_pct etc. come from
 * PortfolioAgent on the backend — never recomputed here). api_server.py's
 * EventHub only broadcasts agent_events.json deltas over the WS today, not
 * state changes, so a 2s poll is the one channel that actually stays live;
 * this hook also turns the server's staleness.age_seconds into a
 * client-ticking "Xs ago" without ever deriving staleness from the client's
 * own clock — it only measures elapsed time since the last successful poll
 * and adds that as an offset to the server-reported baseline.
 */
function useAgentState() {
  const { data, error, lastSuccessAt } = usePolling(API_BASE + "/api/v1/state", 2000);
  const [, forceTick] = useState(0);

  useEffect(() => {
    const id = setInterval(() => forceTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  const baseAge = data && data.staleness ? data.staleness.age_seconds : null;
  const displayAgeSeconds = (baseAge === null || baseAge === undefined)
    ? null
    : baseAge + (lastSuccessAt ? (Date.now() - lastSuccessAt.getTime()) / 1000 : 0);

  return { data, error, displayAgeSeconds };
}

/**
 * useCommand — generic POST helper shared by the control bar and the
 * workflow toggle grid. Tracks pending/flash/error per caller-supplied
 * `key` (the specific command or node name) rather than a single global
 * flag, since several buttons share one instance of this hook.
 */
function useCommand(url) {
  const [pendingKey, setPendingKey] = useState(null);
  const [flashKey, setFlashKey] = useState(null);
  const [error, setError] = useState(null);

  const send = useCallback(async (body, key) => {
    setPendingKey(key);
    setError(null);
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.detail || ("HTTP " + res.status));
      setFlashKey(key);
      setTimeout(() => setFlashKey(k => (k === key ? null : k)), 900);
      return { ok: true, json };
    } catch (e) {
      const message = String(e && e.message ? e.message : e);
      setError({ key, message });
      setTimeout(() => setError(prev => (prev && prev.key === key ? null : prev)), 4000);
      return { ok: false, error: e };
    } finally {
      setPendingKey(k => (k === key ? null : k));
    }
  }, [url]);

  return { send, pendingKey, flashKey, error };
}

// ── Small shared presentational pieces ──────────────────────────────────

function StatusPill({ status }) {
  const map = {
    LIVE:         { dot: "--accent-green", text: "var(--accent-green)" },
    RECONNECTING: { dot: "--accent-amber", text: "var(--accent-amber)" },
    DOWN:         { dot: "--accent-red",   text: "var(--accent-red)" },
  };
  const s = map[status] || map.DOWN;
  const dotClass = "w-2 h-2 rounded-full" + (status !== "LIVE" ? " pulse-dot" : "");
  return (
    <div className="flex items-center gap-2 px-3 py-1 rounded-full border"
         style={{ background: tint(s.dot, 10), borderColor: "var(--border)" }}>
      <span className={dotClass} style={{ background: `var(${s.dot})` }} aria-hidden="true"></span>
      <span className="text-[11px] font-semibold tracking-wide" style={{ color: s.text }}>{status === "LIVE" ? "SNAPSHOT" : status}</span>
    </div>
  );
}

const SEVERITY_STYLE = {
  INFO:  { color: "var(--text-bright)", tintVar: "--border" },
  WARN:  { color: "var(--accent-amber)", tintVar: "--accent-amber" },
  ERROR: { color: "var(--accent-red)", tintVar: "--accent-red" },
};

function ComputeBadge({ computeType }) {
  if (!computeType) return null;
  const isLLM = computeType === "LLM";
  const varName = isLLM ? "--accent-orange" : "--accent-green";
  return (
    <span className="px-1.5 py-0.5 rounded text-[10px] shrink-0 border"
          style={{ background: tint(varName, 12), color: `var(${varName})`, borderColor: `var(${varName})` }}>
      {isLLM ? "🧠 LLM" : "🔒 PYTHON"}
    </span>
  );
}

// ── Live Event Timeline (Agent tab, section 7) ──────────────────────────

function EventRow({ event, flashing }) {
  const [expanded, setExpanded] = useState(false);
  const sev = SEVERITY_STYLE[event.severity] || SEVERITY_STYLE.INFO;
  const isTestHarness = event.source === "TEST_HARNESS";
  const isOverride = event.type === "override";
  const payload = event.payload || {};
  const message = payload.message || "";

  return (
    <div
      className={`border-b px-3 py-2 text-[12px] ${flashing ? "flash-override" : ""} ${isTestHarness ? "opacity-40" : ""}`}
      style={{ borderColor: "var(--border)", borderLeft: isOverride ? "3px solid var(--accent-amber)" : "none" }}
    >
      <div className="flex items-center gap-2 cursor-pointer flex-wrap" onClick={() => setExpanded(!expanded)}>
        <span className="w-[70px] shrink-0" style={{ color: "var(--text-dim)" }}>{fmtTime(event.timestamp)}</span>
        <span className="px-1.5 py-0.5 rounded border text-[10px] shrink-0"
              style={{ background: "var(--bg-primary)", borderColor: "var(--border)", color: "var(--accent-blue)" }}>
          {event.source}
        </span>
        <span className="px-1.5 py-0.5 rounded border text-[10px] shrink-0"

{JSON.stringify(payload, null, 2)}

function LiveEventTimeline({ events, hydrationSeq }) {
  const scrollRef = useRef(null);
  const [pinned, setPinned] = useState(true);
  const [flashingSeqs, setFlashingSeqs] = useState(new Set());
  const prevSeqSetRef = useRef(new Set());

  // A reconnect always sends a fresh HYDRATION snapshot — force re-pin so a
  // DOM swap's transient scrollTop clamp can't spuriously fire onScroll.
  useEffect(() => { setPinned(true); }, [hydrationSeq]);

  useEffect(() => {
    const currentSeqs = new Set(events.map(e => e.seq));
    const newOverrides = events.filter(e => e.type === "override" && !prevSeqSetRef.current.has(e.seq));
    if (newOverrides.length > 0) {
      setFlashingSeqs(prev => {
        const next = new Set(prev);
        newOverrides.forEach(e => next.add(e.seq));
        return next;
      });
      newOverrides.forEach(e => {
        setTimeout(() => {
          setFlashingSeqs(prev => { const next = new Set(prev); next.delete(e.seq); return next; });
        }, 1500);
      });
    }
    prevSeqSetRef.current = currentSeqs;
  }, [events]);

  useEffect(() => {
    if (pinned && scrollRef.current) scrollRef.current.scrollTop = 0;
  }, [events, pinned]);

  const handleScroll = () => {
    if (scrollRef.current && scrollRef.current.scrollTop > 24 && pinned) setPinned(false);
  };
  const resumeAutoscroll = () => {
    setPinned(true);
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center justify-between px-4 py-2 border-b" style={{ borderColor: "var(--border)" }}>
        <div className="panel-name">
          Decision stream
          <span className="num ml-2" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
            {events.length} of {MAX_EVENTS}
          </span>
        </div>
      </div>
      <div className="relative flex-1 min-h-0">
        {!pinned && (
          <button
            onClick={resumeAutoscroll}
            className="absolute top-2 right-4 z-10 px-3 py-1.5 rounded-full text-[11px] font-semibold shadow-lg"
            style={{ background: "var(--accent-blue)", color: "var(--bg-primary)" }}
          >
            ↑ Resume autoscroll
          </button>
        )}
        <div ref={scrollRef} onScroll={handleScroll} className="h-full overflow-y-auto">
          {events.length === 0 && (
            <div className="p-6 text-center" style={{ fontSize: "var(--t-body)", color: "var(--text-dim)" }}>Nothing yet. Events appear here as the agent works.</div>
          )}
          {events.map(e => <EventRow key={e.seq} event={e} flashing={flashingSeqs.has(e.seq)} />)}
        </div>
      </div>
    </div>
  );
}

// Section 1: Risk Snapshot Bar (metrics only — stickiness handled by parent)
function Stat({ label, value, color }) {
  return (
    <div className="flex items-baseline gap-1.5 whitespace-nowrap">
      <span className="text-[9px] uppercase tracking-wide" style={{ color: "var(--text-dim)" }}>{label}</span>
      <span className="text-[13px] font-semibold" style={{ color: color || "var(--text-bright)" }}>{value}</span>
    </div>

}

function heatColor(pct) {
  if (pct === null || pct === undefined) return "var(--text-mid)";
  if (pct > 85) return "var(--accent-red)";
  if (pct >= 60) return "var(--accent-amber)";
  return "var(--accent-green)";
}

const STATUS_COLOR = {
  RUNNING: "var(--accent-green)", COMPLETE: "var(--accent-blue)", IDLE: "var(--text-mid)",
  ERROR: "var(--accent-red)", HALTED: "var(--accent-red)", OFFLINE: "var(--accent-amber)",
  PAUSED: "var(--accent-amber)",
};

function CommandButton({ label, onClick, pending, flashing, accent }) {
  return (
    <button
      disabled={pending}
      onClick={onClick}
      className={`px-3 py-2 rounded-md text-[11px] font-bold tracking-wide uppercase transition-colors disabled:opacity-50 border ${flashing ? "flash-success" : ""}`}
      style={{
        background: accent || "var(--bg-secondary)",
        color: accent ? "var(--bg-primary)" : "var(--text-bright)",
        borderColor: accent || "var(--border)",
      }}
    >
      {pending ? "…" : label}
    </button>
  );
}

function HaltButton({ pending, flashing, onConfirm }) {
  const [armed, setArmed] = useState(false);
  const timerRef = useRef(null);
  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  const handleClick = () => {
    if (!armed) {
      setArmed(true);
      timerRef.current = setTimeout(() => setArmed(false), 3000);
      return;
    }
    if (timerRef.current) clearTimeout(timerRef.current);
    setArmed(false);
    onConfirm();
  };

  return (
    <button
      disabled={pending}
      onClick={handleClick}
      className={`px-3 py-2 rounded-md text-[11px] font-bold tracking-wide uppercase transition-colors disabled:opacity-50 border ${flashing ? "flash-success" : ""}`}
      style={{
        background: armed ? "var(--accent-red)" : "transparent",
        color: armed ? "var(--bg-primary)" : "var(--accent-red)",
        borderColor: "var(--accent-red)",
      }}
    >
      {pending ? "…" : armed ? "CONFIRM HALT" : "HALT"}
    </button>
  );
}

function StatusBanners({ data, ageSeconds }) {
  const status = data && data.status;
  const isHalted = status === "HALTED";
  const isCritical = ageSeconds !== null && ageSeconds !== undefined && ageSeconds > STALE_CRITICAL_S;
  const isWarn = !isCritical && !isHalted && ageSeconds !== null && ageSeconds !== undefined && ageSeconds > STALE_WARN_S;

  if (isHalted || isCritical) {
    return (
      <div className="px-4 py-2 text-[12px] font-semibold text-center border-b"
           style={{ background: tint("--accent-red", 15), color: "var(--accent-red)", borderColor: "var(--accent-red)" }}>
        {isHalted ? "⛔ AGENT HALTED — no new orders will be placed"
                  : `SNAPSHOT — agent state last updated ${fmtAge(ageSeconds)}; this demo does not update`}
      </div>
    );
  }
  if (isWarn) {
    return (
      <div className="px-4 py-2 text-[12px] font-semibold text-center border-b"
           style={{ background: tint("--accent-amber", 15), color: "var(--accent-amber)", borderColor: "var(--accent-amber)" }}>
        ⚠ State data is {fmtAge(ageSeconds)} — watching for updates
      </div>
    );
  }
  return null;
}

// Compact shortlist table for the Agent tab. Reads the purpose-built
// /api/v1/shortlist endpoint — NOT /api/v1/state. `agent_state.json` does
// carry a `data.shortlist` array (top 5, capped in agent_engine.py's
// write_state), but /api/v1/state's handler only re-exports `shortlist_count`
// and never the array itself, so reading it from there yields nothing while
// shortlist_count reads 25 (the bug this panel originally shipped with).
// /api/v1/shortlist serves the same 5 rows already enriched with
// `fo_eligible`, so it's the correct source rather than widening /state.
// Rows open the same StockDrilldownModal so a ticker surfaced mid-loop can be
// inspected without switching to the Sentinel tab and re-running a scan.
// ── Agent cockpit ───────────────────────────────────────────────
//
// The tab this replaced was seven full-width bands stacked vertically: risk strip,
// banners, status, controls, a collapsed workflow accordion, shortlist, stream.
// Nothing outranked anything else and it scrolled, so the two questions an operator
// actually opens this tab to answer - where is the loop, and what is it holding -
// were the hardest to find.
//
// The pipeline spine is the hero. Sentinel -> Research -> Committee -> Risk ->
// Portfolio -> Execution is a real ordered walk, which is the one case where
// numbering content is information rather than decoration, and it absorbs the
// workflow toggles that were previously buried behind a collapsed accordion.
//
// Standing rule, unchanged: no financial value is computed in this file. Every
// number below is rendered exactly as the server sent it.

// The spine's own order. Matches agent_engine's dispatch order, which is the point.
const SPINE = [
  { id: "NODE_0_MARKET_INTELLIGENCE", name: "Market intel" },
  { id: "REGIME",                     name: "Regime" },
  { id: "NODE_1_SENTINEL",            name: "Sentinel" },
  { id: "RESEARCH",                   name: "Research" },
  { id: "COMMITTEE",                  name: "Committee" },
  { id: "RISK",                       name: "Risk" },
  { id: "PORTFOLIO",                  name: "Portfolio" },
  { id: "EXECUTION",                  name: "Execution" },
  { id: "MONITOR",                    name: "Monitor" },
];

// Does `current_node` name this spine row? Tolerant of both the node id and a bare
// label, because the engine reports whichever the stage handed it. An unmatched
// value marks NOTHING rather than guessing a position - a spine lit on the wrong
// row is worse than a spine lit nowhere.
function isCurrentNode(node, currentNode) {
  if (!currentNode) return false;
  const c = String(currentNode).toUpperCase().replace(/[^A-Z]/g, "");
  if (!c || c === "IDLE") return false;
  const id = node.id.toUpperCase().replace(/[^A-Z]/g, "");
  const nm = node.name.toUpperCase().replace(/[^A-Z]/g, "");
  return c === id || c === nm || id.indexOf(c) >= 0 || c.indexOf(nm) >= 0;
}

function SpineRow({ index, node, enabled, isCurrent, pending, onToggle }) {
  const off = enabled === false;
  return (
    <button
      onClick={() => onToggle(node.id, off)}
      disabled={pending}
      title={off ? "Disabled — click to enable this stage"
                 : "Enabled — click to disable this stage"}
      className="w-full flex items-center gap-2.5 pl-2 pr-2.5 py-[7px] text-left transition-colors disabled:opacity-40"
      style={{
        background: isCurrent ? "var(--ink-700)" : "transparent",
        borderLeft: "2px solid " + (isCurrent ? "var(--accent-blue)" : "transparent"),
      }}
    >
      <span className="num" style={{ fontSize: "var(--t-micro)",
                   color: isCurrent ? "var(--accent-blue)" : "var(--text-mid)",
                   opacity: off ? .45 : .8, width: "0.9rem" }}>
        {index + 1}
      </span>
      <span style={{
        fontSize: "var(--t-body)",
        fontWeight: isCurrent ? 600 : 400,
        color: off ? "var(--text-dim)" : isCurrent ? "var(--text-bright)" : "var(--text-mid)",
      }}>
        {node.name}
      </span>
      <span className="ml-auto flex items-center">
        {off
          ? <span style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>off</span>
          : isCurrent
            ? <span className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: "var(--accent-blue)" }} />
            : <span className="w-1.5 h-1.5 rounded-full" style={{ background: "var(--hair)" }} />}
      </span>
    </button>
  );
}

function PipelineSpine({ nodes, currentNode }) {
  const [local, setLocal] = useState(nodes);
  const { send, pendingKey, error } = useCommand(API_BASE + "/api/v1/workflow/toggle");
  useEffect(() => { setLocal(nodes); }, [nodes]);

  const onToggle = async (node, enabled) => {
    const r = await send({ node, enabled }, node);
    if (r.ok && r.json && r.json.workflow_nodes) setLocal(r.json.workflow_nodes);
  };

  const map = local || {};
  return (
    <div className="flex flex-col h-full zone" data-testid="agent-spine">
      <div className="px-2.5 pt-2.5 pb-1.5 panel-name">Pipeline</div>
      <div className="flex-1 min-h-0 overflow-auto">
        {SPINE.map((n, i) => (
          <SpineRow key={n.id} index={i} node={n}
                    enabled={map[n.id]}
                    isCurrent={isCurrentNode(n, currentNode)}
                    pending={pendingKey === n.id}
                    onToggle={onToggle} />
        ))}
      </div>
      {error && (
        <div className="px-2.5 py-1.5" style={{ fontSize: "var(--t-micro)", color: "var(--accent-red)" }}>
          {error.key} failed: {error.message}
        </div>
      )}
    </div>
  );
}

// The one bold element on the page. Heat is what decides whether anything trades
// at all, and in the old layout it was four characters in a row of four stats.
// The LIMIT comes from the server (/api/v1/state risk.max_heat_pct, read from
// config) - a 5.0 typed in here would stop being true the moment it is retuned.
function HeatMeter({ pct, limit }) {
  const known = pct !== null && pct !== undefined;
  const haveLimit = limit !== null && limit !== undefined && limit > 0;
  const frac = known && haveLimit ? Math.min(pct / limit, 1) : 0; // presentational clamp
  const col = heatColor(pct);
  return (
    <div className="px-3 pt-3 pb-3.5">
      <div className="flex items-baseline gap-1.5">
        <span className="num" style={{ fontSize: "var(--t-hero)", lineHeight: 1, color: known ? col : "var(--text-dim)" }}>
          {known ? fmtNum(pct, 2) : "—"}
        </span>
        <span className="num" style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>
          {haveLimit ? "/ " + fmtNum(limit, 1) + "%" : "%"}
        </span>
      </div>
      <div className="mt-2 h-[3px] sunken" style={{ borderRadius: 2 }}>
        <div style={{ width: (frac * 100) + "%", height: "100%", background: col, borderRadius: 2 }} />
      </div>
      <div className="mt-1.5" style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>
        Portfolio heat
        {!haveLimit && <span style={{ color: "var(--text-dim)" }}> — limit not reported</span>}
      </div>
    </div>
  );
}

function Figure({ label, value, color, hint }) {
  return (
    <div className="flex items-baseline justify-between gap-3 px-3 py-[5px]">
      <span style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>{label}</span>
      <span className="num text-right" style={{ fontSize: "var(--t-body)", color: color || "var(--text-bright)" }}>
        {value}
        {hint && <span style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}> {hint}</span>}
      </span>
    </div>
  );
}

// The book. Reads /api/v1/positions rather than /state alone, because that endpoint
// carries `day_realized_detail.closed_today` - so a true zero ("nothing closed")
// is distinguishable from no data. /state's own `todays_pnl` is initialised to 0.0
// and written by nothing, which is why it is deliberately NOT rendered here.
function BookPanel({ risk }) {
  const { data } = usePolling(API_BASE + "/api/v1/positions", 4000);
  const r = risk || {};
  const day = data && data.day_realized_detail;
  const unreal = data ? data.aggregate_unrealized_pnl : r.unrealized;
  const marks = (data && data.live_marks) || {};

  return (
    <div className="flex flex-col zone" data-testid="agent-book">
      <HeatMeter pct={r.heat_pct} limit={r.max_heat_pct} />
      <div style={{ borderTop: "1px solid var(--hair-soft)" }} className="py-1.5">
        <Figure label="Slots" value={(r.positions_count ?? "—") + " / " + (r.max_positions ?? "—")} />
        <Figure label="Deployed" value={r.deployed_pct != null ? fmtNum(r.deployed_pct, 1) + "%" : "—"} />
        <Figure label="Unrealised" value={unreal != null ? "₹" + fmtNum(unreal) : "—"} color={pnlColor(unreal)} />
        <Figure
          label="Realised today"
          value={day && day.value != null ? "₹" + fmtNum(day.value) : "—"}
          color={day && day.value != null ? pnlColor(day.value) : undefined}
          hint={day ? (day.closed_today === 0 ? "no closes" : day.closed_today + " closed") : null} />
        {day && day.unresolved > 0 && (
          <div className="px-3 pt-0.5" style={{ fontSize: "var(--t-micro)", color: "var(--accent-amber)" }}>
            {day.unresolved} closed trade{day.unresolved === 1 ? "" : "s"} excluded — P&amp;L unreadable
          </div>
        )}
      </div>
      {marks.paused_reason && (
        <div className="px-3 pb-2.5" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
          Marks paused: {marks.paused_reason}
        </div>
      )}
    </div>
  );
}

// Regime was already on /api/v1/state and rendered NOWHERE, although it is what
// sets min_net_bias and position_multiplier - i.e. the answer to "why is it being
// this selective today". Shown as read, never recomputed.
function RegimePanel({ regime, worldModel }) {
  const g = regime || {};
  const w = worldModel || {};
  const adj = g.sentinel_adjustments || {};
  const dirCol = g.direction === "SHORT_PREFERRED" ? "var(--accent-red)"
               : g.direction === "LONG_PREFERRED" ? "var(--accent-green)" : "var(--text-mid)";
  return (
    <div className="zone" data-testid="agent-regime">
      <div className="px-3 pt-2.5 pb-1 panel-name">Regime</div>
      <div className="px-3 pb-1 flex items-baseline gap-2">
        <span style={{ fontSize: "var(--t-lead)", fontWeight: 600, color: dirCol }}>
          {g.regime || "—"}
        </span>
        <span className="num" style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>
          {g.confidence != null ? fmtNum(g.confidence, 0) + "% conf" : "confidence not stated"}
        </span>
      </div>
      <div className="pb-1.5">
        <Figure label="Bias floor" value={adj.min_net_bias != null ? "≥ " + adj.min_net_bias : "—"} />
        <Figure label="Size multiplier" value={adj.position_multiplier != null ? fmtNum(adj.position_multiplier, 2) + "×" : "—"} />
        {w.data_quality && (
          <Figure label="World model" value={w.data_quality}

// Mode, status, feed age and the controls on one line. In the old layout these were
// three separate full-width bands; none of them needed one.
function CommandRail({ data, ageSeconds }) {
  const { send, pendingKey, flashKey, error } = useCommand(API_BASE + "/api/v1/command");
  const mode = ((data && data.mode) || "").toUpperCase();
  const status = (data && data.status) || "OFFLINE";
  const node = (data && data.current_node) || "—";
  const modeCol = mode === "PAPER" ? "var(--accent-green)" : mode === "OBSERVE" ? "var(--accent-blue)" : "var(--text-dim)";
  const statusCol = STATUS_COLOR[status] || "var(--text-mid)";
  const stale = ageSeconds != null && ageSeconds > STALE_WARN_S;

  return (
    <div className="relative flex items-center gap-3 px-3 py-2 flex-wrap"
         style={{ background: "var(--ink-800)", borderBottom: "1px solid var(--hair)" }}>
      <span className="px-2 py-[3px] rounded"
            style={{ background: modeCol, color: "var(--ink-900)", fontSize: "var(--t-small)", fontWeight: 700 }}>
        {mode || "—"}
      </span>
      <span className="flex items-center gap-1.5">
        <span className={"w-1.5 h-1.5 rounded-full" + (status === "RUNNING" ? " pulse-dot" : "")}
              style={{ background: statusCol }} />
        <span style={{ fontSize: "var(--t-body)", color: statusCol, fontWeight: 500 }}>{status}</span>
      </span>
      <span style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>
        at <span style={{ color: "var(--text-mid)" }}>{node}</span>
      </span>
      <span className="num ml-auto" style={{ fontSize: "var(--t-small)", color: stale ? "var(--accent-amber)" : "var(--text-dim)" }}>
        {fmtAge(ageSeconds)}
      </span>
      <span className="flex items-center gap-1.5">
        {[{ key: "ACTIVATE", label: "Activate", accent: "var(--accent-green)" },
          { key: "OBSERVE",  label: "Observe" },
          { key: "PAPER",    label: "Paper" },
          { key: "LEARN_NOW", label: "Learn now" }].map(c => (
          <CommandButton key={c.key} label={c.label} accent={c.accent}

// The shortlist. Same source as before (/api/v1/shortlist - NOT /state, whose

function ShortlistPanel({ onSelect }) {

  const rows = (data && data.shortlist) || [];
  const total = (data && data.total_count) || rows.length;

  return (
    <div className="flex flex-col h-full zone" data-testid="agent-shortlist">
      <div className="px-3 pt-2.5 pb-1.5 flex items-baseline gap-2">

          </div>
        ) : (
          <table className="num" style={{ fontSize: "var(--t-small)", tableLayout: "fixed", width: "100%" }}>
            <colgroup>
              <col style={{ width: "7rem" }} /><col style={{ width: "2.4rem" }} />
              <col style={{ width: "3.6rem" }} /><col style={{ width: "4.6rem" }} />
              <col style={{ width: "2.6rem" }} />

            <tbody>
              {rows.map((r, i) => (

                    className="cursor-pointer"

// ── Sentinel: the screener console ──────────────────────────────────────────
//
// The old tab was a button, a progress bar and a table on an otherwise empty page.
// What was missing is the thing that makes this a SCREENER instead of a fixed
// scan: `score_confluence` tests every stock against ~34 criteria read from a
// caller-supplied dict, and production passed `{}` for the system's whole life, so
// the parameters existed and nobody could set them.
//
// 🔴 The schema is FETCHED, never hardcoded here. A form showing "RSI 20-35" while
// the scanner applies something else is worse than no form, because the operator
// then believes they know the parameter set. GET /api/v1/sentinel/criteria renders
// it from trading.CRIT_SPEC, and a parity test AST-compares that table against the
// scanner's real crit.get() calls.

function CritField({ spec, side, value, onChange }) {
  const dflt = spec.scope === "directional"
    ? (side === "long" ? spec.default_long : spec.default_short)
    : spec.default;
  const cur = value === undefined ? dflt : value;
  const dirty = value !== undefined && JSON.stringify(value) !== JSON.stringify(dflt);

  const box = {
    background: "var(--ink-850)", border: "1px solid " + (dirty ? "var(--accent-amber)" : "var(--hair)"),
    color: "var(--text-bright)", borderRadius: 3, padding: "2px 5px",
    fontSize: "var(--t-small)", width: "4.2rem",
  };

  return (
    <div className="flex items-center gap-2 py-[3px]">
      <span className="flex-1 min-w-0 truncate" title={spec.help || spec.label}
            style={{ fontSize: "var(--t-small)", color: dirty ? "var(--accent-amber)" : "var(--text-mid)" }}>
        {spec.label}
      </span>
      {spec.type === "bool" ? (
        <input type="checkbox" checked={!!cur}
               onChange={e => onChange(spec.key, e.target.checked)}
               style={{ accentColor: "var(--accent-blue)" }} />
      ) : spec.type === "range" ? (
        <span className="flex items-center gap-1">
          <input className="num" type="number" style={box} value={cur[0]}
                 onChange={e => onChange(spec.key, [e.target.value === "" ? "" : Number(e.target.value), cur[1]])} />
          <span style={{ color: "var(--text-dim)", fontSize: "var(--t-micro)" }}>to</span>
          <input className="num" type="number" style={box} value={cur[1]}
                 onChange={e => onChange(spec.key, [cur[0], e.target.value === "" ? "" : Number(e.target.value)])} />
        </span>
      ) : (
        <span className="flex items-center gap-1">
          <input className="num" type="number" step={spec.step || 1} style={box} value={cur}
                 onChange={e => onChange(spec.key, e.target.value === "" ? "" : Number(e.target.value))} />
          <span style={{ width: "2.2rem", fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>{spec.unit}</span>
        </span>
      )}
    </div>
  );
}

function CriteriaPanel({ side, setSide, overrides, setOverrides, schema, dirtyCount, onReset }) {
  const [openGroup, setOpenGroup] = useState("Momentum");
  // 🔴 Guard the ARRAY, not the object. `if (!schema)` passes an empty-but-truthy
  // {} straight through to `.filter`, which throws - and because every top-level tab
  // stays MOUNTED (DD-6 toggles `display`), that error unmounts the WHOLE app, not
  // just this panel. A 500, a partial payload or a server restart would white-screen
  // the dashboard. Caught by stubbing the endpoint with {}, never by the live test,
  // which only ever saw a healthy server.
  const specs = (schema && Array.isArray(schema.criteria)) ? schema.criteria : null;
  const groups = (schema && Array.isArray(schema.groups)) ? schema.groups : [];
  if (!specs) {
    return (
      <div className="px-3 py-2" style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>
        {schema
          ? "The screener's parameters came back unreadable. The scan still runs on its defaults."
          : "Loading the screener's parameters…"}
      </div>
    );
  }
  const forSide = specs.filter(s =>
    s.scope === "both" || s.scope === "directional" || s.scope === side);

  const set = (key, v) => setOverrides(o => ({ ...o, [side]: { ...(o[side] || {}), [key]: v } }));

  return (
    <div className="flex flex-col h-full zone" data-testid="sentinel-criteria">
      <div className="px-3 pt-2.5 pb-2" style={{ borderBottom: "1px solid var(--hair-soft)" }}>
        <div className="flex items-baseline gap-2 mb-2">
          <span className="panel-name">Screener criteria</span>
          <span className="num" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
            {schema.count != null ? schema.count : forSide.length}
          </span>
          {dirtyCount > 0 && (
            <button onClick={onReset} className="ml-auto" style={{
              fontSize: "var(--t-micro)", color: "var(--accent-amber)", textDecoration: "underline" }}>
              reset {dirtyCount} changed
            </button>
          )}
        </div>
        <div className="flex gap-1">
          {["long", "short"].map(s => (
            <button key={s} onClick={() => setSide(s)}
              className="px-2.5 py-1 rounded"
              style={{
                fontSize: "var(--t-small)", fontWeight: 600,
                background: side === s
                  ? (s === "long" ? "var(--accent-green)" : "var(--accent-red)") : "var(--ink-850)",
                color: side === s ? "var(--ink-900)" : "var(--text-mid)",
              }}>
              {s === "long" ? "Long" : "Short"}
            </button>
          ))}
        </div>
        <div className="mt-1.5" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
          Each side is scored separately. A field left at its default is identical to
          not sending it.
        </div>
      </div>

      <div className="flex-1 min-h-0 overflow-auto">
        {groups.map(g => {
          const rows = forSide.filter(s => s.group === g);
          if (!rows.length) return null;
          const open = openGroup === g;
          const changed = rows.filter(s => (overrides[side] || {})[s.key] !== undefined).length;
          return (
            <div key={g} style={{ borderBottom: "1px solid var(--hair-soft)" }}>
              <button onClick={() => setOpenGroup(open ? null : g)}
                className="w-full flex items-center gap-2 px-3 py-[7px] text-left"
                style={{ background: open ? "var(--ink-700)" : "transparent" }}>
                <span className="group-head" style={{ fontSize: "var(--t-body)",
                      color: open ? "var(--text-bright)" : "var(--text-mid)" }}>{g}</span>
                <span className="num" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
                  {rows.length}
                </span>
                {changed > 0 && (
                  <span className="num px-1 rounded" style={{
                    fontSize: "var(--t-micro)", background: tint("--accent-amber", 18),
                    color: "var(--accent-amber)" }}>{changed}</span>
                )}
                <span className="ml-auto" style={{ color: "var(--text-dim)", fontSize: "var(--t-micro)" }}>
                  {open ? "−" : "+"}
                </span>
              </button>
              {open && (
                <div className="px-3 pb-2">
                  {rows.map(s => (
                    <CritField key={s.key} spec={s} side={side}
                               value={(overrides[side] || {})[s.key]} onChange={set} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SentinelTab() {
  const [scanId, setScanId] = useState(null);
  const [scanState, setScanState] = useState(null);
  const [starting, setStarting] = useState(false);
  const [startError, setStartError] = useState(null);
  const [rejected, setRejected] = useState([]);
  const [sortDesc, setSortDesc] = useState(true);
  const [dirFilter, setDirFilter] = useState("ALL");
  const [side, setSide] = useState("long");
  const [overrides, setOverrides] = useState({ long: {}, short: {} });
  const [selectedTicker, setSelectedTicker] = useState(null);
  const { setTicker } = useTicker();
  const openTicker = useCallback((t) => { setSelectedTicker(t); setTicker(t); }, [setTicker]);
  const pollTimerRef = useRef(null);

  const { data: schema } = usePolling(API_BASE + "/api/v1/sentinel/criteria", 300000);
  const isActive = scanState && (scanState.status === "QUEUED" || scanState.status === "RUNNING");
  const dirtyCount = Object.values(overrides).reduce((n, o) => n + Object.keys(o || {}).length, 0);

  const startScan = async () => {
    setStarting(true); setStartError(null); setRejected([]);
    try {
      const res = await fetch(API_BASE + "/api/v1/sentinel/scan", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ criteria: overrides }),
      });
      const json = await res.json();
      // Rejections are SURFACED. A setting silently dropped is how an operator
      // comes to believe a scan ran under criteria it never saw.
      if (json && json.criteria_rejected && json.criteria_rejected.length) setRejected(json.criteria_rejected);
      if (json && json.scan_id) setScanId(json.scan_id);
      else setStartError("No scan_id in response");
    } catch (e) {
      setStartError(String(e && e.message ? e.message : e));
    } finally { setStarting(false); }
  };

  useEffect(() => {
    if (!scanId) return;
    let cancelled = false;
    async function poll() {
      try {
        const res = await fetch(API_BASE + "/api/v1/sentinel/status/" + scanId);
        if (res.ok) {
          const json = await res.json();
          if (!cancelled) {
            setScanState(json);
            if (json.status === "DONE" || json.status === "FAILED") return;
          }
        }
      } catch (e) { /* keep last known state, retry */ }
      if (!cancelled) pollTimerRef.current = setTimeout(poll, 1000);
    }
    poll();
    return () => { cancelled = true; if (pollTimerRef.current) clearTimeout(pollTimerRef.current); };
  }, [scanId]);

  const results = (scanState && scanState.results) || [];
  const shown = useMemo(() => {
    const f = dirFilter === "ALL" ? results
      : results.filter(r => r.dominant_direction === dirFilter);
    return [...f].sort((a, b) => sortDesc ? (b.net_bias - a.net_bias) : (a.net_bias - b.net_bias));
  }, [results, sortDesc, dirFilter]);

  const mix = useMemo(() => {
    const m = { LONG: 0, SHORT: 0, NEUTRAL: 0 };
    results.forEach(r => { if (m[r.dominant_direction] !== undefined) m[r.dominant_direction]++; });
    return m;
  }, [results]);

  const progress = (scanState && scanState.progress) || { scanned: 0, total: 0 };
  const progressPct = progress.total ? Math.min((progress.scanned / progress.total) * 100, 100) : 3;
  const appliedCount = scanState && scanState.criteria
    ? Object.keys(scanState.criteria.long || {}).length + Object.keys(scanState.criteria.short || {}).length
    : 0;

  return (
    <div className="flex flex-col h-full overflow-hidden" style={{ background: "var(--ink-900)" }}>
      <div className="flex items-center gap-3 px-3 py-2 flex-wrap"
           style={{ background: "var(--ink-800)", borderBottom: "1px solid var(--hair)" }}>
        <button onClick={startScan} disabled={starting || isActive}
          className="px-3 py-1.5 rounded disabled:opacity-50"
          style={{ background: "var(--accent-blue)", color: "var(--ink-900)",
                   fontSize: "var(--t-small)", fontWeight: 600 }}>
          {isActive ? "Scanning…" : dirtyCount > 0 ? "Run scan with " + dirtyCount + " change" + (dirtyCount === 1 ? "" : "s") : "Run scan"}
        </button>
        {isActive && (
          <span className="flex items-center gap-2" style={{ minWidth: 220 }}>
            <span className="num" style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>
              {progress.scanned}/{progress.total || "…"}
            </span>
            <span className="flex-1 h-[3px] sunken" style={{ borderRadius: 2, minWidth: 120 }}>
              <span style={{ display: "block", width: progressPct + "%", height: "100%",
                             background: "var(--accent-blue)", borderRadius: 2 }} />
            </span>
          </span>
        )}
        {scanState && scanState.status === "DONE" && (
          <span className="num" style={{ fontSize: "var(--t-small)", color: "var(--text-dim)" }}>
            {progress.scanned} scanned
            {appliedCount > 0 && (
              <span style={{ color: "var(--accent-amber)" }}> · {appliedCount} criteria applied</span>
            )}
          </span>
        )}
        <span className="ml-auto flex items-center gap-1">
          {["ALL", "LONG", "SHORT"].map(d => (
            <button key={d} onClick={() => setDirFilter(d)}
              className="px-2 py-1 rounded"
              style={{ fontSize: "var(--t-micro)", fontWeight: 600,
                       background: dirFilter === d ? "var(--ink-700)" : "transparent",
                       color: dirFilter === d
                         ? (d === "LONG" ? "var(--accent-green)" : d === "SHORT" ? "var(--accent-red)" : "var(--text-bright)")
                         : "var(--text-dim)" }}>
              {d === "ALL" ? "All" : d === "LONG" ? "Long " + mix.LONG : "Short " + mix.SHORT}
            </button>
          ))}
        </span>
      </div>

      {rejected.length > 0 && (
        <div className="px-3 py-2" data-testid="criteria-rejected"
             style={{ background: tint("--accent-amber", 10), borderBottom: "1px solid var(--accent-amber)" }}>
          <div style={{ fontSize: "var(--t-small)", color: "var(--accent-amber)", fontWeight: 600 }}>
            {rejected.length} setting{rejected.length === 1 ? " was" : "s were"} not applied
          </div>
          {rejected.map((r, i) => (
            <div key={i} className="num" style={{ fontSize: "var(--t-micro)", color: "var(--text-mid)" }}>{r}</div>
          ))}
        </div>
      )}

      {startError && (
        <div className="px-3 py-2" style={{ background: tint("--accent-red", 10),
             borderBottom: "1px solid var(--accent-red)", color: "var(--accent-red)", fontSize: "var(--t-small)" }}>
          Could not start the scan: {startError}
        </div>
      )}
      {scanState && scanState.status === "FAILED" && (
        <div className="px-3 py-2 whitespace-pre-wrap" style={{ background: tint("--accent-red", 10),
             borderBottom: "1px solid var(--accent-red)", color: "var(--accent-red)", fontSize: "var(--t-small)" }}>
          Scan failed: {scanState.error}
        </div>
      )}

      <div className="sentinel-grid flex-1 min-h-0">
        <div style={{ borderRight: "1px solid var(--hair)", minHeight: 0 }}>
          <CriteriaPanel side={side} setSide={setSide} overrides={overrides}
                         setOverrides={setOverrides} schema={schema} dirtyCount={dirtyCount}
                         onReset={() => setOverrides({ long: {}, short: {} })} />
        </div>

        <div className="flex flex-col min-h-0 zone" data-testid="sentinel-results">
          {/* DD-5/DD-15: the DATA PATH, stated. These rows come from an ad-hoc
              ScanWorker run started by the button above; the shortlist the AGENT
              trades on is engine-precomputed in agent_state.json and a
              POST /api/v1/sentinel/scan never writes there. Showing them
              identically would imply this scan fed the loop. */}
          {scanState && scanState.status === "DONE" && (
            <div className="px-3 py-1.5" data-testid="scan-source"
                 style={{ borderBottom: "1px solid var(--hair-soft)",
                          fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
              Ad-hoc scan from this browser. The agent trades its own
              engine-precomputed shortlist, on the AGENT tab — this did not feed it.
            </div>
          )}
          <div className="flex-1 min-h-0 overflow-auto">
            {!scanState ? (
              /* An empty screen is an invitation to act, not a blank. This one says
                 what the scan will do and what it will not (it does not feed the
                 agent loop), so the first thing an operator learns is the data path. */
              <div className="h-full flex items-center justify-center px-6">
                <div style={{ maxWidth: "34rem" }}>
                  <div style={{ fontSize: "var(--t-lead)", fontWeight: 600, color: "var(--text-bright)" }}>
                    Declare the market you want.
                  </div>
                  <div className="mt-1.5" style={{ fontSize: "var(--t-body)", color: "var(--text-mid)", lineHeight: 1.6 }}>
                    Every stock in the universe is scored against all
                    {" "}{schema ? schema.count : ""} criteria on the left, in both
                    directions, and ranked by how many agree. Change as few or as many
                    as you like &mdash; anything you leave alone keeps the value the
                    scanner already uses.
                  </div>
                  <div className="mt-3 flex gap-6">
                    {[["Universe", "~500 NSE names"],
                      ["Scored", "both long and short"],
                      ["Feeds the agent", "no — ad-hoc only"]].map(([k, v]) => (
                      <div key={k}>
                        <div style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>{k}</div>
                        <div className="num" style={{ fontSize: "var(--t-small)", color: "var(--text-mid)" }}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : scanState.status === "DONE" && shown.length === 0 ? (
              <div className="px-3 py-3" style={{ fontSize: "var(--t-body)", color: "var(--text-dim)" }}>
                {results.length === 0
                  ? "The scan completed and nothing scored."
                  : "No " + dirFilter + " candidates in " + results.length + " results."}
              </div>
            ) : (
              <table className="num w-full" style={{ fontSize: "var(--t-small)" }}>
                <thead>
                  <tr style={{ color: "var(--text-dim)", fontSize: "var(--t-micro)" }}>
                    <th className="text-left pl-3 pr-2 py-1.5">Symbol</th>
                    <th className="text-right px-2 py-1.5 cursor-pointer select-none"
                        onClick={() => setSortDesc(!sortDesc)}>
                      Net bias {sortDesc ? "▼" : "▲"}
                    </th>
                    <th className="text-left px-2 py-1.5">Direction</th>
                    <th className="text-right px-2 py-1.5">LTP</th>
                    <th className="text-left px-2 py-1.5">Tier</th>
                    <th className="text-right pr-3 pl-1 py-1.5">F&amp;O</th>
                  </tr>
                </thead>
                <tbody>
                  {shown.map((r, i) => (
                    <tr key={r.ticker || i} className="cursor-pointer"
                        onClick={() => r.ticker && openTicker(r.ticker)}
                        onMouseEnter={e => { e.currentTarget.style.background = "var(--ink-700)"; }}
                        onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}
                        title="Open the drill-down for this ticker">
                      <td className="pl-3 pr-2 py-[6px]" style={{ color: "var(--accent-blue)" }}>{r.ticker}</td>
                      <td className="px-2 py-[6px] text-right"
                          style={{ color: r.net_bias >= 0 ? "var(--accent-green)" : "var(--accent-red)" }}>
                        {r.net_bias > 0 ? "+" + r.net_bias : r.net_bias}
                      </td>
                      <td className="px-2 py-[6px]" style={{
                        color: r.dominant_direction === "LONG" ? "var(--accent-green)"
                             : r.dominant_direction === "SHORT" ? "var(--accent-red)" : "var(--text-mid)" }}>
                        {r.dominant_direction}
                      </td>
                      <td className="px-2 py-[6px] text-right" style={{ color: "var(--text-bright)" }}>{r.LTP}</td>
                      <td className="px-2 py-[6px]" style={{ color: "var(--text-dim)" }}>{r.tier}</td>
                      <td className="pr-3 pl-1 py-[6px] text-right">
                        {r.fo_eligible && (
                          <span className="px-1 rounded" style={{
                            background: tint("--accent-blue", 14), color: "var(--accent-blue)",
                            fontSize: "var(--t-micro)" }}>F&amp;O</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      </div>

      <StockDrilldownModal ticker={selectedTicker} onClose={() => setSelectedTicker(null)} />
    </div>
  );
}

// ── Paper Trading tab ────────────────────────────────────────────────────

function DistanceBar({ pct, varName }) {
  if (pct === null || pct === undefined) {
    return <div className="text-[10px]" style={{ color: "var(--text-dim)" }}>—</div>;
  }
  const width = Math.min(Math.max(pct, 0), 100); // presentational clamp only, not a financial computation
  return (
    <div className="w-full">
      <div className="h-1.5 rounded-full border overflow-hidden" style={{ background: "var(--bg-primary)", borderColor: "var(--border)" }}>
        <div className="h-full" style={{ width: width + "%", background: `var(${varName})` }}></div>
      </div>
      <div className="text-[10px] mt-0.5" style={{ color: "var(--text-dim)" }}>{fmtNum(pct, 2)}%</div>
    </div>
  );
}

/** Portfolio analytics for the EXISTING Paper Trading tab (DD-15).
 *
 * Every number is computed server-side by compute_portfolio_analytics; nothing
 * here derives a metric. QuantStats was declined — it pulls seaborn/matplotlib
 * as a hard dependency, which would break the single Plotly + CSS-token system.
 *
 * With no closed trades the panel says the metrics are UNDEFINED rather than
 * rendering zeros: a 0% win rate and "no trades yet" are opposite claims. */
/** ClassBadge — the trade CLASS (INTRADAY / FNO / DELIVERY) on a position.
 *  These are three different lifecycles, not labels: INTRADAY carries 5x
 *  margin and a forced 15:15 square-off, FNO prices in premium, DELIVERY is
 *  fully paid and holds 7-10 days (trading_classes.py). A book that does not
 *  show which is which cannot be read at a glance.
 *  EXPLORATION is surfaced alongside because a quota-forced trade is one the
 *  EV gate REJECTED — pooling it visually with a policy trade is the same
 *  mistake attribution.py and calibration.py both refuse to make. */
function ClassBadge({ cls, mode }) {
  const c = cls || "UNCLASSIFIED";
  const varName = c === "INTRADAY" ? "--accent-amber"
                : c === "FNO"      ? "--accent-blue"
                : c === "DELIVERY" ? "--accent-green"
                :                    "--text-dim";
  return (
    <span className="inline-flex items-center gap-1">
      <span className="px-1.5 py-0.5 rounded text-[9px] font-semibold tracking-wide"
            style={{ background: tint(varName, 15), color: `var(${varName})`,
                     border: `1px solid ${tint(varName, 40)}` }}>
        {c}
      </span>
      {mode === "EXPLORATION" && (
        <span className="px-1 py-0.5 rounded text-[8px] tracking-wide"
              title="Quota-forced trade — the EV gate rejected this. Excluded from calibration."
              style={{ background: tint("--accent-orange", 12),
                       color: "var(--accent-orange)" }}>
          EXPL
        </span>
      )}
    </span>
  );
}

/** Flicker cell — flashes green/red for ~600ms when its number changes.
 *  This is the Kite/Angel "ticking" behaviour: the eye needs the CHANGE, not
 *  just the value. Purely presentational — the number itself still comes from
 *  the server untouched, per this file's no-client-side-finance rule; we only
 *  compare the previous render's value to decide a background tint. */
function Tick({ value, render, className, style }) {
  const prev = React.useRef(value);
  const [flash, setFlash] = React.useState(null);
  React.useEffect(() => {
    const p = prev.current;
    if (p !== null && p !== undefined && value !== null && value !== undefined
        && Number(value) !== Number(p)) {
      setFlash(Number(value) > Number(p) ? "up" : "down");
      const t = setTimeout(() => setFlash(null), 600);
      prev.current = value;
      return () => clearTimeout(t);
    }
    prev.current = value;
  }, [value]);
  const bg = flash === "up" ? tint("--accent-green", 22)
           : flash === "down" ? tint("--accent-red", 22) : "transparent";
  return (
    <span className={className}
          style={{ ...(style || {}), background: bg, borderRadius: 3,
                   padding: "1px 4px", transition: "background 260ms ease" }}>
      {render !== undefined ? render : fmtNum(value)}
    </span>
  );
}

/** MarkBadge — is this price THIS SECOND, or the monitor's last 30s fetch?
 *  A frozen number that claims to be live is worse than an honestly stale
 *  one: a 3-hour monitoring outage on 2026-08-17 was invisible precisely
 *  because nothing on screen distinguished the two. */
function MarkBadge({ src, ageS }) {
  const live = src === "LIVE";
  const v = live ? "--accent-green" : "--accent-amber";
  return (
    <span className="px-1 py-0.5 rounded text-[8px] tracking-wide"
          title={live ? `live mark, ${ageS}s old`
                      : `MonitoringAgent mark, ${ageS}s old — not a live tick`}
          style={{ background: tint(v, 12), color: `var(${v})` }}>
      {live ? "SNAP" : "MON"}
    </span>
  );
}

// ── Stock drill-down panel (Sprint DD-3) ────────────────────────────────
// Consumes DD-2's /api/v1/stock/{ticker}/{shortlist-params,charts,live}.
// Opened from a SentinelTab row click. Every number here still comes from
// the server (shortlist-params, charts, live) — this panel only formats and
// lays out what the API returns, same rule as the rest of this file.

/** useOneShotFetch — fetch-once-per-url, with a manual `reload()` escape
 * hatch and an optional `intervalMs` auto-refresh. Distinct from usePolling:
 * shortlist params and chart figures don't need a tight poll loop
 * (score_confluence/chain snapshots don't change second-to-second), so this
 * avoids hammering the backend every render — but chart data does drift
 * over a session, so callers that want it kept current (ChartsSection, at
 * 10-15s) pass intervalMs instead of relying on the manual refresh button. */
// ── Paper Trading: the blotter ──────────────────────────────────────────────
//
// 🔴 TWO BOOKS UNDER ONE HEADING. This tab used to render "No closed trades yet"
// directly above a table of three live positions, because the analytics strip read
// /api/v1/paper/analytics (paper_trades.json — trading_engine's PaperTrader) while
// the positions table read /api/v1/positions (the PositionStore, where the AGENT's
// fills live). Both were correct about their own ledger and the pairing was a lie.
//
// It now leads with /api/v1/analytics/pnl, which reads the SAME PositionStore the
// positions come from, and names the PaperTrader book separately so its emptiness
// cannot read as a statement about the agent's trading.
//
// Standing rule, unchanged: no financial value is computed here. The only
// client-side arithmetic is a marker POSITION on a bar — presentational placement,
// the same licence DistanceBar already takes, and it renders no number of its own.

function Metric({ label, value, tone, sub, wide }) {
  return (
    <div style={{ minWidth: wide ? "9rem" : "6.5rem" }}>
      <div style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>{label}</div>
      <div className="num" style={{ fontSize: "var(--t-lead)", lineHeight: 1.15, color: tone || "var(--text-bright)" }}>
        {value}
      </div>
      {sub && <div style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>{sub}</div>}
    </div>
  );
}

// Where the mark sits between the stop and the target. The one genuinely useful
// picture in a blotter: a position two thirds of the way to its target and one
// sitting on its stop look identical in a P&L column.
// ⚠️ Placement only — no number is derived here, and a missing level renders the
// rail empty rather than guessing an endpoint.
function StopTargetRail({ sl, target, mark, direction }) {
  const ok = [sl, target, mark].every(v => v !== null && v !== undefined && isFinite(v));
  if (!ok || sl === target) {
    return <div style={{ height: 3 }} title="stop or target not recorded" />;
  }
  const lo = Math.min(sl, target), hi = Math.max(sl, target);
  const frac = Math.min(Math.max((mark - lo) / (hi - lo), 0), 1);   // presentational clamp
  const towardTarget = direction === "SHORT" ? target < sl : target > sl;
  const pos = towardTarget ? frac : 1 - frac;
  return (
    <div className="relative" style={{ height: 3, background: "var(--ink-850)", borderRadius: 2 }}
         title={"stop " + fmtNum(sl) + "  mark " + fmtNum(mark) + "  target " + fmtNum(target)}>
      <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: (pos * 100) + "%",
                    background: tint("--accent-blue", 45), borderRadius: 2 }} />
      <div style={{ position: "absolute", left: "calc(" + (pos * 100) + "% - 1px)", top: -2, bottom: -2,
                    width: 2, background: "var(--text-bright)" }} />
    </div>
  );
}

function BlotterRow({ r, onSelect }) {
  const live = r.mark_source === "LIVE";
  const dirCol = r.dominant_direction === "SHORT" ? "var(--accent-red)" : "var(--accent-green)";
  return (

        onMouseEnter={e => { e.currentTarget.style.background = "var(--ink-700)"; }}
        onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}
        title="Open the decision trail for this position">
      <td className="pl-3 pr-2 py-[7px]" style={{ color: "var(--accent-blue)" }}>{r.ticker}</td>
      <td className="px-2 py-[7px]" style={{ color: dirCol }}>{r.dominant_direction}</td>
      <td className="px-2 py-[7px]" style={{ fontSize: "var(--t-micro)", color: "var(--text-dim)" }}>
        {r.trade_class}
        {r.selection_mode === "EXPLORATION" && (
          <span className="ml-1 px-1 rounded" style={{
            background: tint("--accent-orange", 16), color: "var(--accent-orange)" }}>exp</span>
        )}
      </td>
      <td className="px-2 py-[7px] text-right" style={{ color: "var(--text-dim)" }}>{r.position_size}</td>
      <td className="px-2 py-[7px] text-right" style={{ color: "var(--text-mid)" }}>{fmtNum(r.entry_effective)}</td>
      <td className="px-2 py-[7px] text-right" style={{ color: "var(--text-bright)" }}>
        <Tick value={r.last_ltp} render={r.last_ltp != null ? fmtNum(r.last_ltp) : "—"} />
        <span style={{ fontSize: "var(--t-micro)", color: live ? "var(--accent-green)" : "var(--text-dim)" }}>
          {" " + (live ? "live" : "mon")}
        </span>
      </td>
      <td className="px-2 py-[7px]" style={{ minWidth: "7rem" }}>
        <StopTargetRail sl={r.sl} target={r.target} mark={r.last_ltp} direction={r.dominant_direction} />
